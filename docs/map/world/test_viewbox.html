<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Azgaar SVG viewBox 驗證</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; }
#map-container {
  width: 100%; height: 100%;
  position: relative;
  touch-action: none;
}
#map-container svg { display: block; width: 100%; height: 100%; }
#hud {
  position: fixed; top: 12px; left: 12px;
  background: rgba(0,0,0,0.7); color: #e0e0e0;
  font: 13px/1.4 monospace; padding: 8px 12px;
  border-radius: 6px; pointer-events: none;
  z-index: 10;
}
#player {
  position: fixed;
  top: 50%; left: 50%;
  transform: translate(-50%, -50%);
  font-size: 28px; color: #fff;
  text-shadow: 0 0 6px #000, 0 0 12px rgba(255,200,50,0.6);
  pointer-events: none; z-index: 5;
  line-height: 1;
}
#zoom-controls {
  position: fixed; bottom: 16px; right: 16px;
  display: flex; flex-direction: column; gap: 6px; z-index: 10;
}
#zoom-controls button {
  width: 40px; height: 40px; font-size: 20px;
  border: 1px solid #555; border-radius: 6px;
  background: rgba(0,0,0,0.7); color: #fff; cursor: pointer;
}
#zoom-controls button:hover { background: rgba(60,60,80,0.9); }
#cities {
  position: fixed; bottom: 16px; left: 16px;
  display: flex; gap: 6px; z-index: 10;
}
#cities button {
  padding: 6px 12px; font-size: 13px;
  border: 1px solid #555; border-radius: 6px;
  background: rgba(0,0,0,0.7); color: #fff; cursor: pointer;
}
#cities button:hover { background: rgba(60,60,80,0.9); }
</style>
</head>
<body>
<div id="hud"></div>
<div id="player">葉</div>
<div id="zoom-controls">
  <button id="btn-in">+</button>
  <button id="btn-out">−</button>
</div>
<div id="cities">
  <button onclick="flyTo(7609,73389,4000)">龍國場（葉卅）</button>
  <button onclick="flyTo(41393,31175,4000)">耶奧恩</button>
  <button onclick="flyTo(48969,45856,40000)">全景</button>
</div>
<div id="map-container"></div>

<script>
const SVG_FILE = 'Celia 2026-01-25-04-11.svg';

let vx, vy, vw, vh;
let svgEl = null;
let dragging = false;
let lastX, lastY;
let pinchDist = 0;

const MIN_W = 800;
const MAX_W = 80000;

function setView(x, y, w) {
  vx = x; vy = y; vw = w;
  vh = w * (window.innerHeight / window.innerWidth);
  if (svgEl) svgEl.setAttribute('viewBox', `${vx} ${vy} ${vw} ${vh}`);
  updateHud();
}

function updateHud() {
  const z = (MAX_W / vw).toFixed(1);
  document.getElementById('hud').textContent =
    `viewBox: ${vx.toFixed(0)},${vy.toFixed(0)} ${vw.toFixed(0)}×${vh.toFixed(0)}  zoom: ${z}x`;
}

function flyTo(cx, cy, w) {
  const h = w * (window.innerHeight / window.innerWidth);
  setView(cx - w/2, cy - h/2, w);
}

function zoom(factor, clientX, clientY) {
  const rect = svgEl.getBoundingClientRect();
  const fx = (clientX - rect.left) / rect.width;
  const fy = (clientY - rect.top) / rect.height;
  const newW = Math.max(MIN_W, Math.min(MAX_W, vw / factor));
  const newH = newW * (window.innerHeight / window.innerWidth);
  const newX = vx + (vw - newW) * fx;
  const newY = vy + (vh - newH) * fy;
  setView(newX, newY, newW);
}

async function init() {
  const resp = await fetch(SVG_FILE);
  const text = await resp.text();
  const container = document.getElementById('map-container');
  container.innerHTML = text;
  svgEl = container.querySelector('svg');
  svgEl.removeAttribute('width');
  svgEl.removeAttribute('height');
  svgEl.style.width = '100%';
  svgEl.style.height = '100%';

  flyTo(7609, 73389, 6000);

  container.addEventListener('pointerdown', e => {
    if (e.pointerType === 'touch' && e.isPrimary === false) return;
    dragging = true;
    lastX = e.clientX; lastY = e.clientY;
    container.setPointerCapture(e.pointerId);
  });
  container.addEventListener('pointermove', e => {
    if (!dragging) return;
    const dx = e.clientX - lastX;
    const dy = e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    const rect = svgEl.getBoundingClientRect();
    const sx = vw / rect.width;
    const sy = vh / rect.height;
    setView(vx - dx * sx, vy - dy * sy, vw);
  });
  container.addEventListener('pointerup', () => { dragging = false; });
  container.addEventListener('pointercancel', () => { dragging = false; });

  container.addEventListener('wheel', e => {
    e.preventDefault();
    const factor = e.deltaY < 0 ? 1.15 : 1/1.15;
    zoom(factor, e.clientX, e.clientY);
  }, { passive: false });

  container.addEventListener('touchstart', e => {
    if (e.touches.length === 2) {
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      pinchDist = Math.sqrt(dx*dx + dy*dy);
    }
  });
  container.addEventListener('touchmove', e => {
    if (e.touches.length === 2) {
      const dx = e.touches[0].clientX - e.touches[1].clientX;
      const dy = e.touches[0].clientY - e.touches[1].clientY;
      const dist = Math.sqrt(dx*dx + dy*dy);
      if (pinchDist > 0) {
        const cx = (e.touches[0].clientX + e.touches[1].clientX) / 2;
        const cy = (e.touches[0].clientY + e.touches[1].clientY) / 2;
        zoom(dist / pinchDist, cx, cy);
      }
      pinchDist = dist;
    }
  });

  document.getElementById('btn-in').addEventListener('click', () => {
    zoom(1.4, window.innerWidth/2, window.innerHeight/2);
  });
  document.getElementById('btn-out').addEventListener('click', () => {
    zoom(1/1.4, window.innerWidth/2, window.innerHeight/2);
  });

  window.addEventListener('resize', () => {
    vh = vw * (window.innerHeight / window.innerWidth);
    if (svgEl) svgEl.setAttribute('viewBox', `${vx} ${vy} ${vw} ${vh}`);
  });
}

init();
</script>
</body>
</html>
