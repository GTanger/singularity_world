<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Antigravity RC PRO</title>
    <link rel="manifest" href="/manifest.json">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #0d1117; color: #c9d1d9; font-family: -apple-system, sans-serif; height: 100vh; overflow: hidden; display: flex; flex-direction: column; }
        .header { padding: 15px; border-bottom: 1px solid #30363d; background: #161b22; display: flex; justify-content: space-between; align-items: center; }
        .status-dot { width: 10px; height: 10px; background-color: #238636; border-radius: 50%; display: inline-block; margin-right: 5px; box-shadow: 0 0 8px #238636; }
        .chat-container { flex: 1; overflow-y: auto; padding: 20px; display: flex; flex-direction: column; gap: 12px; }
        .msg { max-width: 85%; padding: 12px 16px; border-radius: 18px; font-size: 15px; line-height: 1.5; }
        .msg-user { align-self: flex-end; background-color: #238636; color: white; border-bottom-right-radius: 4px; }
        .msg-ai { align-self: flex-start; background-color: #21262d; border-bottom-left-radius: 4px; border: 1px solid #30363d; }
        .footer { padding: 15px 20px 25px 20px; border-top: 1px solid #30363d; background-color: #161b22; }
        .input-group-custom { background-color: #0d1117; border: 1px solid #30363d; border-radius: 30px; padding: 6px 18px; display: flex; align-items: center; }
        #messageInput { background: transparent; border: none; color: white; flex: 1; padding: 10px; outline: none; font-size: 16px; }
        .btn-upload { background: transparent; border: none; color: #8b949e; margin-right: 12px; font-size: 22px; cursor: pointer; }
        .preview-container { display: none; padding: 15px; border-top: 1px solid #30363d; background: #0d1117; }
        .img-preview { max-width: 120px; max-height: 120px; border-radius: 12px; border: 2px solid #30363d; }
        .loader { width: 14px; height: 14px; border: 2px solid #fff; border-bottom-color: transparent; border-radius: 50%; display: inline-block; animation: rotation 1s linear infinite; margin-left: 8px; }
        @keyframes rotation { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
        @supports (padding: env(safe-area-inset-bottom)) { .footer { padding-bottom: calc(15px + env(safe-area-inset-bottom)); } }
    </style>
</head>
<body>
    <div class="header">
        <div>
            <span class="status-dot"></span><strong>ARC PRO</strong> 
            <select id="modelSelect" class="form-select form-select-sm d-inline-block w-auto ms-2" style="background-color: #21262d; color: #c9d1d9; border: 1px solid #30363d;">
                <option value="">模型: 系統預設</option>
                <option value="gemini 3.1 pro (high)">Gemini 3.1 Pro (High)</option>
                <option value="gemini 3 flash">Gemini 3 Flash</option>
                <option value="claude sonnet 4.6 (thinking)">Claude Sonnet 4.6</option>
                <option value="claude opus 4.6 (thinking)">Claude Opus 4.6</option>
                <option value="gpt-oss 120b (medium)">GPT-OSS 120B</option>
            </select>
        </div>
        <div style="font-size: 10px; color: #8b949e;" id="statusText">已連線</div>
    </div>
    
    <div id="chat" class="chat-container"></div>

    <div id="previewArea" class="preview-container"><img id="imgPreview" class="img-preview" src=""><button onclick="clearImage()" class="btn btn-sm btn-danger rounded-circle ms-2">×</button></div>

    <div class="footer">
        <div class="input-group-custom">
            <label for="imageUpload" class="btn-upload">📎</label>
            <input type="file" id="imageUpload" style="display: none;" accept="image/*" onchange="handleImageSelect(event)">
            <input type="text" id="messageInput" placeholder="與本機流暢同步..." onkeypress="handleKey(event)">
            <button id="sendBtn" class="btn btn-success btn-sm rounded-pill px-4 py-2" onclick="sendMessage()">發送</button>
        </div>
    </div>

    <script>
        let selectedFile = null;
        let ws = null;

        function connectWS() {
            const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
            ws = new WebSocket(`${protocol}//${window.location.host}/ws`);
            
            ws.onmessage = (event) => {
                const data = JSON.parse(event.data);
                addMessage(data.content, data.role);
            };

            ws.onclose = () => {
                document.getElementById('statusText').innerText = '連線中斷... 重試中';
                setTimeout(connectWS, 2000);
            };

            ws.onopen = () => {
                document.getElementById('statusText').innerText = '雙向同步中';
            }
        }

        connectWS();

        function addMessage(text, role) {
            const chat = document.getElementById('chat');
            const div = document.createElement('div');
            div.className = `msg msg-${role}`;
            div.innerText = text;
            chat.appendChild(div);
            chat.scrollTop = chat.scrollHeight;
        }

        function handleImageSelect(event) {
            selectedFile = event.target.files[0];
            if (selectedFile) {
                const reader = new FileReader();
                reader.onload = (e) => {
                    document.getElementById('imgPreview').src = e.target.result;
                    document.getElementById('previewArea').style.display = 'block';
                };
                reader.readAsDataURL(selectedFile);
            }
        }

        function clearImage() {
            selectedFile = null;
            document.getElementById('previewArea').style.display = 'none';
        }

        function handleKey(e) { if (e.key === 'Enter') sendMessage(); }

        async function sendMessage() {
            const input = document.getElementById('messageInput');
            const text = input.value.trim();
            const btn = document.getElementById('sendBtn');
            if (!text && !selectedFile) return;
            btn.disabled = true;
            btn.innerHTML = '注入中<span class="loader"></span>';
            const modelSelect = document.getElementById('modelSelect').value;
            const formData = new FormData();
            formData.append('text', text);
            if (modelSelect) formData.append('model', modelSelect);
            if (selectedFile) formData.append('file', selectedFile);
            try {
                const response = await fetch('/chat', { method: 'POST', body: formData });
                const result = await response.json();
                if (result.status === 'ok') {
                    clearImage();
                    input.value = '';
                } else {
                    addMessage("注入失敗: " + result.detail, 'ai');
                }
            } catch (err) {
                addMessage("連線斷開: " + err, 'ai');
            } finally {
                btn.disabled = false;
                btn.innerText = '發送';
            }
        }
    </script>
</body>
</html>
