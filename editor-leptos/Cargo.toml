[package]
name = "editor-leptos"
version = "0.1.0"
edition = "2021"

[dependencies]
leptos = { version = "0.8", features = ["csr"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gloo-net = { version = "0.6", features = ["http"] }
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
js-sys = "0.3"
console_error_panic_hook = "0.1"
web-sys = { version = "0.3", features = [
  "Window", "Document", "Element", "HtmlElement", "DomRect",
  "TouchEvent", "TouchList", "Touch", "console",
  "AddEventListenerOptions", "EventTarget", "SvgElement",
  "ResizeObserver", "ResizeObserverEntry", "DomRectReadOnly",
  "HtmlCanvasElement", "CanvasRenderingContext2d",
  "MouseEvent", "WheelEvent",
  "HtmlInputElement", "FileList", "File",
  "UrlSearchParams", "Location",
] }
