<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>奇點世界｜山海人物與風土戰史全誌</title>
<style>
  :root {
    --bg-page: #ede5d4;
    --bg-surface: #f7f1e3;
    --bg-sheet: #fcf9f2;
    --bg-chip: #e6dcc8;
    --bg-chip-hover: #dacdb4;
    --ink-main: #241b13;
    --ink-sub: #5c4c3b;
    --ink-muted: #85735e;
    --border-line: #d3c5ad;
    --accent-main: #8b381d;
    --accent-main-ink: #fdfaf4;
    --accent-gold: #9d6c1e;
    --accent-jade: #286350;
    --danger-ink: #8a251b;
    --danger-bg: #f8e5e1;
    --font-serif: 'LXGW WenKai TC', 'Noto Serif TC', 'Songti TC', serif;
    --font-sans: 'Noto Sans TC', 'PingFang TC', sans-serif;
  }
  body.night {
    --bg-page: #15120f;
    --bg-surface: #1e1915;
    --bg-sheet: #26201a;
    --bg-chip: #312920;
    --bg-chip-hover: #3e3429;
    --ink-main: #ece3d4;
    --ink-sub: #bdafa0;
    --ink-muted: #8c7e70;
    --border-line: #3b3228;
    --accent-main: #cf6b40;
    --accent-main-ink: #19130f;
    --accent-gold: #dca646;
    --accent-jade: #53a88b;
    --danger-ink: #f29b91;
    --danger-bg: #3a1f1c;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: var(--bg-page);
    color: var(--ink-main);
    font-family: var(--font-serif);
    height: 100vh;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  header {
    background: var(--bg-surface);
    border-bottom: 1px solid var(--border-line);
    padding: 10px 18px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    flex-wrap: wrap;
  }
  .brand {
    display: flex;
    align-items: baseline;
    gap: 12px;
    flex-wrap: wrap;
  }
  .brand h1 {
    font-size: 19px;
    letter-spacing: 0.06em;
  }
  .brand .stats {
    font-family: var(--font-sans);
    font-size: 12px;
    color: var(--ink-muted);
  }
  .top-actions {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }
  button, input[type="search"], .nav-link-btn {
    font-family: var(--font-sans);
    font-size: 13px;
    border-radius: 6px;
    border: 1px solid var(--border-line);
    background: var(--bg-sheet);
    color: var(--ink-main);
    padding: 6px 11px;
    text-decoration: none;
  }
  button { cursor: pointer; }
  button:hover, .nav-link-btn:hover { background: var(--bg-chip-hover); }
  button.active {
    background: var(--accent-main);
    color: var(--accent-main-ink);
    border-color: var(--accent-main);
  }
  .workspace {
    flex: 1;
    display: grid;
    grid-template-columns: 300px minmax(0, 1fr) 290px;
    overflow: hidden;
  }
  .mobile-only { display: none; }
  @media (max-width: 1080px) {
    .workspace { grid-template-columns: 260px minmax(0, 1fr); }
    .right-pane { display: none; }
  }
  @media (max-width: 760px) {
    body { height: auto; min-height: 100vh; overflow-x: hidden; overflow-y: auto; }
    header { padding: 10px 12px; position: sticky; top: 0; z-index: 20; }
    .top-actions { width: 100%; }
    .top-actions input[type="search"] { flex: 1; min-width: 110px; }
    .mobile-only { display: inline-flex; align-items: center; }
    .workspace { display: flex; flex-direction: column; overflow: visible; }
    .left-pane { border-right: none; border-bottom: 2px solid var(--border-line); max-height: 58vh; }
    .left-pane.collapsed-mobile { display: none; }
    .center-pane { padding: 20px 16px 34px; overflow: visible; }
    .book-sheet { padding: 22px 18px; }
    .folio-title { font-size: 25px; }
    .prose-para { font-size: 17px; line-height: 1.95; }
    .right-pane { display: block; border-left: none; border-top: 1px solid var(--border-line); padding: 18px 16px 32px; }
  }
  .left-pane {
    background: var(--bg-surface);
    border-right: 1px solid var(--border-line);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  .volume-tabs {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 5px;
    padding: 9px 10px;
    border-bottom: 1px solid var(--border-line);
  }
  .vol-btn {
    font-size: 12.5px;
    font-weight: 700;
    padding: 6px 4px;
    text-align: center;
  }
  .town-tabs {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    padding: 8px 10px;
    border-bottom: 1px solid var(--border-line);
  }
  .pill-btn {
    font-size: 12px;
    padding: 3px 9px;
    border-radius: 999px;
  }
  .catalog-list {
    flex: 1;
    overflow-y: auto;
    padding: 8px;
  }
  .zone-header {
    font-family: var(--font-sans);
    font-size: 11px;
    font-weight: 700;
    color: var(--ink-muted);
    padding: 9px 6px 4px;
    border-bottom: 1px dashed var(--border-line);
    margin-bottom: 4px;
  }
  .cat-item {
    padding: 8px 10px;
    border-radius: 6px;
    cursor: pointer;
    margin-bottom: 3px;
  }
  .cat-item:hover { background: var(--bg-chip); }
  .cat-item.selected {
    background: var(--bg-chip-hover);
    border-left: 3px solid var(--accent-main);
  }
  .cat-item-main {
    font-size: 14.5px;
    font-weight: 700;
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 6px;
  }
  .cat-item-sub {
    font-family: var(--font-sans);
    font-size: 11.5px;
    color: var(--ink-sub);
    margin-top: 2px;
    line-height: 1.4;
  }
  .center-pane {
    overflow-y: auto;
    padding: 32px 40px 56px;
  }
  .book-sheet {
    max-width: 760px;
    margin: 0 auto;
    background: var(--bg-sheet);
    border: 1px solid var(--border-line);
    border-radius: 10px;
    padding: 38px 46px 44px;
    box-shadow: 0 6px 24px rgba(0, 0, 0, 0.05);
  }
  .folio-header {
    border-bottom: 2px double var(--border-line);
    padding-bottom: 18px;
    margin-bottom: 26px;
  }
  .folio-top-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 8px;
  }
  .folio-kicker {
    font-family: var(--font-sans);
    font-size: 12.5px;
    font-weight: 700;
    color: var(--accent-main);
    letter-spacing: 0.08em;
  }
  .copy-song-btn {
    font-size: 12px;
    padding: 4px 10px;
    border-color: var(--accent-gold);
    color: var(--accent-gold);
    font-weight: 600;
  }
  .folio-title {
    font-size: 31px;
    letter-spacing: 0.05em;
    line-height: 1.3;
    margin-bottom: 8px;
  }
  .folio-subtitle {
    font-size: 15px;
    color: var(--ink-sub);
    line-height: 1.65;
  }
  .vessel-epigraph {
    margin-top: 10px;
    font-size: 14px;
    color: var(--ink-muted);
    font-style: italic;
  }
  .prose-body {
    margin-top: 6px;
  }
  .prose-para {
    font-size: 18px;
    line-height: 2.05;
    letter-spacing: 0.02em;
    text-indent: 2em;
    margin-bottom: 20px;
    text-align: justify;
  }
  .prose-para:last-child {
    margin-bottom: 0;
  }
  .inline-ref {
    color: var(--accent-main);
    text-decoration: underline;
    text-decoration-color: rgba(139, 56, 29, 0.42);
    text-underline-offset: 4px;
    cursor: pointer;
    font-weight: 600;
  }
  body.night .inline-ref {
    text-decoration-color: rgba(207, 107, 64, 0.5);
  }
  .inline-ref.region { color: var(--accent-jade); text-decoration-color: rgba(40, 99, 80, 0.45); }
  .inline-ref.annals { color: var(--accent-gold); text-decoration-color: rgba(157, 108, 30, 0.45); }
  .folio-footer {
    margin-top: 28px;
    padding-top: 16px;
    border-top: 1px dashed var(--border-line);
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-items: center;
    font-family: var(--font-sans);
    font-size: 12.5px;
    color: var(--ink-muted);
  }
  .foot-chip {
    font-size: 12px;
    padding: 3px 9px;
    border-radius: 999px;
    background: var(--bg-surface);
  }
  .right-pane {
    background: var(--bg-surface);
    border-left: 1px solid var(--border-line);
    padding: 18px 16px;
    overflow-y: auto;
  }
  .side-title {
    font-family: var(--font-sans);
    font-size: 13px;
    font-weight: 700;
    margin-bottom: 10px;
    color: var(--ink-sub);
  }
  .ego-caption {
    font-family: var(--font-sans);
    font-size: 12px;
    color: var(--ink-muted);
    line-height: 1.6;
    margin-top: 10px;
  }
  .side-rel-list {
    margin-top: 14px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .side-rel-btn {
    text-align: left;
    padding: 7px 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    font-size: 13px;
  }
</style>
</head>
<body>
<header>
  <div class="brand">
    <h1>山海人物與風土戰史全誌</h1>
    <span class="stats" id="globalStats">展卷讀取中…</span>
  </div>
  <div class="top-actions">
    <button id="drawerBtn" class="mobile-only">☰ 卷目名冊</button>
    <input type="search" id="searchBox" placeholder="檢索人名、聚落、戰役本末…" />
    <a class="nav-link-btn" href="/world_atlas" id="atlasJumpBtn" style="border-color:var(--accent-jade);color:var(--accent-jade);font-weight:700;">🗺️ 實況大地圖（狀態透視）</a>
    <button id="exportMdBtn" title="將最新三卷全誌同步寫出至 docs/chronicles/">匯出全誌 Markdown</button>
    <button id="themeBtn">燭夜／宣紙</button>
  </div>
</header>

<div class="workspace">
  <aside class="left-pane collapsed-mobile" id="leftPane">
    <div class="volume-tabs">
      <button class="vol-btn active" data-vol="actor">人物列傳</button>
      <button class="vol-btn" data-vol="region">方輿地區誌</button>
      <button class="vol-btn" data-vol="annals">戰役與本末</button>
    </div>
    <div class="town-tabs" id="townTabs"></div>
    <div class="catalog-list" id="catalogList"></div>
  </aside>

  <main class="center-pane" id="centerPane">
    <article class="book-sheet" id="bookSheet"></article>
  </main>

  <aside class="right-pane" id="rightPane"></aside>
</div>

<script>
const state = {
  volume: 'actor', // 'actor' | 'region' | 'annals'
  settlements: [],
  regions: [],
  annals: [],
  actors: [],
  townFilter: 'all',
  query: '',
  selectedKind: 'actor',
  selectedId: '',
  currentCopyText: '',
};

const initialParams = new URLSearchParams(location.search);
const urlToken = initialParams.get('token') || '';
const initialQueryId = initialParams.get('id') || '';
if (urlToken && location.search) {
  history.replaceState(null, '', location.pathname + location.hash);
}
function atlasHrefFor(targetActorId) {
  const base = urlToken ? ('/world_atlas?token=' + encodeURIComponent(urlToken)) : '/world_atlas';
  return targetActorId ? (base + '#' + encodeURIComponent(targetActorId)) : base;
}

function apiFetch(path, extraOpts = {}) {
  const headers = Object.assign({}, extraOpts.headers || {});
  if (urlToken) headers['x-creator-token'] = urlToken;
  return fetch(path, Object.assign({}, extraOpts, { headers }));
}

function esc(s) {
  return String(s || '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

function renderLinkedParagraph(text, refs, selfId, selfSurface) {
  const raw = String(text || '');
  const validRefs = (refs || []).filter(r => r && r.surface && r.target_id && r.target_id !== selfId);
  if (!validRefs.length) return esc(raw);

  let out = '';
  let i = 0;
  while (i < raw.length) {
    if (selfSurface && raw.startsWith(selfSurface, i)) {
      out += esc(selfSurface);
      i += selfSurface.length;
      continue;
    }
    let matched = null;
    for (const r of validRefs) {
      if (raw.startsWith(r.surface, i)) {
        matched = r;
        break;
      }
    }
    if (matched) {
      out += `<span class="inline-ref ${esc(matched.kind)}" data-jump-kind="${esc(matched.kind)}" data-jump-id="${esc(matched.target_id)}">${esc(matched.surface)}</span>`;
      i += matched.surface.length;
    } else {
      out += esc(raw[i]);
      i += 1;
    }
  }
  return out;
}

async function init() {
  const res = await apiFetch('/api/chronicle/index');
  const data = await res.json();
  if (!data.ok) {
    document.getElementById('bookSheet').innerHTML = `<p>${esc(data.error || '無法展卷')}</p>`;
    return;
  }
  state.settlements = data.settlements || [];
  state.regions = data.regions || [];
  state.annals = data.annals || [];
  state.actors = data.actors || [];
  document.getElementById('globalStats').textContent =
    `${data.solar_year_zh}｜方輿 ${data.total_regions} 篇・戰史本末 ${data.total_annals} 篇・人物列傳 ${data.total_residents} 傳`;

  renderTownTabs();
  let rawHash = '';
  try { rawHash = decodeURIComponent(location.hash.replace(/^#/, '')); } catch (_) { rawHash = ''; }
  const initId = rawHash || initialQueryId;

  if (initId.startsWith('reg:')) {
    openEntry('region', initId, false);
  } else if (initId.startsWith('ann:')) {
    openEntry('annals', initId, false);
  } else {
    const found = state.actors.find(a => a.actor_id === initId) || state.actors[0];
    if (found) openEntry('actor', found.actor_id, false);
  }
}

function renderTownTabs() {
  const box = document.getElementById('townTabs');
  if (state.volume !== 'actor') {
    box.style.display = 'none';
    return;
  }
  box.style.display = 'flex';
  let html = `<button class="pill-btn ${state.townFilter === 'all' ? 'active' : ''}" data-town="all">全島 (${state.actors.length})</button>`;
  for (const s of state.settlements) {
    html += `<button class="pill-btn ${state.townFilter === s.slug ? 'active' : ''}" data-town="${esc(s.slug)}">${esc(s.name_zh)} (${s.resident_count})</button>`;
  }
  box.innerHTML = html;
  box.querySelectorAll('button').forEach(btn => {
    btn.onclick = () => {
      state.townFilter = btn.dataset.town;
      renderTownTabs();
      renderCatalog();
    };
  });
}

function renderCatalog() {
  const q = state.query.trim().toLowerCase();
  const el = document.getElementById('catalogList');
  let html = '';

  if (state.volume === 'region') {
    const list = state.regions.filter(r => !q || `${r.title_zh} ${r.subtitle_zh}`.toLowerCase().includes(q));
    html += `<div class="zone-header">卷一・山海方輿志（${list.length} 篇）</div>`;
    for (const r of list) {
      const sel = state.selectedId === r.id ? 'selected' : '';
      html += `<div class="cat-item ${sel}" data-kind="region" data-id="${esc(r.id)}">
        <div class="cat-item-main"><span>${esc(r.title_zh)}</span></div>
        <div class="cat-item-sub">${esc(r.subtitle_zh)}</div>
      </div>`;
    }
  } else if (state.volume === 'annals') {
    const list = state.annals.filter(a => !q || `${a.title_zh} ${a.subtitle_zh} ${a.era_zh}`.toLowerCase().includes(q));
    const islandList = list.filter(a => !a.is_mainland_war);
    const warList = list.filter(a => a.is_mainland_war);
    if (islandList.length) {
      html += `<div class="zone-header">銀鷗本島六大風變本末（${islandList.length} 篇）</div>`;
      for (const a of islandList) {
        const sel = state.selectedId === a.id ? 'selected' : '';
        html += `<div class="cat-item ${sel}" data-kind="annals" data-id="${esc(a.id)}">
          <div class="cat-item-main"><span>${esc(a.title_zh)}</span></div>
          <div class="cat-item-sub">${esc(a.era_zh)}｜${esc(a.subtitle_zh)}</div>
        </div>`;
      }
    }
    if (warList.length) {
      html += `<div class="zone-header">蒼淵主陸跨國兵燹與暗線（${warList.length} 篇）</div>`;
      for (const a of warList) {
        const sel = state.selectedId === a.id ? 'selected' : '';
        html += `<div class="cat-item ${sel}" data-kind="annals" data-id="${esc(a.id)}">
          <div class="cat-item-main"><span>${esc(a.title_zh)}</span></div>
          <div class="cat-item-sub">${esc(a.era_zh)}｜${esc(a.subtitle_zh)}</div>
        </div>`;
      }
    }
  } else {
    const filtered = state.actors.filter(a => {
      if (state.townFilter !== 'all' && a.town_slug !== state.townFilter) return false;
      if (q) {
        const hay = `${a.name} ${a.town_zh} ${a.zone_zh} ${a.door_zh} ${a.role} ${a.race}`.toLowerCase();
        if (!hay.includes(q)) return false;
      }
      return true;
    });
    const byZone = new Map();
    for (const a of filtered) {
      const key = `${a.town_zh}・${a.zone_zh}`;
      if (!byZone.has(key)) byZone.set(key, []);
      byZone.get(key).push(a);
    }
    for (const [z, list] of byZone.entries()) {
      html += `<div class="zone-header">${esc(z)}（${list.length}）</div>`;
      for (const a of list) {
        const sel = state.selectedId === a.actor_id ? 'selected' : '';
        html += `<div class="cat-item ${sel}" data-kind="actor" data-id="${esc(a.actor_id)}">
          <div class="cat-item-main"><span>${esc(a.name)}</span><span style="font-size:11.5px;font-weight:400;color:var(--ink-muted);">${esc(a.race)}・${esc(a.role)}</span></div>
          <div class="cat-item-sub">${esc(a.door_zh)}（${esc(a.bond)}）</div>
        </div>`;
      }
    }
  }

  el.innerHTML = html || '<div style="padding:14px;color:var(--ink-muted);font-size:13px;">無符合條件之篇章</div>';
  el.querySelectorAll('.cat-item').forEach(node => {
    node.onclick = () => {
      if (window.innerWidth <= 760) setMobileDrawer(false);
      openEntry(node.dataset.kind, node.dataset.id, true);
    };
  });
}

function setMobileDrawer(open) {
  const pane = document.getElementById('leftPane');
  const btn = document.getElementById('drawerBtn');
  if (!pane || !btn) return;
  pane.classList.toggle('collapsed-mobile', !open);
  btn.classList.toggle('active', open);
  btn.textContent = open ? '✕ 收合卷目' : '☰ 卷目名冊';
}

async function openEntry(kind, id, scrollMobile = false) {
  state.selectedKind = kind;
  state.selectedId = id;
  if (state.volume !== kind) {
    state.volume = kind;
    document.querySelectorAll('.vol-btn').forEach(b => b.classList.toggle('active', b.dataset.vol === kind));
    renderTownTabs();
  }
  renderCatalog();
  history.replaceState(null, '', '#' + encodeURIComponent(id));

  if (kind === 'actor') {
    const res = await apiFetch('/api/chronicle/actor?id=' + encodeURIComponent(id));
    const data = await res.json();
    if (!data.ok) return;
    renderActorBiographySheet(data);
    renderActorRightPane(data);
    document.getElementById('atlasJumpBtn').href = atlasHrefFor(id);
  } else {
    const res = await apiFetch('/api/chronicle/article?id=' + encodeURIComponent(id));
    const data = await res.json();
    if (!data.ok) return;
    renderArticleSheet(data);
    renderArticleRightPane(data);
    document.getElementById('atlasJumpBtn').href = atlasHrefFor('');
  }

  document.getElementById('centerPane').scrollTop = 0;
  if (scrollMobile && window.innerWidth <= 760) {
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }
}

function bindJumpElements(root) {
  root.querySelectorAll('[data-jump-id]').forEach(el => {
    el.onclick = () => {
      const k = el.getAttribute('data-jump-kind') || 'actor';
      const tid = el.getAttribute('data-jump-id');
      if (tid) openEntry(k, tid, true);
    };
  });
  const copyBtn = root.querySelector('#copyProseBtn');
  if (copyBtn) {
    copyBtn.onclick = async () => {
      try {
        await navigator.clipboard.writeText(state.currentCopyText || '');
        copyBtn.textContent = '✓ 已複製純淨傳文';
        setTimeout(() => { copyBtn.textContent = '📋 複製純淨傳文（入樂母本）'; }, 2000);
      } catch (_) {
        copyBtn.textContent = '複製失敗';
      }
    };
  }
}

function renderActorBiographySheet(data) {
  const a = data.actor;
  state.currentCopyText = data.plain_copy_text || '';
  const parasHtml = (data.paragraphs || []).map(p =>
    `<p class="prose-para">${renderLinkedParagraph(p, data.linked_refs, a.actor_id, a.name)}</p>`
  ).join('');

  const sheet = document.getElementById('bookSheet');
  sheet.innerHTML = `
    <div class="folio-header">
      <div class="folio-top-bar">
        <span class="folio-kicker">卷三・人物列傳 ｜ ${esc(a.town_zh)}</span>
        <button type="button" class="copy-song-btn" id="copyProseBtn">📋 複製純淨傳文（入樂母本）</button>
      </div>
      <h2 class="folio-title">${esc(a.title_zh)}</h2>
      <div class="folio-subtitle">${esc(a.subtitle_zh)}</div>
      <div class="vessel-epigraph">隨身器物：${esc(a.tool_name)}（${esc(a.tool_provenance)}）</div>
    </div>
    <div class="prose-body">${parasHtml}</div>
    <div class="folio-footer">
      <span>相關方輿：</span>
      <button type="button" class="foot-chip" data-jump-kind="region" data-jump-id="${esc(a.region_article_id)}">📖 展讀《${esc(a.town_zh)}風土志》</button>
      <button type="button" class="foot-chip" data-jump-kind="region" data-jump-id="reg:silver_gull_realm">🌊《銀鷗海領總志》</button>
    </div>
  `;
  bindJumpElements(sheet);
}

function renderArticleSheet(data) {
  state.currentCopyText = data.plain_copy_text || '';
  const volName = data.volume === 'region' ? '卷一・方輿地區誌' : '卷二・戰役與歷史風變本末';
  const parasHtml = (data.paragraphs || []).map(p =>
    `<p class="prose-para">${renderLinkedParagraph(p, data.linked_refs, data.id)}</p>`
  ).join('');
  const relChips = (data.linked_refs || []).slice(0, 8).map(r =>
    `<button type="button" class="foot-chip" data-jump-kind="${esc(r.kind)}" data-jump-id="${esc(r.target_id)}">${esc(r.surface)}</button>`
  ).join('');

  const sheet = document.getElementById('bookSheet');
  sheet.innerHTML = `
    <div class="folio-header">
      <div class="folio-top-bar">
        <span class="folio-kicker">${esc(volName)} ｜ ${esc(data.era_zh)}</span>
        <button type="button" class="copy-song-btn" id="copyProseBtn">📋 複製純淨傳文（入樂母本）</button>
      </div>
      <h2 class="folio-title">${esc(data.title_zh)}</h2>
      <div class="folio-subtitle">${esc(data.subtitle_zh)}</div>
      <div class="vessel-epigraph">世界內傳世載體：${esc(data.carrier_zh)}</div>
    </div>
    <div class="prose-body">${parasHtml}</div>
    ${relChips ? `<div class="folio-footer"><span>關聯卷篇：</span>${relChips}</div>` : ''}
  `;
  bindJumpElements(sheet);
}

function renderActorRightPane(data) {
  const pane = document.getElementById('rightPane');
  const rels = data.ego_ring || [];
  const cx = 135, cy = 135;
  let lines = `
    <circle cx="${cx}" cy="${cy}" r="54" fill="none" stroke="var(--border-line)" stroke-dasharray="3 3"/>
    <circle cx="${cx}" cy="${cy}" r="100" fill="none" stroke="var(--border-line)" stroke-dasharray="2 4"/>
  `;
  let nodes = '';
  rels.forEach((r, idx) => {
    const ang = (idx / Math.max(rels.length, 1)) * Math.PI * 2 - Math.PI / 2;
    const rad = r.inner_circle ? 54 : 98;
    const x = cx + Math.cos(ang) * rad;
    const y = cy + Math.sin(ang) * rad;
    const color = r.band === 'warm' ? 'var(--accent-jade)' : (r.band === 'estranged' ? 'var(--danger-ink)' : 'var(--accent-gold)');
    const dash = r.band === 'estranged' ? 'stroke-dasharray="4 3"' : '';
    lines += `<line x1="${cx}" y1="${cy}" x2="${x.toFixed(1)}" y2="${y.toFixed(1)}" stroke="${color}" stroke-width="1.7" ${dash}/>`;
    nodes += `<g style="cursor:pointer" data-jump-kind="actor" data-jump-id="${esc(r.target_id)}">
      <circle cx="${x.toFixed(1)}" cy="${y.toFixed(1)}" r="9.5" fill="${color}"/>
      <text x="${x.toFixed(1)}" y="${(y + 20).toFixed(1)}" font-size="10" font-family="sans-serif" fill="var(--ink-main)" text-anchor="middle">${esc(r.target_name)}</text>
    </g>`;
  });
  nodes += `<circle cx="${cx}" cy="${cy}" r="18" fill="var(--accent-main)"/>
    <text x="${cx}" y="${cy + 4}" font-size="10" font-family="sans-serif" fill="var(--accent-main-ink)" text-anchor="middle">${esc(data.actor.name.slice(0, 4))}</text>`;

  const relBtns = rels.slice(0, 8).map(r => `
    <button type="button" class="side-rel-btn" data-jump-kind="actor" data-jump-id="${esc(r.target_id)}">
      <strong>${esc(r.target_name)}</strong>
      <span style="font-size:11.5px;color:var(--ink-muted);">${esc(r.tie_label_zh)}・${esc(r.target_town)}</span>
    </button>
  `).join('');

  pane.innerHTML = `
    <div class="side-title">傳中人物親疏牽連圖（點姓名翻傳）</div>
    <svg viewBox="0 0 270 270" style="width:100%;height:260px;display:block;">${lines}${nodes}</svg>
    <div class="ego-caption">翠綠實線為心頭親厚、赭黃為尋常故舊、絳紅虛線為往年嫌隙。點擊圖上或下方姓名直接翻閱對方列傳。</div>
    <div class="side-rel-list">${relBtns}</div>
  `;
  bindJumpElements(pane);
}

function renderArticleRightPane(data) {
  const pane = document.getElementById('rightPane');
  const actors = data.related_actors || [];
  const actorBtns = actors.map(a => `
    <button type="button" class="side-rel-btn" data-jump-kind="actor" data-jump-id="${esc(a.actor_id)}">
      <strong>${esc(a.name)}</strong>
      <span style="font-size:11.5px;color:var(--ink-muted);">${esc(a.race)}・${esc(a.role)}</span>
    </button>
  `).join('');

  pane.innerHTML = `
    <div class="side-title">卷篇關聯人物與索引</div>
    <div class="ego-caption">本卷所述風土沿革與歷史兵燹，皆與島上各戶生平血脈相連。</div>
    <div class="side-rel-list">
      ${actorBtns || '<div style="font-size:12.5px;color:var(--ink-muted);margin-top:8px;">此篇為跨海大陸兵燹總紀，可由西峽渡口酒館抄本與渡海行商見聞印證。</div>'}
    </div>
  `;
  bindJumpElements(pane);
}

document.querySelectorAll('.vol-btn').forEach(btn => {
  btn.onclick = () => {
    const v = btn.dataset.vol;
    state.volume = v;
    document.querySelectorAll('.vol-btn').forEach(b => b.classList.toggle('active', b.dataset.vol === v));
    renderTownTabs();
    renderCatalog();
    if (v === 'region' && state.regions[0]) openEntry('region', state.regions[0].id, false);
    else if (v === 'annals' && state.annals[0]) openEntry('annals', state.annals[0].id, false);
    else if (v === 'actor' && state.actors[0]) openEntry('actor', state.actors[0].actor_id, false);
  };
});

document.getElementById('drawerBtn').onclick = () => {
  const pane = document.getElementById('leftPane');
  setMobileDrawer(pane.classList.contains('collapsed-mobile'));
};
document.getElementById('searchBox').onfocus = () => {
  if (window.innerWidth <= 760) setMobileDrawer(true);
};
document.getElementById('searchBox').oninput = e => {
  state.query = e.target.value;
  if (window.innerWidth <= 760) setMobileDrawer(true);
  renderCatalog();
};
document.getElementById('themeBtn').onclick = () => document.body.classList.toggle('night');
document.getElementById('exportMdBtn').onclick = async () => {
  const btn = document.getElementById('exportMdBtn');
  btn.textContent = '匯出中…';
  const res = await apiFetch('/api/chronicle/export-md', {
    method: 'POST',
    headers: { 'x-chronicle-action': 'export' },
  });
  const d = await res.json();
  btn.textContent = d.ok ? `已匯出三卷（${d.written_actors} 傳）` : '匯出失敗';
  setTimeout(() => { btn.textContent = '匯出全誌 Markdown'; }, 2500);
};
init();
</script>
</body>
</html>
