[package]
name = "singularity_world"
version = "0.1.0"
edition = "2024"

[dependencies]
# HTTP 框架
axum = { version = "0.8", features = ["ws"] }
# async runtime
tokio = { version = "1", features = ["full"] }
# JSON 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# WebSocket（axum 內建，tokio-tungstenite 備用）
# 密碼雜湊
bcrypt = "0.17"
# HTTP client（呼叫 Ollama）
reqwest = { version = "0.12", features = ["json", "blocking"] }
# 錯誤處理
anyhow = "1"
thiserror = "2"
# 日誌
tracing = "0.1"
tracing-subscriber = "0.3"
# 戰鬥 γ 隨機（對齊 Go math/rand）
rand = "0.9"
# 連線／Session 關聯
uuid = { version = "1", features = ["v4"] }
# WebSocket stream
futures-util = "0.3"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 2
lto = "thin"
strip = true
