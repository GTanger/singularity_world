[package]
name = "singularity_world"
version = "0.1.0"
edition = "2024"

[dependencies]
# HTTP 框架
axum = { version = "0.8", features = ["ws"] }
# async runtime
tokio = { version = "1", features = ["full"] }
# JSON 序列化
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# WebSocket（axum 內建，tokio-tungstenite 備用）
# 密碼雜湊
bcrypt = "0.17"
# HTTP client（呼叫 Ollama）
reqwest = { version = "0.12", features = ["json", "blocking"] }
# 錯誤處理
anyhow = "1"
thiserror = "2"
# 日誌
tracing = "0.1"
tracing-subscriber = "0.3"
# 戰鬥 γ 隨機（對齊 Go math/rand）
rand = "0.9"
# 連線／Session 關聯
uuid = { version = "1", features = ["v4"] }
# WebSocket stream
futures-util = "0.3"
# 靜態檔案服務
tower-http = { version = "0.6", features = ["fs", "set-header"] }
rusqlite = { version = "0.39.0", features = ["bundled"] }
r2d2_sqlite = "0.33.0"
r2d2_postgres = "0.16"
r2d2 = "0.8.10"

[[bin]]
name = "checkrooms"
path = "src/bin/checkrooms.rs"

[[bin]]
name = "migrate"
path = "src/bin/migrate.rs"

[[bin]]
name = "sw-set-password"
path = "src/bin/sw-set-password.rs"

[[bin]]
name = "generate_embeddings"
path = "src/bin/generate_embeddings.rs"

[[bin]]
name = "verify_embeddings"
path = "src/bin/verify_embeddings.rs"

[dev-dependencies]
tempfile = "3"

[profile.release]
opt-level = 2
lto = "thin"
strip = true
