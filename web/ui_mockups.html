<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>白塔半島・四方按鈕零跳動與舞台重構互動示意圖</title>
<style>
  :root {
    --paper-bg: #f6f1e7;
    --paper-card: #fcf8f0;
    --paper-deep: #ede4d3;
    --ink: #2c2117;
    --ink-mid: #5a4836;
    --ink-faint: #8c7b68;
    --vermilion: #9e3e2a;
    --vermilion-soft: rgba(158, 62, 42, 0.12);
    --jade: #2e5a44;
    --gold-ochre: #8c6d23;
    --border-ink: rgba(73, 51, 28, 0.18);
    --border-strong: rgba(110, 82, 50, 0.36);
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 0;
    background: #1e1914;
    color: var(--ink);
    font-family: 'Chiron GoRound TC', 'LXGW WenKai TC', 'Noto Serif TC', 'PingFang TC', serif;
    display: flex;
    flex-direction: column;
    height: 100dvh;
    overflow: hidden;
  }

  /* ── 頂部設計切換與實時座標檢測控制台 ── */
  .workbench-bar {
    flex: 0 0 auto;
    background: #26201a;
    color: #efe7da;
    border-bottom: 1px solid rgba(255, 245, 230, 0.14);
    padding: 8px 16px;
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    justify-content: space-between;
    gap: 10px;
    font-family: system-ui, -apple-system, 'Noto Sans TC', sans-serif;
    font-size: 13px;
    z-index: 100;
  }

  .wb-group {
    display: flex;
    align-items: center;
    gap: 6px;
    flex-wrap: wrap;
  }

  .wb-label {
    color: #b7a68e;
    font-size: 12px;
    font-weight: 600;
    margin-right: 2px;
  }

  .wb-tab, .wb-btn {
    appearance: none;
    background: rgba(255, 248, 235, 0.07);
    color: #e5dac9;
    border: 1px solid rgba(255, 248, 235, 0.18);
    border-radius: 5px;
    padding: 5px 11px;
    font-size: 12.5px;
    font-weight: 600;
    cursor: pointer;
    transition: all 0.14s ease;
  }

  .wb-tab:hover, .wb-btn:hover {
    background: rgba(255, 248, 235, 0.15);
  }

  .wb-tab.is-active {
    background: #9e3e2a;
    color: #fff;
    border-color: #c95f49;
    box-shadow: 0 1px 6px rgba(158, 62, 42, 0.45);
  }

  .wb-btn.is-active {
    background: #3a6b52;
    color: #fff;
    border-color: #559474;
  }

  /* 實時 Δx / Δy / Δw / Δh 檢測儀 */
  .delta-meter {
    display: inline-flex;
    align-items: center;
    gap: 8px;
    padding: 4px 10px;
    border-radius: 5px;
    font-family: 'JetBrains Mono', ui-monospace, monospace;
    font-size: 12px;
    background: rgba(0, 0, 0, 0.35);
    border: 1px solid rgba(255, 255, 255, 0.14);
  }

  .delta-badge {
    padding: 2px 6px;
    border-radius: 3px;
    font-weight: 700;
  }

  .delta-pass {
    background: rgba(46, 160, 67, 0.25);
    color: #7ee787;
    border: 1px solid rgba(46, 160, 67, 0.5);
  }

  .delta-fail {
    background: rgba(248, 81, 73, 0.25);
    color: #ff7b72;
    border: 1px solid rgba(248, 81, 73, 0.55);
  }

  /* 方案重點說明橫幅 */
  .scheme-explainer {
    flex: 0 0 auto;
    min-height: 40px;
    background: #312921;
    color: #e6dccb;
    padding: 6px 16px;
    font-family: system-ui, -apple-system, 'Noto Sans TC', sans-serif;
    font-size: 12.5px;
    border-bottom: 1px solid rgba(255, 245, 230, 0.1);
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
  }

  .scheme-explainer strong {
    color: #f7c873;
  }

  /* ── 模擬視口外框（支援桌機寬屏與手機 430px 切換） ── */
  .viewport-stage-host {
    flex: 1 1 auto;
    min-height: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 12px;
    background: radial-gradient(circle at center, #2b231c 0%, #17130f 100%);
    overflow: hidden;
  }

  .sim-device {
    width: 100%;
    max-width: 1080px;
    height: 100%;
    background: var(--paper-bg);
    border-radius: 10px;
    box-shadow: 0 14px 44px rgba(0, 0, 0, 0.55), 0 0 0 1px rgba(255, 240, 215, 0.16);
    display: flex;
    flex-direction: column;
    overflow: hidden;
    position: relative;
    transition: max-width 0.2s ease;
  }

  .sim-device.is-mobile {
    max-width: 420px;
  }

  /* 模擬頂欄與底欄 (固定 36px) */
  .sim-topbar, .sim-bottombar {
    flex: 0 0 36px;
    height: 36px;
    background: #ece3d2;
    border-bottom: 1px solid var(--border-ink);
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 14px;
    font-size: 13px;
    color: var(--ink-mid);
    user-select: none;
  }

  .sim-bottombar {
    border-bottom: none;
    border-top: 1px solid var(--border-ink);
  }

  .sim-vitals {
    display: flex;
    gap: 14px;
    align-items: center;
  }

  .sim-vital-pill {
    display: inline-flex;
    align-items: center;
    gap: 5px;
    font-size: 12.5px;
  }

  .sim-vital-bar {
    width: 44px;
    height: 5px;
    background: rgba(73, 51, 28, 0.14);
    border-radius: 3px;
    overflow: hidden;
  }

  .sim-vital-fill {
    height: 100%;
    background: var(--ink);
  }

  /* ── 核心主畫面區 ── */
  .sim-main {
    flex: 1 1 auto;
    min-height: 0;
    position: relative;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }

  /* ============================================================================
   * 共用：四方按鈕（Confirmed Design Core）
   * 在方案 A / B / C 中，四方按鈕掛載於外層固定幾何框，尺寸與座標 100% 鎖死！
   * ============================================================================ */
  .fixed-compass-ring {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 30;
  }

  .cardinal-btn {
    position: absolute;
    pointer-events: auto;
    appearance: none;
    background: rgba(248, 243, 233, 0.95);
    border: 1px solid var(--border-strong);
    border-radius: 4px;
    color: var(--ink);
    font-family: inherit;
    font-size: 13.5px;
    font-weight: 650;
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 2px 6px rgba(44, 30, 15, 0.08);
    user-select: none;
    overflow: hidden;
    white-space: nowrap;
    text-overflow: ellipsis;
    transition: background 0.14s ease, border-color 0.14s ease, color 0.14s ease, opacity 0.14s ease;
  }

  .cardinal-btn:hover:not(.is-disabled) {
    background: #fffdf9;
    border-color: var(--vermilion);
    color: var(--vermilion);
  }

  .cardinal-btn.is-disabled {
    opacity: 0.16;
    pointer-events: none;
    cursor: default;
    box-shadow: none;
    border-style: dashed;
  }

  /* 剛性固定盒模型：南北固定 164×32，東西固定 32×164，中心錨點永遠不動 */
  .cardinal-btn-n {
    top: 10px;
    left: 50%;
    transform: translateX(-50%);
    width: 164px;
    height: 32px;
    padding: 0 10px;
    letter-spacing: 0.06em;
  }

  .cardinal-btn-s {
    bottom: 10px;
    left: 50%;
    transform: translateX(-50%);
    width: 164px;
    height: 32px;
    padding: 0 10px;
    letter-spacing: 0.06em;
  }

  .cardinal-btn-w {
    left: 10px;
    top: 50%;
    transform: translateY(-50%);
    width: 32px;
    height: 164px;
    padding: 10px 0;
    writing-mode: vertical-rl;
    text-orientation: upright;
    letter-spacing: 0.12em;
  }

  .cardinal-btn-e {
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    width: 32px;
    height: 164px;
    padding: 10px 0;
    writing-mode: vertical-rl;
    text-orientation: upright;
    letter-spacing: 0.12em;
  }

  /* ============================================================================
   * 模式 0：【現況病灶對照組 (Before)】— 展示為何現行設計會上下跳動與伸縮
   * ============================================================================ */
  .layout-legacy {
    display: flex;
    flex-direction: column;
    height: 100%;
    padding: 8px 14px;
  }

  .legacy-heading {
    flex: 0 0 auto;
    margin: 0 0 4px;
    font-size: 24px;
    font-weight: 700;
  }

  .legacy-l3 {
    flex: 0 0 auto;
    font-size: 16px;
    line-height: 1.68;
    color: #3b2e21;
    padding-bottom: 6px;
    margin-bottom: 8px;
    border-bottom: 1px dashed rgba(158, 62, 42, 0.35);
    background: rgba(158, 62, 42, 0.05);
  }

  .legacy-canvas {
    flex: 1 1 auto;
    position: relative;
    background: rgba(252, 248, 240, 0.78);
    border: 1px solid rgba(73, 51, 28, 0.18);
    border-radius: 10px;
    overflow: hidden;
  }

  .legacy-canvas.is-shifting {
    animation: legacyShake 0.34s ease-out;
  }

  @keyframes legacyShake {
    0% { opacity: 0.45; transform: translateY(14px); }
    100% { opacity: 1; transform: translateY(0); }
  }

  /* 舊版 auto 尺寸按鈕 */
  .legacy-btn-auto-ns {
    width: auto !important;
    height: auto !important;
    padding: 4px 12px !important;
  }
  .legacy-btn-auto-we {
    width: auto !important;
    height: auto !important;
    padding: 12px 5px !important;
  }

  .legacy-scatter-token {
    position: absolute;
    transform: translate(-50%, -50%);
    padding: 4px 10px;
    background: #fcf8f0;
    border: 1px solid rgba(73, 51, 28, 0.25);
    border-radius: 4px;
    font-size: 13.5px;
    cursor: pointer;
    box-shadow: 0 1px 4px rgba(0, 0, 0, 0.06);
  }

  .legacy-breaths {
    flex: 0 0 auto;
    margin-top: 8px;
    padding: 6px 10px;
    background: rgba(237, 228, 211, 0.55);
    border-radius: 4px;
    font-size: 13.5px;
  }

  /* ============================================================================
   * 方案一：【全屏單一四方舞台 ＋ 結構化場景名牌席】（推薦）
   * 四方按鈕釘在視口四邊；中央舞台分為固定比例三席（卷頭 / 名牌席 / 內嵌回響）
   * ============================================================================ */
  .layout-scheme-1 {
    position: absolute;
    inset: 0;
    /* 四周留出 54px 給四方按鈕安全走廊，內部 100% 鎖死不外溢 */
    padding: 48px 54px;
    display: grid;
    grid-template-rows: auto 1fr auto;
    gap: 10px;
  }

  .sim-device.is-mobile .layout-scheme-1,
  .sim-device.is-mobile .layout-scheme-3 {
    padding: 46px 40px;
  }

  @media (max-width: 600px) {
    .layout-scheme-1,
    .layout-scheme-3 {
      padding: 46px 40px;
    }
    .cardinal-btn-w {
      left: 4px;
      width: 28px;
    }
    .cardinal-btn-e {
      right: 4px;
      width: 28px;
    }
  }

  .s1-header-zone {
    background: rgba(252, 248, 240, 0.72);
    border-bottom: 1px solid var(--border-ink);
    padding: 10px 14px;
    display: flex;
    flex-direction: column;
    justify-content: flex-start;
    overflow: visible;
  }

  .s1-title-row {
    display: flex;
    align-items: baseline;
    justify-content: space-between;
    gap: 12px;
    margin-bottom: 4px;
  }

  .s1-place-name {
    margin: 0;
    font-size: 22px;
    font-weight: 700;
    letter-spacing: 0.08em;
    color: var(--ink);
  }

  .s1-env-desc {
    margin: 0;
    font-size: 15.5px;
    line-height: 1.68;
    color: var(--ink-mid);
  }

  .s1-stage-deck {
    background: var(--paper-card);
    border: 1px solid var(--border-ink);
    border-radius: 8px;
    padding: 16px 20px;
    display: flex;
    flex-wrap: wrap;
    align-items: flex-start;
    align-content: flex-start;
    gap: 10px;
    min-height: 0;
    overflow-y: auto;
    box-shadow: inset 0 2px 8px rgba(44, 30, 15, 0.02);
  }
  .s1-deck-group {
    display: flex;
    flex-direction: column;
    gap: 8px;
  }

  .s1-group-caption {
    font-size: 12px;
    letter-spacing: 0.14em;
    color: var(--ink-faint);
    border-bottom: 1px solid rgba(73, 51, 28, 0.1);
    padding-bottom: 4px;
  }

  .s1-token-grid {
    display: flex;
    flex-wrap: wrap;
    gap: 8px;
    align-content: flex-start;
  }

  .ink-token {
    appearance: none;
    background: var(--paper-bg);
    border: 1px solid var(--border-strong);
    border-radius: 4px;
    padding: 6px 12px;
    font-family: inherit;
    font-size: 14px;
    font-weight: 600;
    color: var(--ink);
    cursor: pointer;
    display: inline-flex;
    align-items: center;
    gap: 6px;
    transition: all 0.12s ease;
  }

  .ink-token:hover, .ink-token.is-selected {
    background: #fffdf9;
    border-color: var(--vermilion);
    box-shadow: 0 2px 5px rgba(158, 62, 42, 0.12);
  }

  .ink-token.is-person {
    border-left: 3px solid var(--vermilion);
  }

  .ink-token.is-object {
    border-left: 3px solid var(--gold-ochre);
  }

  .ink-token.is-aux-exit {
    border-left: 3px solid var(--jade);
    background: rgba(46, 90, 68, 0.06);
  }

  .token-sub {
    font-size: 11.5px;
    font-weight: 400;
    color: var(--ink-faint);
  }

  /* 下席：內嵌互動與當下二息區（不彈出遮臉視窗） */
  .s1-response-dock {
    background: rgba(237, 228, 211, 0.62);
    border: 1px solid var(--border-ink);
    border-left: 3px solid var(--vermilion);
    border-radius: 6px;
    padding: 8px 14px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    overflow: hidden;
  }

  .s1-action-bar {
    display: flex;
    align-items: center;
    gap: 8px;
    flex-wrap: wrap;
  }

  .s1-action-target {
    font-weight: 700;
    color: var(--vermilion);
    font-size: 13.5px;
    margin-right: 4px;
  }

  .s1-act-chip {
    appearance: none;
    background: #fffdf9;
    border: 1px solid var(--border-strong);
    border-radius: 3px;
    padding: 2px 9px;
    font-family: inherit;
    font-size: 12.5px;
    color: var(--ink);
    cursor: pointer;
  }

  .s1-act-chip:hover {
    border-color: var(--vermilion);
    color: var(--vermilion);
  }

  .s1-breath-line {
    margin: 0;
    font-size: 13.5px;
    color: var(--ink);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }

  /* ============================================================================
   * 方案二：【四方外框釘死 ＋ 中央純粹水墨書頁流（無盒無框）】
   * 對標 Roadwarden / 線裝書頁：外圍四方按鈕如書鎮鎖死，中間為可閱讀點擊的文句書頁
   * ============================================================================ */
  .layout-scheme-2 {
    position: absolute;
    inset: 0;
    padding: 52px 64px;
    display: flex;
    justify-content: center;
    overflow: hidden;
  }

  .sim-device.is-mobile .layout-scheme-2 {
    padding: 50px 48px;
  }

  .s2-book-page {
    width: 100%;
    max-width: 680px;
    height: 100%;
    background: rgba(252, 248, 240, 0.55);
    border-left: 1px solid var(--border-ink);
    border-right: 1px solid var(--border-ink);
    padding: 18px 28px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }

  .s2-title {
    margin: 0;
    font-size: 24px;
    font-weight: 700;
    letter-spacing: 0.1em;
    border-bottom: 1px solid var(--border-ink);
    padding-bottom: 8px;
  }

  .s2-prose {
    margin: 0;
    font-size: 16.5px;
    line-height: 1.85;
    color: var(--ink);
    text-align: justify;
  }

  .s2-inline-entity {
    display: inline-flex;
    align-items: center;
    padding: 0 5px;
    margin: 0 2px;
    border-bottom: 1.5px solid var(--vermilion);
    color: var(--ink);
    font-weight: 650;
    cursor: pointer;
    background: rgba(158, 62, 42, 0.06);
    border-radius: 2px;
  }

  .s2-inline-entity:hover {
    background: rgba(158, 62, 42, 0.15);
  }

  .s2-inline-drawer {
    background: var(--paper-deep);
    border-left: 3px solid var(--vermilion);
    padding: 10px 14px;
    border-radius: 4px;
    font-size: 14px;
    line-height: 1.65;
  }

  /* ============================================================================
   * 方案三：【左景右器雙欄固定艙 ＋ 外圍四方釘死】（對標 Citizen Sleeper）
   * 左艙固定顯示地名、環境與持續回響；右艙固定插槽顯示人物與器物
   * ============================================================================ */
  .layout-scheme-3 {
    position: absolute;
    inset: 0;
    padding: 52px 56px;
    display: grid;
    grid-template-columns: 1.1fr 1fr;
    gap: 14px;
  }

  .sim-device.is-mobile .layout-scheme-3 {
    grid-template-columns: 1fr;
    grid-template-rows: 1fr 1.2fr;
  }

  .s3-left-cabin, .s3-right-cabin {
    background: var(--paper-card);
    border: 1px solid var(--border-ink);
    border-radius: 8px;
    padding: 14px 16px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    overflow: hidden;
  }

  .s3-log-box {
    margin-top: auto;
    padding-top: 10px;
    border-top: 1px solid var(--border-ink);
    font-size: 13.5px;
    line-height: 1.6;
    color: var(--ink-mid);
  }
</style>
</head>
<body>

  <!-- 頂部切換與實時座標檢測儀 -->
  <div class="workbench-bar">
    <div class="wb-group">
      <span class="wb-label">重構方案切換：</span>
      <button type="button" class="wb-tab" data-scheme="legacy">現況對照（會跳動）</button>
      <button type="button" class="wb-tab is-active" data-scheme="scheme1">方案一：全屏單一四方舞台＋名牌席（推薦）</button>
      <button type="button" class="wb-tab" data-scheme="scheme2">方案二：四方外框＋純水墨書頁流</button>
      <button type="button" class="wb-tab" data-scheme="scheme3">方案三：四方外框＋左景右器雙艙</button>
    </div>

    <div class="wb-group">
      <span class="wb-label">點擊四方按鈕移動測試：</span>
      <button type="button" class="wb-btn" id="btn-auto-walk">連走 4 步實測跳動</button>
      <button type="button" class="wb-btn" id="btn-toggle-vp">切換：桌機 / 手機視口</button>
      <div class="delta-meter" id="delta-meter">
        <span>四方按鈕位移量：</span>
        <span class="delta-badge delta-pass" id="delta-readout">Δx=0px Δy=0px Δw=0px Δh=0px (零跳動 PASS)</span>
      </div>
    </div>
  </div>

  <!-- 方案說明列 -->
  <div class="scheme-explainer" id="scheme-explainer">
    <div id="explainer-text">
      <strong>【方案一（推薦）】</strong>：四方按鈕以固定尺寸（164×32 / 32×164）直接釘在主視口四極，<strong>不放在任何可變高度文字下方</strong>；廢除假 2D 亂撒貼紙與遮臉彈窗，舞台中央改為整齊的「在場人物／場景器物」水墨名牌席，下方內嵌操作回響。
    </div>
    <div id="room-step-indicator" style="white-space:nowrap;color:#b7a68e;">當前場所：三水匯流大石橋</div>
  </div>

  <!-- 模擬視口 -->
  <div class="viewport-stage-host">
    <div class="sim-device" id="sim-device">
      <!-- 頂欄 (36px) -->
      <header class="sim-topbar">
        <div class="sim-vitals">
          <span class="sim-vital-pill">氣血 <span class="sim-vital-bar"><span class="sim-vital-fill" style="width:92%"></span></span></span>
          <span class="sim-vital-pill">真氣 <span class="sim-vital-bar"><span class="sim-vital-fill" style="width:85%"></span></span></span>
          <span class="sim-vital-pill">精神 <span class="sim-vital-bar"><span class="sim-vital-fill" style="width:88%"></span></span></span>
        </div>
        <div>卯時二刻・晨霧微涼</div>
      </header>

      <!-- 主視區 -->

  };

  function captureCardinalRects() {
    const dev = document.getElementById('sim-device').getBoundingClientRect();
    const dirs = ['n', 's', 'w', 'e'];
    const out = {};
    for (const d of dirs) {
      const el = document.getElementById('btn-dir-' + d);
      if (el) {
        const r = el.getBoundingClientRect();
        out[d] = {
          x: Math.round(r.x - dev.x),
          y: Math.round(r.y - dev.y),
          w: Math.round(r.width),
          h: Math.round(r.height)
        };
      }
    }
    return out;
  }

  function updateDeltaMeter(before, after) {
    const readout = document.getElementById('delta-readout');
    if (!before || !after) return;
    let maxDx = 0, maxDy = 0, maxDw = 0, maxDh = 0;
    for (const d of ['n', 's', 'w', 'e']) {
      if (before[d] && after[d]) {
        maxDx = Math.max(maxDx, Math.abs(after[d].x - before[d].x));
        maxDy = Math.max(maxDy, Math.abs(after[d].y - before[d].y));
        maxDw = Math.max(maxDw, Math.abs(after[d].w - before[d].w));
        maxDh = Math.max(maxDh, Math.abs(after[d].h - before[d].h));
      }
    }
    const isZero = (maxDx === 0 && maxDy === 0 && maxDw === 0 && maxDh === 0);
    readout.textContent = `Δx=${maxDx}px Δy=${maxDy}px Δw=${maxDw}px Δh=${maxDh}px (${isZero ? '零跳動 PASS' : '發生跳動 FAIL!'})`;
    readout.className = 'delta-badge ' + (isZero ? 'delta-pass' : 'delta-fail');
  }

  function syncCardinalButtons(room, isLegacy) {
    const ring = document.getElementById('fixed-compass-ring');
    const dirLabels = { n: '北・無去路', s: '南・無去路', w: '西・無去路', e: '東・無去路' };
    for (const d of ['n', 's', 'w', 'e']) {
      const btn = document.getElementById('btn-dir-' + d);
      const ex = room.exits[d];
      btn.classList.toggle('legacy-btn-auto-ns', isLegacy && (d === 'n' || d === 's'));
      btn.classList.toggle('legacy-btn-auto-we', isLegacy && (d === 'w' || d === 'e'));
      if (ex) {
        btn.textContent = ex.label;
        btn.classList.remove('is-disabled');
        btn.disabled = false;
        btn.dataset.target = ex.target;
      } else {
        btn.textContent = dirLabels[d];
        btn.classList.add('is-disabled');
        btn.disabled = true;
        btn.dataset.target = '';
      }
    }
  }

            </div>
          </section>
        </div>
      `;
    }
  }

  function moveToRoom(targetId) {
    if (!targetId || !ROOMS[targetId]) return;
    const before = captureCardinalRects();
    currentRoomId = targetId;
    const room = ROOMS[currentRoomId];
    selectedEntity = room.objects[0] || room.people[0] || null;
    lastActionReply = '';
    renderStage();
    const after = captureCardinalRects();
    updateDeltaMeter(before, after);
  }

  // 綁定四方按鈕點擊
  document.getElementById('fixed-compass-ring').addEventListener('click', (e) => {
    const btn = e.target.closest('.cardinal-btn');
    if (!btn || btn.disabled) return;
    moveToRoom(btn.dataset.target);
  });

  // 綁定舞台內部互動
  document.getElementById('stage-body').addEventListener('click', (e) => {
    const moveBtn = e.target.closest('[data-move]');
    if (moveBtn) {
      moveToRoom(moveBtn.dataset.move);
      return;
    }
    const entityBtn = e.target.closest('[data-kind]');
    if (entityBtn) {
      const room = ROOMS[currentRoomId];
      const idx = Number(entityBtn.dataset.idx);
      const k = entityBtn.dataset.kind;
      selectedEntity = k === 'person' ? room.people[idx] : (k === 'portable' ? (room.portableItems || [])[idx] : room.objects[idx]);
      lastActionReply = selectedEntity ? selectedEntity.reply : '';
      renderStage();
      return;
    }
    const actBtn = e.target.closest('[data-act]');
    if (actBtn && selectedEntity) {
      lastActionReply = `【${actBtn.dataset.act}】${selectedEntity.reply}`;
      renderStage();
    }
  });

  // 綁定頂部方案切換
  document.querySelectorAll('.wb-tab').forEach(tab => {
    tab.addEventListener('click', () => {
      document.querySelectorAll('.wb-tab').forEach(t => t.classList.remove('is-active'));
      tab.classList.add('is-active');
      currentScheme = tab.dataset.scheme;
      renderStage();
      const rects = captureCardinalRects();
      updateDeltaMeter(rects, rects);
    });
  });

  // 一鍵連走 4 步實測跳動
  document.getElementById('btn-auto-walk').addEventListener('click', async () => {
    const seq = ['north_street', 'bridge', 'hall', 'west_bank', 'bridge'];
    for (const r of seq) {
      moveToRoom(r);
      await new Promise(res => setTimeout(res, 420));
    }
  });

  // 桌機 / 手機視口切換
  document.getElementById('btn-toggle-vp').addEventListener('click', (e) => {
    const dev = document.getElementById('sim-device');
    dev.classList.toggle('is-mobile');
    e.currentTarget.classList.toggle('is-active', dev.classList.contains('is-mobile'));
  });

  renderStage();
</script>
</body>
</html>
