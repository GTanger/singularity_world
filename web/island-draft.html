6284,"y":1390.4182083454925,"ax":1424.3,"ay":746.2,"label":"× 蕨溪谷(封村)","kind":"plague","name":"蕨溪谷","hh":0,"res":0},{"cid":4849,"prio":4,"x":987.8005252407346,"y":1417.966734753429,"ax":1439.35,"ay":749.03,"label":"× 古加津(封村)","kind":"plague","name":"古加津","hh":0,"res":0}],"activeTiles":[[-5,-3],[-5,-2],[-5,-1],[-4,-3],[-4,-2],[-4,-1],[-4,0],[-3,-3],[-3,-2],[-3,-1],[-3,0],[-3,1],[-3,2],[-2,-3],[-2,-2],[-2,-1],[-2,0],[-2,1],[-2,2],[-2,3],[-2,4],[-1,-3],[-1,-2],[-1,-1],[-1,0],[-1,1],[-1,2],[-1,3],[-1,4],[0,-3],[0,-2],[0,-1],[0,0],[0,1],[0,2],[0,3],[0,4],[1,-3],[1,-2],[1,-1],[2,-3],[2,-2]]};
const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
const stage = document.getElementById("stage");
let showGrid = true, showLabels = true, selectedCid = 4616;
let camX = (DATA.bbox[0] + DATA.bbox[2]) * 0.5, camY = (DATA.bbox[1] + DATA.bbox[3]) * 0.5, camScale = 6;

function fit() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  cv.width = stage.clientWidth * dpr;
  cv.height = stage.clientHeight * dpr;
  camX = (DATA.bbox[0] + DATA.bbox[2]) * 0.5;
  camY = (DATA.bbox[1] + DATA.bbox[3]) * 0.5;
  camScale = Math.min(cv.width / (DATA.bbox[2] - DATA.bbox[0]), cv.height / (DATA.bbox[3] - DATA.bbox[1])) * 0.92;
  draw();
}
window.addEventListener("resize", () => {
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  cv.width = stage.clientWidth * dpr;
  cv.height = stage.clientHeight * dpr;
  draw();
});

function w2s(ax, ay) { return [cv.width * 0.5 + (ax - camX) * camScale, cv.height * 0.5 + (ay - camY) * camScale]; }
function s2w(sx, sy) { return [camX + (sx - cv.width * 0.5) / camScale, camY + (sy - cv.height * 0.5) / camScale]; }

function draw() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  ctx.fillStyle = "#cbdbe3";
  ctx.fillRect(0, 0, cv.width, cv.height);

  DATA.cells.forEach(c => {
    ctx.beginPath();
    c.poly.forEach((p, i) => {
      const [sx, sy] = w2s(p[0], p[1]);
      if (i === 0) ctx.moveTo(sx, sy); else ctx.lineTo(sx, sy);
    });
    ctx.closePath();
    ctx.fillStyle = c.plague ? "#dac0be" : (c.mtn ? "#b6a692" : (c.h >= 22 ? "#c0d2a6" : "#d8e0b6"));
    ctx.fill();
    ctx.lineWidth = (c.id === selectedCid ? 2.8 : 1.0) * dpr;
    ctx.strokeStyle = c.id === selectedCid ? "#b93822" : "rgba(110,98,82,0.52)";
    ctx.stroke();

    if (c.mtn) {
      const [cx, cy] = w2s(c.center[0], c.center[1]);
      ctx.fillStyle = "rgba(112,94,76,0.85)";
      ctx.beginPath();
      ctx.moveTo(cx - 6*dpr, cy + 5*dpr); ctx.lineTo(cx, cy - 6*dpr); ctx.lineTo(cx + 6*dpr, cy + 5*dpr);
      ctx.closePath(); ctx.fill();
    }
  });

  ctx.lineCap = "round"; ctx.lineJoin = "round";
  DATA.seas.forEach(sr => {
    ctx.beginPath();
    sr.pts.forEach((p, i) => { const [sx, sy] = w2s(p[0], p[1]); if (i===0) ctx.moveTo(sx,sy); else ctx.lineTo(sx,sy); });
    ctx.setLineDash([6*dpr, 6*dpr]);
    ctx.strokeStyle = "rgba(42,102,148,0.68)";
    ctx.lineWidth = 1.8 * dpr;
    ctx.stroke();
  });
  ctx.setLineDash([]);

  DATA.rivers.forEach(rv => {
    ctx.beginPath();
    rv.pts.forEach((p, i) => { const [sx, sy] = w2s(p[0], p[1]); if (i===0) ctx.moveTo(sx,sy); else ctx.lineTo(sx,sy); });
    ctx.strokeStyle = "#1c62a6";
    ctx.lineWidth = (rv.major ? 4.8 : 3.4) * dpr;
    ctx.stroke();
  });

  DATA.highways.forEach(hw => {
    ctx.beginPath();
    hw.points.forEach((p, i) => { const [sx, sy] = w2s(p[0], p[1]); if (i===0) ctx.moveTo(sx,sy); else ctx.lineTo(sx,sy); });
    ctx.setLineDash([5*dpr, 5*dpr]);
    ctx.strokeStyle = "rgba(138,94,48,0.78)";
    ctx.lineWidth = 1.6 * dpr;
    ctx.stroke();
  });
  ctx.setLineDash([]);

  DATA.trunks.forEach(tr => {
    ctx.beginPath();
    tr.pts.forEach((p, i) => { const [sx, sy] = w2s(p[0], p[1]); if (i===0) ctx.moveTo(sx,sy); else ctx.lineTo(sx,sy); });
    ctx.strokeStyle = "#5c220e";
    ctx.lineWidth = 4.2 * dpr;
    ctx.stroke();
    ctx.strokeStyle = "#d8702e";
    ctx.lineWidth = 2.2 * dpr;
    ctx.stroke();
  });

  if (showGrid) {
    const [ox, oy] = DATA.origin, step = DATA.tileStep;
    ctx.font = `700 ${Math.round(11*dpr)}px "Noto Serif TC", serif`;
    ctx.textAlign = "left"; ctx.textBaseline = "top";
    DATA.activeTiles.forEach(([tx, ty]) => {
      const ax0 = ox - step*0.5 + tx*step, ay0 = oy - step*0.5 + ty*step;
      const [sx0, sy0] = w2s(ax0, ay0);
      const sw = step * camScale, sh = step * camScale;
      const isOrig = tx === 0 && ty === 0;
      ctx.strokeStyle = isOrig ? "rgba(180,45,25,0.9)" : "rgba(55,80,105,0.48)";
      ctx.lineWidth = (isOrig ? 2.5 : 1.3) * dpr;
      if (isOrig) { ctx.fillStyle = "rgba(185,56,34,0.09)"; ctx.fillRect(sx0, sy0, sw, sh); }
      ctx.strokeRect(sx0, sy0, sw, sh);
      ctx.fillStyle = isOrig ? "#9e2412" : "rgba(48,68,88,0.82)";
      ctx.fillText(isOrig ? "原點(0,0)" : `(${tx>=0?'+'+tx:tx},${ty>=0?'+'+ty:ty})`, sx0 + 4*dpr, sy0 + 3*dpr);
    });
  }

  ctx.font = `700 ${Math.round(11.5*dpr)}px "Noto Serif TC", serif`;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  const placed = [];
  // Place highest-priority towns first in collision table, then render back-to-front so major towns NEVER get covered!
  const toDraw = [];
  DATA.markers.forEach(m => {
    const [sx, sy] = w2s(m.ax, m.ay);
    ctx.beginPath();
    ctx.arc(sx, sy, (m.kind === "major" ? 6.2 : 4.0) * dpr, 0, Math.PI*2);
    ctx.fillStyle = m.kind === "major" ? "#b22618" : (m.kind === "dungeon" ? "#602a80" : (m.kind === "plague" ? "#76565c" : (m.kind === "town" ? "#ba6218" : "#345c3e")));
    ctx.fill();
    ctx.lineWidth = 1.6 * dpr; ctx.strokeStyle = "#fff8e8"; ctx.stroke();

    if (showLabels) {
      const tw = ctx.measureText(m.label).width;
      const pw = tw + 12*dpr, ph = 19*dpr;
      const py = sy - 15*dpr;
      const x0 = sx - pw*0.5, y0 = py - ph*0.5, x1 = sx + pw*0.5, y1 = py + ph*0.5;
      const hit = placed.some(b => !(x1 + 3*dpr < b[0] || x0 - 3*dpr > b[2] || y1 + 3*dpr < b[1] || y0 - 3*dpr > b[3]));
      if (!hit || m.kind === "major") {
        placed.push([x0, y0, x1, y1]);
        toDraw.push({ m, sx, py, pw, ph });
      }
    }
  });
  for (let i = toDraw.length - 1; i >= 0; i--) {
    const { m, sx, py, pw, ph } = toDraw[i];
    ctx.fillStyle = m.kind === "major" ? "rgba(142,34,22,0.95)" : "rgba(250,244,230,0.93)";
    ctx.strokeStyle = m.kind === "major" ? "#fff4e0" : "#827056";
    ctx.lineWidth = 1.2 * dpr;
    ctx.beginPath(); ctx.roundRect(sx - pw*0.5, py - ph*0.5, pw, ph, 6*dpr); ctx.fill(); ctx.stroke();
    ctx.fillStyle = m.kind === "major" ? "#fff9ee" : "#2c2218";
    ctx.fillText(m.label, sx, py + 0.5*dpr);
  }
}

let drag = null, down = null;
cv.addEventListener("pointerdown", e => {
  cv.setPointerCapture(e.pointerId);
  drag = { x: e.clientX, y: e.clientY };
  down = { x: e.clientX, y: e.clientY };
});
cv.addEventListener("pointermove", e => {
  if (!drag) return;
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  camX -= ((e.clientX - drag.x) * dpr) / camScale;
  camY -= ((e.clientY - drag.y) * dpr) / camScale;
  drag = { x: e.clientX, y: e.clientY };
  draw();
});
cv.addEventListener("pointerup", e => {
  if (down && Math.hypot(e.clientX - down.x, e.clientY - down.y) < 8) {
    const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    const rect = cv.getBoundingClientRect();
    const [ax, ay] = s2w((e.clientX - rect.left) * dpr, (e.clientY - rect.top) * dpr);
    let best = null, bestD = 1e9;
    DATA.cells.forEach(c => {
      const d = Math.hypot(c.center[0] - ax, c.center[1] - ay);
      if (d < bestD) { bestD = d; best = c; }
    });
    if (best && bestD < 18) {
      selectedCid = best.id;
      const tx = Math.round((best.center[0] - DATA.origin[0]) / DATA.tileStep);
      const ty = Math.round((best.center[1] - DATA.origin[1]) / DATA.tileStep);
      document.getElementById("infTitle").textContent = `${best.title} (#${best.id})`;
      document.getElementById("infBody").textContent = `所屬拼接格：(${tx>=0?'+'+tx:tx}, ${ty>=0?'+'+ty:ty}) ｜ 家戶：${best.hh} 戶（${best.res} 人）\n${best.desc}`;
      draw();
    }
  }
  drag = null; down = null;
});
cv.addEventListener("wheel", e => {
  e.preventDefault();
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  const rect = cv.getBoundingClientRect();
  const sx = (e.clientX - rect.left) * dpr, sy = (e.clientY - rect.top) * dpr;
  const [wx, wy] = s2w(sx, sy);
  camScale = Math.max(2, Math.min(60, camScale * (e.deltaY < 0 ? 1.22 : 1/1.22)));
  camX = wx - (sx - cv.width * 0.5) / camScale;
  camY = wy - (sy - cv.height * 0.5) / camScale;
  draw();
}, { passive: false });

document.getElementById("btnGrid").onclick = function() { showGrid = !showGrid; this.classList.toggle("on", showGrid); draw(); };
document.getElementById("btnLabels").onclick = function() { showLabels = !showLabels; this.classList.toggle("on", showLabels); draw(); };
document.getElementById("btnReset").onclick = fit;
fit();
</script>
