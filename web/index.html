<!DOCTYPE html>
<html lang="zh-Hant">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
	<meta name="theme-color" content="#1e2328">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<title>奇點世界</title>
	<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect fill='%232a2a2a' width='32' height='32'/><text x='16' y='22' font-size='18' fill='%23e0e0e0' text-anchor='middle' font-family='sans-serif'>奇</text></svg>">
	<link rel="apple-touch-icon" href="/icon.svg">
	<link rel="manifest" href="/manifest.webmanifest">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/lxgw-wenkai-mono-tc@5/index.min.css">
	<style>
	@font-face {
		font-family: 'Chiron GoRound TC';
		font-style: normal;
		font-weight: 400;
		font-display: swap;
		src: url('chiron-goround-tc-sub.ttf') format('truetype');
	}
	@font-face {
		font-family: 'FZJiaGuWen';
		font-style: normal;
		font-weight: 400;
		font-display: swap;
		src: url('FZJiaGuWen.ttf') format('truetype');
	}
	</style>
	<link rel="stylesheet" href="style.css?v=0.21.0">
	<link rel="stylesheet" href="game.css?v=0.21.0">
	<!-- grid MUD 專用樣式（非觀景窗模式載入）-->
	<link rel="stylesheet" href="game-grid.css?v=0.21.0" id="game-grid-css" disabled>
</head>
<body>
	<!-- 登入／創角 -->
	<div id="auth-screen" class="auth-screen">
		<div class="auth-box">
			<h2 class="auth-title">奇點世界</h2>
			<p class="auth-hint" id="auth-hint">請輸入 ID 與密碼登入</p>
			<p class="auth-error" id="auth-message" role="alert" aria-live="polite"></p>
			<form id="auth-form" class="auth-form" autocomplete="off">
				<div class="auth-field">
					<label for="auth-id">角色 ID <span class="auth-label-note">（ID 即為角色姓名）</span></label>
					<input type="text" id="auth-id" name="id" required minlength="2" maxlength="32" placeholder="2～32 字元" autocomplete="username">
				</div>
				<div class="auth-field">
					<label for="auth-password">密碼</label>
					<input type="password" id="auth-password" name="password" required minlength="6" placeholder="至少 6 字元" autocomplete="current-password">
				</div>
				<div class="auth-field auth-field-create" id="auth-display-wrap" hidden>
					<label for="auth-display-char">顯示字（選填）</label>
					<input type="text" id="auth-display-char" name="display_char" maxlength="2" placeholder="地圖上顯示一字，預設「我」">
				</div>
				<div class="auth-field auth-field-create" id="auth-gender-wrap" hidden>
					<span class="auth-label">性別</span>
					<div class="auth-gender-options">
						<label class="auth-radio"><input type="radio" name="gender" value="男" id="auth-gender-m" checked> 男</label>
						<label class="auth-radio"><input type="radio" name="gender" value="女" id="auth-gender-f"> 女</label>
					</div>
				</div>
				<div class="auth-actions" id="auth-login-actions">
					<button type="submit" name="action" value="login" id="auth-btn-login">登入</button>
					<button type="button" id="auth-btn-switch">沒有帳號？創角</button>
				</div>
				<div class="auth-actions auth-actions-create" id="auth-create-actions" hidden>
					<button type="submit" name="action" value="create" id="auth-btn-create">創角</button>
					<button type="button" id="auth-btn-back">已有帳號？登入</button>
				</div>
			</form>
		</div>
	</div>

	<!-- ═══ Grid MUD 模式（唯一模式）：v5 三區 UI ═══ -->
	<div id="app-grid" class="game-grid-app sw-app" hidden>

		<!-- 上區：描述欄（四層 + 互動 log 流）-->
		<div id="sw-desc-panel" class="sw-desc-panel">
			<!-- L1 時間段（JS 填充，世界自走時重抽）-->
			<div id="sw-l1-time" class="sw-desc-layer sw-l1"></div>
			<!-- L2 範圍氣候段（JS 填充，氣候事件變化時重抽）-->
			<div id="sw-l2-climate" class="sw-desc-layer sw-l2"></div>
			<!-- L3 當前格初始段（JS 填充，踏入抽一次，離格前不變）-->
			<div id="sw-l3-terrain" class="sw-desc-layer sw-l3"></div>
			<!-- L4 物件卡片（JS 動態渲染，在場即顯）-->
			<div id="sw-l4-objects" class="sw-desc-layer sw-l4"></div>
		</div>

		<!-- 中上區：互動 log 流（獨立可滾，不會推走描述欄）-->
		<div id="sw-log" class="sw-log-stream"></div>

		<!-- 中區：路口形狀 UI（四方 + 中央探索）-->
		<div id="sw-junction" class="sw-junction">
			<div class="junction-north" id="exit-north"></div>
			<div class="junction-row">
				<div class="junction-west" id="exit-west"></div>
				<button class="junction-center" id="btn-explore">探索</button>
				<div class="junction-east" id="exit-east"></div>
			</div>
			<div class="junction-south" id="exit-south"></div>
		</div>

		<!-- 下區：屬性條 + 玩家名 -->
		<footer id="bottom-bar" class="game-grid-footer sw-statusbar">
			<div class="game-grid-footer-inner">
				<div class="grid-stats-left">
					<div class="stat-mini" title="氣血"><div class="stat-track"><div class="stat-fill hp" id="bar-hp"></div></div></div>
					<div class="stat-mini" title="體力"><div class="stat-track"><div class="stat-fill stamina" id="bar-stamina"></div></div></div>
				</div>
				<div id="player-name" class="grid-player-name" tabindex="0">姓名</div>
				<div class="grid-stats-right">
					<div class="stat-mini" title="能量"><div class="stat-track"><div class="stat-fill energy" id="bar-inner"></div></div></div>
					<div class="stat-mini" title="精神"><div class="stat-track"><div class="stat-fill spirit" id="bar-spirit"></div></div></div>
				</div>
			</div>
		</footer>

		<!-- 舊 log id 相容橋：sw-log.js 等模組仍寫 #log，用隱藏 div 承接再轉接到 #sw-log -->
		<div id="log" style="display:none" aria-hidden="true"></div>

	</div><!-- /#app-grid -->

	<!-- 初始化：grid MUD 是唯一模式 -->
	<script>
	(function () {
		document.getElementById('app-grid').id = 'app';
		var css = document.getElementById('game-grid-css');
		if (css) css.disabled = false;
		document.body.classList.add('game-grid-body');
	})();
	</script>

	<script src="narrative-markdown.js?v=0.21.0"></script>
	<script src="game-ui.js?v=0.21.0"></script>
	<script src="sw-room-desc.js?v=0.22.0"></script>
	<script src="sw-object-list.js?v=0.22.0"></script>
	<script src="grid-map.js?v=0.22.0"></script>
	<script src="sw-log.js?v=0.22.1"></script>
	<script src="sw-panes.js?v=0.21.0"></script>
	<script src="sw-modals.js?v=0.21.0"></script>
	<script src="sw-interactions.js?v=0.21.0"></script>
	<script src="sw-clock.js?v=0.21.0"></script>
	<script src="sw-narrative.js?v=0.21.0"></script>
	<script src="sw-auth.js?v=0.21.0"></script>
	<script src="main.js?v=0.22.0"></script>
	<script>
		window.showGameAfterLogin = function () {
			var auth = document.getElementById('auth-screen');
			var app  = document.getElementById('app');
			if (auth) auth.style.display = 'none';
			if (app)  app.hidden = false;
		};
		window.closeDrawers = function () {};
		window.triggerLook  = function () {};
		if ('serviceWorker' in navigator) {
			window.addEventListener('load', function () {
				// updateViaCache:'none' 讓瀏覽器檢查 SW 更新時繞 HTTP cache（破 CF 的 4h browser cache TTL 續命）
				navigator.serviceWorker.register('/sw.js?v=0.20.46', { updateViaCache: 'none' }).then(function (reg) {
					if (reg.update) reg.update();  // 主動觸發 update check，不等預設 24h 週期
					reg.addEventListener('updatefound', function () {
						var w = reg.installing;
						w.addEventListener('statechange', function () {
							if (w.state === 'installed' && navigator.serviceWorker.controller) {
								window.location.reload();
							}
						});
					});
				}).catch(function () {});
			});
		}
		// gameConnect + visibilitychange 由 main.js 末尾統一綁定（此處不重複，否則會開兩條 WS 互相踢）
	</script>
</body>
</html>
