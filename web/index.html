<!DOCTYPE html>
<html lang="zh-Hant">
<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
	<meta name="theme-color" content="#1e2328">
	<meta name="apple-mobile-web-app-capable" content="yes">
	<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
	<title>奇點世界</title>
	<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect fill='%232a2a2a' width='32' height='32'/><text x='16' y='22' font-size='18' fill='%23e0e0e0' text-anchor='middle' font-family='sans-serif'>奇</text></svg>">
	<link rel="apple-touch-icon" href="/icon.svg">
	<link rel="manifest" href="/manifest.webmanifest">
	<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@fontsource/lxgw-wenkai-mono-tc@5/index.min.css">
	<style>
	@font-face {
		font-family: 'Chiron GoRound TC';
		font-style: normal;
		font-weight: 400;
		font-display: swap;
		src: url('chiron-goround-tc-sub.ttf') format('truetype');
	}
	@font-face {
		font-family: 'FZJiaGuWen';
		font-style: normal;
		font-weight: 400;
		font-display: swap;
		src: url('FZJiaGuWen.ttf') format('truetype');
	}
	</style>
	<link rel="stylesheet" href="style.css?v=0.20.18">
	<link rel="stylesheet" href="game.css?v=0.20.18">
	<!-- grid MUD 專用樣式（非觀景窗模式載入）-->
	<link rel="stylesheet" href="game-grid.css?v=0.20.18" id="game-grid-css" disabled>
</head>
<body>
	<!-- 登入／創角 -->
	<div id="auth-screen" class="auth-screen">
		<div class="auth-box">
			<h2 class="auth-title">奇點世界</h2>
			<p class="auth-hint" id="auth-hint">請輸入 ID 與密碼登入</p>
			<p class="auth-error" id="auth-message" role="alert" aria-live="polite"></p>
			<form id="auth-form" class="auth-form" autocomplete="off">
				<div class="auth-field">
					<label for="auth-id">角色 ID <span class="auth-label-note">（ID 即為角色姓名）</span></label>
					<input type="text" id="auth-id" name="id" required minlength="2" maxlength="32" placeholder="2～32 字元" autocomplete="username">
				</div>
				<div class="auth-field">
					<label for="auth-password">密碼</label>
					<input type="password" id="auth-password" name="password" required minlength="6" placeholder="至少 6 字元" autocomplete="current-password">
				</div>
				<div class="auth-field auth-field-create" id="auth-display-wrap" hidden>
					<label for="auth-display-char">顯示字（選填）</label>
					<input type="text" id="auth-display-char" name="display_char" maxlength="2" placeholder="地圖上顯示一字，預設「我」">
				</div>
				<div class="auth-field auth-field-create" id="auth-gender-wrap" hidden>
					<span class="auth-label">性別</span>
					<div class="auth-gender-options">
						<label class="auth-radio"><input type="radio" name="gender" value="男" id="auth-gender-m" checked> 男</label>
						<label class="auth-radio"><input type="radio" name="gender" value="女" id="auth-gender-f"> 女</label>
					</div>
				</div>
				<div class="auth-actions" id="auth-login-actions">
					<button type="submit" name="action" value="login" id="auth-btn-login">登入</button>
					<button type="button" id="auth-btn-switch">沒有帳號？創角</button>
				</div>
				<div class="auth-actions auth-actions-create" id="auth-create-actions" hidden>
					<button type="submit" name="action" value="create" id="auth-btn-create">創角</button>
					<button type="button" id="auth-btn-back">已有帳號？登入</button>
				</div>
			</form>
		</div>
	</div>

	<!-- ═══ 觀景窗模式（earth.ygggt.com）：舊 hex canvas UI ═══ -->
	<div id="app-observatory" class="app-after-login" hidden>
		<!-- 頂欄：遊戲時間 -->
		<header id="top-bar-obs">
			<div class="bar-cell" id="game-time-date-cell">
				<span id="game-time-date">奇點曆</span>
			</div>
			<div class="bar-cell" id="sundial-cell">
				<svg id="game-time-svg" class="game-time-svg" viewBox="0 0 32 32" aria-hidden="true">
					<circle class="game-time-face" cx="16" cy="16" r="14" fill="none" stroke="currentColor" stroke-width="1.5"/>
					<line id="game-time-hand" class="game-time-hand" x1="16" y1="16" x2="16" y2="8" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" transform="rotate(0 16 16)"/>
				</svg>
			</div>
			<div class="bar-cell" id="clock-cell">
				<span id="game-time-clock"></span>
				<span id="game-time-label"></span>
			</div>
		</header>

		<!-- 主輸出區 -->
		<main id="main-output">
			<div id="log"></div>
		</main>

		<!-- 標籤列 -->
		<nav id="tab-bar">
			<button class="tab-btn active" data-tab="room">房間</button>
			<button class="tab-btn" data-tab="inventory">背包</button>
			<button class="tab-btn" data-tab="character">人物</button>
			<button class="tab-btn" data-tab="skills">技能</button>
		</nav>

		<!-- 標籤面板（可收合） -->
		<div id="tab-panel">
			<div id="panel-room" class="tab-pane active" data-tab="room">
				<div id="room-info"></div>
			</div>
			<div id="panel-inventory" class="tab-pane" data-tab="inventory" hidden>
				<div id="inventory-weight"></div>
				<div id="inventory-list"></div>
			</div>
			<div id="panel-character" class="tab-pane" data-tab="character" hidden>
				<div id="status-content"></div>
				<div id="player-modal-pane-equip"></div>
			</div>
			<div id="panel-skills" class="tab-pane" data-tab="skills" hidden>
				<div id="skill-content"></div>
				<div id="starplate-content"></div>
			</div>
		</div>

		<!-- 底欄：方向鈕 + 姓名 + 狀態條 -->
		<footer id="bottom-bar-obs">
			<div id="dpad">
				<button class="dir-btn" data-dir="西北">↖</button>
				<button class="dir-btn" data-dir="北">↑</button>
				<button class="dir-btn" data-dir="東北">↗</button>
				<button class="dir-btn" data-dir="西">←</button>
				<button class="dir-btn dir-center" id="look-btn">●</button>
				<button class="dir-btn" data-dir="東">→</button>
				<button class="dir-btn" data-dir="西南">↙</button>
				<button class="dir-btn" data-dir="南">↓</button>
				<button class="dir-btn" data-dir="東南">↘</button>
			</div>
			<div id="bottom-status">
				<div id="player-name" tabindex="0">姓名</div>
				<div class="stat-mini"><label>氣血</label><div class="stat-track"><div class="stat-fill hp" id="bar-hp"></div></div></div>
				<div class="stat-mini"><label>體力</label><div class="stat-track"><div class="stat-fill stamina" id="bar-stamina"></div></div></div>
				<div class="stat-mini"><label>能量</label><div class="stat-track"><div class="stat-fill energy" id="bar-inner"></div></div></div>
				<div class="stat-mini"><label>精神</label><div class="stat-track"><div class="stat-fill spirit" id="bar-spirit"></div></div></div>
			</div>
		</footer>
	</div>

	<!-- ═══ Grid MUD 模式（預設，非 ygggt 域名）：四區塊 UI ═══ -->
	<div id="app-grid" class="game-grid-app" hidden>

		<!-- 頂欄：三欄（無標題） -->
		<header id="top-bar" class="game-grid-header">
			<div class="bar-cell" id="game-time-date-cell-g">
				<span id="game-time-date"></span>
			</div>
			<div class="bar-cell" id="sundial-cell-g">
				<svg id="game-time-svg" class="game-time-svg" viewBox="0 0 32 32" aria-hidden="true">
					<circle class="game-time-face" cx="16" cy="16" r="14" fill="none" stroke="currentColor" stroke-width="1.5"/>
					<line id="game-time-hand" class="game-time-hand" x1="16" y1="16" x2="16" y2="8"
					      stroke="currentColor" stroke-width="1.5" stroke-linecap="round" transform="rotate(0 16 16)"/>
				</svg>
			</div>
			<div class="bar-cell" id="clock-cell-g">
				<span id="game-time-clock"></span> <span id="game-time-label"></span>
			</div>
		</header>

		<!-- 中間主體：左物件欄 + 右側（上描述 + 下地圖）-->
		<div class="game-grid-body-row">

			<!-- 左：物件欄（窄，萬物皆物件）-->
			<aside class="game-grid-sidebar" id="sidebar-objects">
				<!-- 無「物件欄」標題（設計硬規則：示意名不印在 UI）-->
				<div id="mud-obj-list" class="mud-obj-list">
					<!-- JS 填充 -->
				</div>
			</aside>

			<!-- 右：房間描述（上小）+ 地圖（下大）-->
			<div class="game-grid-main">

				<!-- 上：房間描述 -->
				<div class="game-grid-room-desc" id="mud-room-desc">
					<!-- JS 填充 -->
				</div>

				<!-- 下：地圖視口（格子 + 連線）-->
				<div class="game-grid-map-viewport" id="gmap-viewport">
					<div id="gmap-grid" class="gmap-grid">
						<!-- JS 動態生成格子 -->
					</div>
				</div>

			</div>
		</div>

		<!-- 底欄：三欄（左氣血體力 | 中姓名 | 右能量精神）-->
		<footer id="bottom-bar" class="game-grid-footer">
			<div class="game-grid-footer-inner">
				<div class="grid-stats-left">
					<div class="stat-mini"><label>氣血</label><div class="stat-track"><div class="stat-fill hp" id="bar-hp"></div></div></div>
					<div class="stat-mini"><label>體力</label><div class="stat-track"><div class="stat-fill stamina" id="bar-stamina"></div></div></div>
				</div>
				<div id="player-name" class="grid-player-name" tabindex="0">姓名</div>
				<div class="grid-stats-right">
					<div class="stat-mini"><label>能量</label><div class="stat-track"><div class="stat-fill energy" id="bar-inner"></div></div></div>
					<div class="stat-mini"><label>精神</label><div class="stat-track"><div class="stat-fill spirit" id="bar-spirit"></div></div></div>
				</div>
				<!-- log 輸出（底欄展開區，保留隱藏）-->
				<div id="log" class="grid-log hidden" style="display:none"></div>
			</div>
		</footer>

	</div><!-- /#app-grid -->

	<!-- hostname 判斷：決定模式並設置 #app 指向哪個容器 -->
	<script>
	(function () {
		// 只有 exact match earth.ygggt.com 才是觀景窗
		// 其他所有域名（其他 ygggt 子域、localhost、IP、Cloudflare Tunnel）都走 grid MUD
		var isObservatory = window.location.hostname === 'earth.ygggt.com';

		if (isObservatory) {
			// 觀景窗模式：啟用舊 hex UI
			window.__gameMode = 'observatory';
			document.getElementById('app-observatory').id = 'app';
			document.getElementById('app-grid').remove();
		} else {
			// Grid MUD 模式：啟用四區塊 UI
			window.__gameMode = 'grid';
			document.getElementById('app-grid').id = 'app';
			document.getElementById('app-observatory').remove();
			// 啟用 game-grid.css
			var css = document.getElementById('game-grid-css');
			if (css) css.disabled = false;
			// body 加 game-grid-body class
			document.body.classList.add('game-grid-body');
		}
	})();
	</script>

	<script src="narrative-markdown.js?v=0.20.18"></script>
	<script src="game-ui.js?v=0.20.18"></script>
	<!-- grid-map.js 只在非觀景窗模式需要，但兩種模式都載入無害（沒有 DOM 目標就不動）-->
	<script src="grid-map.js?v=0.20.18"></script>
	<script src="main.js?v=0.20.18"></script>
	<script>
		// grid MUD 模式覆蓋：showGameAfterLogin 直接顯示 #app（已由 hostname 判斷決定哪個是 #app）
		// 觀景窗模式：closeDrawers / triggerLook 相容 game-ui.js 可能缺的 DOM
		if (window.__gameMode === 'grid') {
			window.showGameAfterLogin = function () {
				var auth = document.getElementById('auth-screen');
				var app  = document.getElementById('app');
				if (auth) auth.style.display = 'none';
				if (app)  app.hidden = false;
			};
			window.closeDrawers = function () {};
			window.triggerLook  = function () {};
		}
		if ('serviceWorker' in navigator) {
			window.addEventListener('load', function () {
				navigator.serviceWorker.register('/sw.js?v=0.20.18').then(function (reg) {
					reg.addEventListener('updatefound', function () {
						var w = reg.installing;
						w.addEventListener('statechange', function () {
							if (w.state === 'installed' && navigator.serviceWorker.controller) {
								window.location.reload();
							}
						});
					});
				}).catch(function () {});
			});
		}
		document.addEventListener('DOMContentLoaded', function () {
			if (window.gameConnect) window.gameConnect();
			document.addEventListener('visibilitychange', function () {
				if (document.visibilityState === 'visible' && window.gameTryReconnect) {
					window.gameTryReconnect();
				}
			});
		});
	</script>
</body>
</html>
