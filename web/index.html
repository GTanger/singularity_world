<!DOCTYPE html>
<html lang="zh-Hant">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="theme-color" content="#efe8d8">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>奇點世界</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect fill='%23efe8d8' rx='6' width='32' height='32'/><circle cx='16' cy='16' r='13' fill='%23f8f3e7' stroke='%23261d14' stroke-width='1.5'/><text x='16' y='22' font-size='17' font-weight='700' fill='%23261d14' text-anchor='middle' font-family='serif'>奇</text></svg>">
  <link rel="apple-touch-icon" href="/icon.svg">
  <link rel="manifest" href="/manifest.webmanifest">
  <link rel="stylesheet" href="style.css?v=20261128r11" disabled>
  <link rel="stylesheet" href="island-ui.css?v=20261128r11">
</head>
<body>
  <!-- 輕量提示條 -->
  <div id="oi-toast" class="oi-toast" hidden role="status" aria-live="polite"></div>

  <!-- 一、海港通行登入頁 -->
  <div id="oi-auth-screen" class="oi-auth-screen">
    <div class="oi-auth-card">
      <h1 class="oi-auth-title">奇點世界</h1>
      <p id="oi-auth-sub" class="oi-auth-sub">輸入旅人帳號與通行密語，重返白鷗港</p>
      <p id="oi-auth-msg" class="oi-auth-msg" role="alert"></p>
      <form id="oi-auth-form" autocomplete="off">
        <div class="oi-field">
          <label for="oi-auth-id">旅人帳號</label>
          <input type="text" id="oi-auth-id" class="oi-input" minlength="2" maxlength="32" required placeholder="2 至 32 字" autocomplete="username">
        </div>
        <div class="oi-field">
          <label for="oi-auth-pw">通行密語</label>
          <input type="password" id="oi-auth-pw" class="oi-input" minlength="6" required placeholder="至少 6 個字元" autocomplete="current-password">
        </div>
        <div class="oi-btn-row">
          <button type="submit" id="oi-auth-submit" class="oi-btn oi-btn-primary">踏入海港</button>
          <button type="button" id="oi-auth-toggle" class="oi-btn">初次登島？登記帳號</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 二、初抵白鷗港・港務登岸冊 -->
  <div id="oi-origin-screen" class="oi-auth-screen" hidden>
    <div class="oi-auth-card" style="width:min(100%, 500px);">
      <h2 class="oi-auth-title">白鷗港・港務登岸冊</h2>
      <p class="oi-auth-sub">雙桅商船已靠妥東岸棧橋，請在港務木冊留下你的名號與來歷</p>
      <p id="oi-origin-msg" class="oi-auth-msg" role="alert"></p>
      <form id="oi-origin-form" autocomplete="off">
        <div class="oi-field">
          <label for="oi-origin-name">行旅名號</label>
          <input type="text" id="oi-origin-name" class="oi-input" minlength="2" maxlength="16" required placeholder="鎮上街坊對你的稱呼">
        </div>
        <div class="oi-field">
          <label for="oi-origin-app">外貌與裝束</label>
          <input type="text" id="oi-origin-app" class="oi-input" maxlength="40" placeholder="例如：披著海風舊斗篷、指節厚實">
        </div>
        <div class="oi-field">
          <label>出身種族</label>
          <div id="oi-race-grid" class="oi-origin-grid">
            <button type="button" class="oi-choice-card active" data-race="人類">
              <strong>人類</strong>
              <small>熟稔海港商語，往來各鎮市集對答自如</small>
            </button>
            <button type="button" class="oi-choice-card" data-race="矮人">
              <strong>矮人</strong>
              <small>通曉山嶽古語，識得前朝石碑與爐火門道</small>
            </button>
            <button type="button" class="oi-choice-card" data-race="精靈">
              <strong>精靈</strong>
              <small>通曉古林語，熟悉深林草藥與老樹蹤跡</small>
            </button>
            <button type="button" class="oi-choice-card" data-race="獸人">
              <strong>獸人</strong>
              <small>通曉荒原語，略辨灰耳部族短促叫嚷</small>
            </button>
          </div>
        </div>
        <div class="oi-field">
          <label>隨船帶下的吃飯傢伙</label>
          <div id="oi-pack-grid" class="oi-origin-grid">
            <button type="button" class="oi-choice-card active" data-pack="smith_apprentice">
              <strong>鐵匠鋪幫工</strong>
              <small>隨身帶下【港務舊鍛錘】與一張【船東抵宿券】</small>
            </button>
            <button type="button" class="oi-choice-card" data-pack="forest_hunter">
              <strong>山林獵客</strong>
              <small>隨身帶下【舊鹿角獵刀】與兩份【黑麥乾糧】</small>
            </button>
            <button type="button" class="oi-choice-card" data-pack="fallen_peddler">
              <strong>遠航行商</strong>
              <small>隨身帶下【包鐵行商手杖】與一張【船東抵宿券】</small>
            </button>
            <button type="button" class="oi-choice-card" data-pack="deck_sailor">
              <strong>甲板水手</strong>
              <small>隨身帶下【包銅繫纜短棍】與一卷【粗麻繩】</small>
            </button>
          </div>
        </div>
        <div class="oi-btn-row">
          <button type="submit" class="oi-btn oi-btn-primary">步下棧橋・踏入白鷗港</button>
        </div>
      </form>
    </div>
  </div>

  <!-- 三、主遊戲三區鎖定外殼 -->
  <div id="oi-shell" class="oi-shell" hidden>
    <!-- 1. 固定頂欄 -->
    <header class="oi-topbar">
      <div id="oi-clock-text" class="oi-clock-text">太陽曆 329 年・金秋・52 日 ｜ 晨鐘二響</div>
      <div class="oi-top-right">
        <span id="oi-tide-weather" class="oi-tide-badge">早潮・晴朗</span>
      </div>
    </header>

    <!-- 2. 中央獨立捲動舞台 -->
    <div class="oi-main-workspace">
      <main class="oi-scene-scroll" aria-label="眼前風物與人物交會">
        <div class="oi-scene-inner">
          <div class="oi-scene-header">
            <div class="oi-scene-title-wrap">
              <div id="oi-region-crumb" class="oi-region-crumb" hidden></div>
              <h1 id="oi-scene-title" class="oi-scene-title">白鷗港・港務碼頭</h1>
            </div>
          </div>

          <div id="oi-body-cues" class="oi-body-cues" hidden></div>
          <div id="oi-offline-recap" class="oi-offline-recap" hidden></div>
          <div id="oi-skirmish-wrap" hidden></div>

          <p id="oi-scene-desc" class="oi-scene-desc"></p>
          <div id="oi-live-stage" class="oi-live-stage" hidden></div>

          <div id="oi-presence-people" class="oi-presence-people" hidden></div>
          <div id="oi-presence-objects" class="oi-presence-objects" hidden></div>
          <div id="oi-presence-doors" class="oi-presence-doors" hidden></div>

          <section class="oi-breaths-box" id="oi-breaths-box" aria-live="polite"></section>
        </div>
      </main>

      <!-- 常駐固定框架手繪靜態地圖（進室內自動收合為單行出門條，讓文字區滿屏閱讀） -->
      <aside id="oi-map-aside" class="oi-desktop-aside" aria-label="手繪靜態地圖">
        <div id="oi-indoor-bar" class="oi-indoor-bar" hidden></div>
        <div id="oi-mini-map-frame" class="oi-mini-map-frame"></div>
      </aside>
    </div>

    <!-- 3. 鎖定底欄：五鍵導覽（自身／行囊／搜巡／近事／輿圖） -->
    <footer class="oi-bottom-dock">
      <nav id="oi-exits-strip" class="oi-exits-strip" aria-label="可通行方向" hidden></nav>
      <div class="oi-nav-five">
        <button type="button" id="oi-nav-self" class="oi-nav-btn">自身</button>
        <button type="button" id="oi-nav-bag" class="oi-nav-btn">行囊</button>
        <button type="button" id="oi-nav-explore" class="oi-nav-btn">搜巡</button>
        <button type="button" id="oi-nav-recap" class="oi-nav-btn">近事</button>
        <button type="button" id="oi-nav-map" class="oi-nav-btn">輿圖</button>
      </div>
    </footer>
  </div>

  <!-- 貼底抽屜（當面交談／自身／行囊木箱／近事） -->
  <div id="oi-sheet-backdrop" class="oi-sheet-backdrop" hidden>
    <section id="oi-bottom-sheet" class="oi-bottom-sheet" role="dialog" aria-modal="true" aria-labelledby="oi-sheet-title">
      <header class="oi-sheet-head">
        <h3 id="oi-sheet-title">交談</h3>
        <button type="button" id="oi-sheet-close" class="oi-close-x" aria-label="關閉">×</button>
      </header>
      <div id="oi-sheet-body" class="oi-sheet-body"></div>
    </section>
  </div>

  <!-- 全螢幕手繪靜態輿圖（全島輿圖 ↔ 本區手繪圖） -->
  <div id="oi-map-modal" class="oi-map-modal" hidden role="dialog" aria-modal="true" aria-label="全幅手繪輿圖">
    <div id="oi-map-canvas" class="oi-map-canvas-wrap"></div>
    <div class="oi-map-top">
      <span id="oi-map-banner" class="oi-map-banner">銀鷗外島</span>
    </div>
    <div class="oi-map-bottom-bar">
      <div class="oi-map-tabs">
        <button type="button" class="oi-icon-btn" data-map-scale="local">本區手繪圖</button>
        <button type="button" class="oi-icon-btn active" data-map-scale="island">全島輿圖</button>
      </div>
      <div class="oi-map-zoom-btns">
        <button type="button" id="oi-map-close" class="oi-close-x oi-close-x-primary" aria-label="關閉">×</button>
      </div>
    </div>
  </div>

  <script src="town-basemaps.js?v=20261128r11"></script>
  <script src="static-node-map.js?v=20261128r11"></script>
  <script src="island-ui.js?v=20261128r11"></script>
  <script>
    if ('serviceWorker' in navigator) {
      var hadCtrl = !!navigator.serviceWorker.controller;
      var reloadingSw = false;
      navigator.serviceWorker.addEventListener('controllerchange', function () {
        if (!hadCtrl || reloadingSw) return;
        if (sessionStorage.getItem('sw_reloaded_v20261128r11')) return;
        sessionStorage.setItem('sw_reloaded_v20261128r11', '1');
        reloadingSw = true;
        window.location.reload();
      });
      window.addEventListener('load', function () {
        navigator.serviceWorker.register('/sw.js?v=20261128r11', { updateViaCache: 'none' }).catch(function () {});
      });
    }
  </script>
</body>
</html>
