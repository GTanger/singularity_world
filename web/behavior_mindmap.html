function deriveEntitySlots(ent) {
  if (!ent) return null;
  const title = ent.title || "文曜坊間居民";
  const name = ent.name || ent.id || "無名氏";
  const rawName = String(ent.person_name || ent.display_title || ent.name || ent.id || '').split('|').pop().trim();
  let settlement = '文曜';
  if (CANONICAL_NPC_MACRO_SETTLEMENT[rawName]) {
    settlement = CANONICAL_NPC_MACRO_SETTLEMENT[rawName];
  } else {
    const home = String(ent.home_settlement || ent.home_name || '');
    const work = String(ent.work_venue_label || ent.work_name || '');
    const rest = String(ent.rest_venue_label || '');
    const combined = `${home} ${work} ${rest} ${title}`;
    const outerSettlements = [
      ['風舶角', ['風舶角', '風舶海事', '大船塢', '北冕號', '外澳領航']],
      ['風舶嶼', ['風舶嶼']],
      ['水尾寮', ['水尾寮', '水尾澤']],
      ['半嶺鎮', ['半嶺鎮', '半嶺', '寒水玉切石']],
      ['紅土崁', ['紅土崁']],
      ['霜林口', ['霜林口', '霜林']],
      ['下營', ['下營', '黑沼']],
      ['南哨', ['南哨', '百茫白蘚']],
      ['烏石鼻', ['烏石鼻', '烏石']],
      ['大圳頭', ['大圳頭', '大圳', '草甸改良農具']],
      ['老堰頭', ['老堰頭', '老堰', '翠冠巨木']],
      ['北嶺腳', ['北嶺腳', '北嶺']],
      ['風櫃尾', ['風櫃尾', '風櫃']],
      ['牛埔', ['牛埔', '長風草甸']],
      ['三號坑口', ['三號坑口', '三號坑']]
    ];
    for (const [target, aliases] of outerSettlements) {
      if (aliases.some(a => combined.includes(a))) {
        settlement = target;
        break;
      }
    }
  }
  const wildZones = ["白塔雪巔","赤石坡","落日岬","古河巨木林","長風草甸","西嶺礦谷","清泉溪谷","翠冠巨木林","北坡雲杉林","雲腰雪林","東海峭壁","淺澤泥口","驚濤岩岸","巨藻淺灣","黑石灣","白茫洲","貼山深潭","青籠關","西麓林道"];
  let wildZone = "白茫洲";
  if (title.includes("・")) {
    const prefix = title.split("・")[0];
    if (wildZones.includes(prefix)) {
      wildZone = prefix;
    }
  }
  const rawVessel = ent.held_vessel || "";
  const vesselName = rawVessel ? rawVessel.split("（")[0] : (
    title.includes("鐵") || title.includes("鍛") ? "精鍛平頭小錘" :
    title.includes("木") || title.includes("船") ? "魯班平推刨刀" :
    title.includes("獵") || title.includes("銃") ? "精鍛步巡短刀" :
    title.includes("醫") || title.includes("藥") ? "青銅搗藥杵" :
    title.includes("執事") || title.includes("商") ? "紫銅商簿算盤" : "祖傳青玉佩"
  );
  const breath = ent.breath_habit || "靜室清息";
  const pawnshop = settlement === "文曜" ? "三水當鋪" : `${settlement}・典當什物行`;
  const canteen = settlement === "文曜" ? "三水大食堂" : `${settlement}・街角熱食鋪`;
  const forge = settlement === "文曜" ? "岑氏第一鍛造工坊" : `${settlement}・百工鐵器鍛造坊`;
  const clinic = settlement === "文曜" ? "溫氏脈絡診所" : `${settlement}・脈絡草木診所`;
  const junior = (title.includes("匠") || title.includes("師")) ? "身邊學徒" :
                 (title.includes("獵") || title.includes("銃")) ? "同隊獵手夥伴" :
                 (title.includes("家") || title.includes("農")) ? "同屋年幼晚輩" : "身邊小徒弟";
  const lifeStepTick = ent.life_step_tick || 1240;
  const timeScaleMark = ent.time_scale_mark || `生命直線刻度 #${lifeStepTick}（累計第 86 回同業工序）`;
  const activeNeed = ent.active_need || "生計周轉與日常溫飽需求";
  const imageDecision = ent.image_decision || "延續昨日未竟進度，晨起推進本職工序";
  const situatedAction = ent.situated_action || ent.activity || "依現場物況與器物手感執行工序";
  const carryoverNote = ent.carryover_note || "昨日工序手感與人情帳延續至今晨，起床非歸零重整";

  return {
    id: ent.id,
    name,
    title,
    settlement,
    wildZone,
    vessel: vesselName,
    vesselFull: rawVessel || vesselName,
    breath,
    pawnshop,
    canteen,
    forge,
    clinic,
    junior,
    activity: ent.activity || "日常起居",
    thought: ent.thought || "盤算今日生計",
    mg: ent.magnesium ?? 12,
    cornerstone: ent.cornerstone || "匠心",
    stress: ent.stress ?? 28,
    lifeStepTick,
    timeScaleMark,
    activeNeed,
    imageDecision,
    situatedAction,
    carryoverNote,
    planQueue: Array.isArray(ent.plan_queue) && ent.plan_queue.length === 3 ? ent.plan_queue : [
      `檢視隨身「${vesselName}」器況`,
      `於${settlement}推進本職核心工序`,
      `收工結算荷包並與街坊敘話`
    ],
    activeHooks: Array.isArray(ent.active_hooks) && ent.active_hooks.length > 0 ? ent.active_hooks : [
      `與${settlement}同袍訂有守望互助信約`
    ]
  };
}

function bindSlotText(raw, isRoot = false) {
  if (!raw || !state.boundSlots || state.personalTree) return raw || "";
  const s = state.boundSlots;
  let out = raw
    .replace(/祖傳青玉佩|傳家青玉佩|古玉佩|青玉佩|傳家古物|古物/g, `隨身【${s.vessel}】`)
    .replace(/三水當鋪|當鋪/g, s.pawnshop)
    .replace(/三水大食堂|大食堂/g, s.canteen)
    .replace(/老鐵工坊|岑氏鐵坊|工坊正門/g, s.forge)
    .replace(/溫氏脈絡診所|脈絡診所|診所/g, s.clinic)
    .replace(/三水總商行|總商行/g, `${s.settlement}・總商行`)
    .replace(/茶館|山風茶屋/g, `${s.settlement}・街角茶寮`)
    .replace(/煤棧/g, `${s.settlement}・煤炭棧`)
    .replace(/早市/g, `${s.settlement}・晨間市集`)
    .replace(/黑沼林|黑沼霸主|黑沼岩洞/g, `${s.wildZone || '白茫洲'}`)
    .replace(/風舶角碼頭|碼頭/g, `${s.settlement}・貨運埠頭`)
    .replace(/年幼學徒|小徒弟|學徒/g, s.junior)
    .replace(/《靜室清息》|《鍛爐沉息》|《百戰烈息》|《山林長息》|《潮汐綿息》/g, `《${s.breath}》`);
  if (isRoot) {
    out = `【${s.name}＠${s.settlement}】` + out.replace(/^【[^】]+】/, '');
  }
  return out;
}


function buildPersonalTreeForResident(ent, s) {
  // Extract bracketed entities from ent.activity and ent.thought (e.g. 【謝宇翔】, 【高山苦花魚王】, 【銀鱗土魠魚】)
  const act = ent.activity || "";
  const th = ent.thought || "";
  const brackets = [];
  const re = /【([^】]+)】/g;
  let m;
  while ((m = re.exec(act + " " + th)) !== null) {
    if (!brackets.includes(m[1])) brackets.push(m[1]);
  }
  const leader = brackets.find(b => b.length >= 2 && b.length <= 4 && !b.includes("・") && !b.includes("位")) || "同隊領隊";
  const preyOrTarget = brackets.find(b => b !== leader && !b.includes("・") && !b.includes("位") && b.length >= 3) || "山海奇珍物產";
  const isVesselDull = (s.vesselFull || "").includes("捲刃") || (s.vesselFull || "").includes("微損") || (s.vesselFull || "").includes("待修");
  const roleShort = s.title.split("・").pop() || s.title;

  function N(id, title, gate, weights, micro, hook, practice, deficit, children = []) {
    return { id, title, gate, weights, micro, hook, practice, deficit, children };
  }
  const isBlade = /刀|劍|斧|鎬|剪|槍|矛/.test(s.vessel);
  const maintVenue = isBlade ? s.forge : `${s.settlement}・本職案頭`;

  // Construct a 7-stage (D0..D6) personal causal tree: 生命是一條直線，不可逆時間刻度 t ➔ t+1
  return N(
    `P_D0_${s.id}`,
    `【${s.name}＠${s.settlement}】刻度#${s.lifeStepTick}・${s.cornerstone}・持${s.vessel}`,
    `mg=${s.mg} && stress=${s.stress}% && tick==${s.lifeStepTick}`,
    { flow: 1.0 },
    `【${s.name}】（${s.title}｜時間刻度：#${s.lifeStepTick}｜性格錨點：【${s.cornerstone}】）現處${s.settlement}／${s.wildZone}。跨日延續（非歸零）：${s.carryoverNote}。手握「${s.vesselFull}」，運轉《${s.breath}》：「${th.slice(0, 56)}」`,
    `需求 ➔ 意象決策：${s.activeNeed} ➔ ${s.imageDecision}`,
    `時間刻度：${s.timeScaleMark}（生命直線向前・起床非歸零重整）`,

function scoreNode(node) {
  if (state.forcedNodeIds.has(node.id)) return 999;
  const w = node.weights || {};
  let raw = 0.0;
  for (const [k, coef] of Object.entries(w)) {
    const v = (state.params[k] !== undefined ? state.params[k] : 50) / 100.0;
    raw += (v - 0.45) * coef * 2.4;
  }
  return raw;
}

function computeProbabilities(root) {
  root._prob = 1.0;
  root._active = true;
  const activeChain = [root];

  function walk(node, isParentActive) {
    const kids = node.children || [];
    if (!kids.length) return;
    const scores = kids.map(k => scoreNode(k));
    const maxS = Math.max(...scores);
    const exps = scores.map(s => Math.exp((s - maxS) * 2.2));
    const sumExp = exps.reduce((a, b) => a + b, 0) || 1;
    let bestIdx = 0;
    let bestVal = -1e9;
    kids.forEach((k, idx) => {
      k._prob = exps[idx] / sumExp;
      if (scores[idx] > bestVal) {
        bestVal = scores[idx];
        bestIdx = idx;
      }
    });
    kids.forEach((k, idx) => {
      k._active = isParentActive && (idx === bestIdx);
      if (k._active) activeChain.push(k);
      walk(k, k._active);
    });
  }
  walk(root, true);
  return activeChain;
}

function markVisibleFan(root, fullMode) {
  if (fullMode) {
    function markAll(n) { n._vis = true; (n.children || []).forEach(markAll); }
    markAll(root);
    return;
  }
  function clearVis(n) { n._vis = false; (n.children || []).forEach(clearVis); }
  clearVis(root);

  // High-Legibility 7-Column Multiverse Fan (~22 unique nodes across D0..D6 so scale is ~0.72 and every Chinese character is sharp!)
  function walk(n, depth, onActiveSpine) {
    n._vis = true;
    const kids = n.children || [];
    if (!kids.length) return;
    if (depth === 0) {
      // Show all 4 D1 Cornerstone branches
      kids.forEach(k => walk(k, 1, k._active));
    } else if (depth === 1) {
      if (onActiveSpine) {
        kids.forEach(k => walk(k, 2, k._active));
      } else {
        // Show primary D2 child for each counterfactual D1 branch
        walk(kids[0], 2, false);
      }
    } else {
      // Depth 2..5 -> 3..6
      if (onActiveSpine) {
        kids.forEach(k => walk(k, depth + 1, k._active));
      } else {
        walk(kids[0], depth + 1, false);
      }
    }
  }
  walk(root, 0, true);
}

function layoutTree(root, yOffsetStart, fullMode) {
  markVisibleFan(root, fullMode);
  const nodes = [];
  const edges = [];
  let leafCounter = 0;
  const LEAF_STEP = fullMode ? 86 : 94;
  const COL_WIDTH = 212;

  function assignY(node, depth) {
    node._depth = depth;
    const kids = (node.children || []).filter(k => k._vis);
    if (!kids.length) {
      node._y = yOffsetStart + leafCounter * LEAF_STEP;
      leafCounter += 1;
    } else {
      kids.forEach(k => assignY(k, depth + 1));
      const firstY = kids[0]._y;
      const lastY = kids[kids.length - 1]._y;
      node._y = (firstY + lastY) / 2;
    }
    node._x = depth * COL_WIDTH;
    nodes.push(node);
    kids.forEach(k => {
      edges.push({ from: node, to: k });
    });
  }
  assignY(root, 0);
  return { nodes, edges, totalHeight: yOffsetStart + leafCounter * LEAF_STEP };
}

function renderGraph(autoFit = false) {
  const vp = document.getElementById('viewportG');
  let allNodes = [];
  let allEdges = [];
  let activeChain = [];
  let yCursor = 46;

  const fullMode = !state.compactFan;
  const treesToRender = state.personalTree
    ? [state.personalTree]
    : (state.activeTreeIdx === -1 ? DELOS_TREES : [DELOS_TREES[state.activeTreeIdx]]);

  treesToRender.forEach((u, idx) => {
    const chain = computeProbabilities(u.root);
    if (idx === 0) activeChain = chain;
    const lay = layoutTree(u.root, yCursor, fullMode);
    allNodes = allNodes.concat(lay.nodes);
    allEdges = allEdges.concat(lay.edges);
    yCursor = lay.totalHeight + 70;
  });

  if (autoFit && activeChain.length > 0) {
    const wrap = document.getElementById('canvasWrap');
    const cw = wrap.clientWidth || 930;
    const ch = wrap.clientHeight || 820;
    const treeW = 6 * 212 + 196;
    const treeH = Math.max(400, yCursor);
    const scaleX = (cw - 36) / treeW;
    const scaleY = (ch - 56) / treeH;
    state.scale = Math.max(0.45, Math.min(0.88, Math.min(scaleX, scaleY * 1.04)));
    state.panX = Math.max(14, (cw - treeW * state.scale) / 2);
    state.panY = Math.max(16, (ch - treeH * state.scale) / 2);
  }

  vp.setAttribute('transform', `translate(${state.panX},${state.panY}) scale(${state.scale})`);

  if (!state.selectedNode && activeChain.length > 0) {
    state.selectedNode = activeChain[Math.min(4, activeChain.length - 1)];
  }

  let svgHtml = '';
  const SHORT_DEPTH = [
    "D0 // 根處境與感官 (L1~L2)",
    "D1 // 基石與特質決標 (L3)",
    "D2 // 出門微準備與步態 (L4)",
    "D3 // 街頭遭遇與進場 (L5~L6)",
    "D4 // 社交慣習與微工序 (L7~L8)",
    "D5 // 預期調解與籌碼 (L9)",
    "D6 // 多重宇宙跨日結局 (L10)"
  ];
  for (let d = 0; d <= 6; d++) {
    const cx = d * 212;
    svgHtml += `<line x1="${cx}" y1="0" x2="${cx}" y2="${yCursor}" stroke="rgba(25,55,85,0.45)" stroke-dasharray="4 4"/>`;
    svgHtml += `<rect x="${cx}" y="4" width="194" height="24" rx="3" fill="rgba(8,18,32,0.96)" stroke="#1e4468"/>`;
    svgHtml += `<text x="${cx + 7}" y="20" fill="#00f0ff" font-family="monospace" font-size="11" font-weight="bold">${SHORT_DEPTH[d]}</text>`;
  }

  allEdges.filter(e => !(e.from._active && e.to._active)).forEach(e => {
    const x1 = e.from._x + 194, y1 = e.from._y + 38;
    const x2 = e.to._x, y2 = e.to._y + 38;
    const mx = (x1 + x2) / 2;
    svgHtml += `<path d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}" fill="none" stroke="#1e4163" stroke-width="1.35" opacity="0.78"/>`;
  });

  allEdges.filter(e => e.from._active && e.to._active).forEach(e => {
    const x1 = e.from._x + 194, y1 = e.from._y + 38;
    const x2 = e.to._x, y2 = e.to._y + 38;
    const mx = (x1 + x2) / 2;
    svgHtml += `<path d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}" fill="none" stroke="#00f0ff" stroke-width="3.4" filter="url(#glowCyan)"/>`;
    svgHtml += `<path class="active-edge-anim" d="M${x1},${y1} C${mx},${y1} ${mx},${y2} ${x2},${y2}" fill="none" stroke="#ffb800" stroke-width="1.9"/>`;
  });

  allNodes.forEach(n => {
    const isAct = n._active;
    const isSel = state.selectedNode && state.selectedNode.id === n.id;
    const isHook = n.hook && (n.hook.includes('Hook') || n.hook.includes('StoryCycle'));
    const isBreak = n.hook && (n.hook.includes('崩潰') || n.hook.includes('Exception') || n.hook.includes('Flaw'));
    let stroke = isAct ? '#00f0ff' : (isHook ? '#8a641d' : '#1f4264');
    if (isSel) stroke = '#ffb800';
    let bg = isAct ? 'rgba(5, 32, 52, 0.97)' : 'rgba(7, 15, 27, 0.9)';
    const probPct = Math.round((n._prob || 1) * 100);
    const boundTitle = bindSlotText(n.title, n._depth === 0);
    let mainHead = boundTitle;
    let subHead = "";
    if (boundTitle.includes("】")) {
      const parts = boundTitle.split("】");
      mainHead = parts[0] + "】";
      subHead = parts.slice(1).join("】").trim();
    }
    if (!subHead) {
      subHead = bindSlotText(n.micro || "").slice(0, 14);
    }
    const headShort = mainHead.length > 13 ? mainHead.slice(0, 12) + "…】" : mainHead;
    const subShort = subHead.length > 14 ? subHead.slice(0, 14) + "…" : subHead;
    const gateShort = n.gate.length > 21 ? n.gate.slice(0, 21) + "…" : n.gate;
    const badgeColor = isAct ? '#00f0ff' : (isBreak ? '#ff3b5c' : '#7a9db8');
    const stageTag = `D${n._depth || 0} // ${isAct ? 'ACTIVE' : 'BRANCH'}`;

    svgHtml += `<g class="delos-node" data-id="${n.id}" transform="translate(${n._x},${n._y})" style="cursor:pointer">`;
    svgHtml += `<rect width="194" height="74" rx="5" fill="${bg}" stroke="${stroke}" stroke-width="${isAct || isSel ? 2.5 : 1.25}"/>`;
    svgHtml += `<rect x="0" y="0" width="5" height="74" rx="2" fill="${isAct ? '#00f0ff' : (isBreak ? '#ff3b5c' : (isHook ? '#ffb800' : '#26517a'))}"/>`;
    svgHtml += `<text x="10" y="15" fill="${isAct ? '#00f0ff' : '#6c92b4'}" font-family="monospace" font-size="9.5" font-weight="bold">${stageTag}</text>`;
    svgHtml += `<rect x="142" y="3" width="46" height="16" rx="2" fill="${isAct ? 'rgba(0,240,255,0.22)' : 'rgba(18,38,62,0.88)'}" stroke="${badgeColor}" stroke-width="0.8"/>`;
    svgHtml += `<text x="165" y="14" text-anchor="middle" fill="${isAct ? '#ffb800' : '#a8c7e0'}" font-family="monospace" font-size="9.8" font-weight="bold">P=${probPct}%</text>`;
    svgHtml += `<text x="9" y="35" fill="${isAct ? '#ffffff' : '#cce2f5'}" font-size="12.5" font-weight="700">${headShort}</text>`;
    svgHtml += `<text x="10" y="52" fill="${isAct ? '#7ce8ff' : '#8ab0d0'}" font-size="11">${subShort}</text>`;
    svgHtml += `<text x="10" y="67" fill="${isAct ? '#ffb800' : badgeColor}" font-family="monospace" font-size="9.8">IF ${gateShort}</text>`;
    svgHtml += `</g>`;
  });

  vp.innerHTML = svgHtml;
  const vc = document.getElementById('visNodeCount'); if (vc) vc.textContent = allNodes.length;

  const nodeMap = {};
  allNodes.forEach(n => { nodeMap[n.id] = n; });
  vp.querySelectorAll('.delos-node').forEach(el => {
    el.addEventListener('click', (ev) => {
      ev.stopPropagation();
      const nid = el.getAttribute('data-id');
      const target = nodeMap[nid];
      if (target) {
        state.selectedNode = target;
        state.forcedNodeIds.clear();
        state.forcedNodeIds.add(target.id);
        renderGraph(false);
        renderRightPanel();
      }
    });
  });

  const curTreeTotal = state.activeTreeIdx === -1 ? 1265 : DELOS_TREES[state.activeTreeIdx].node_count;
  document.getElementById('hudStats').innerHTML =
    `<span>同屏展開節點：<b style="color:#00f0ff">${allNodes.length}</b> / 本樹：<b style="color:#00e676">${curTreeTotal}</b> / 全庫五樹：<b style="color:#ffb800">1,265 節點</b></span>` +
    `<span>深度：<b>D0 起點因 ──► D6 多重宇宙結局 (7階分岔 × 10層微動作)</b></span>`;

  document.getElementById('bottomTrace').innerHTML =
    `⚡ 當前主宇宙鏈：` + activeChain.map(c => { const bt = bindSlotText(c.title, c._depth === 0).split('】')[0]; const st = bt.length > 10 ? bt.slice(0, 10) + '…' : bt; return `<b style="color:#00f0ff">${st}】</b>`; }).join(' ─► ');

  renderRightPanel();
}
function renderLeftPanel() {
  const lp = document.getElementById('leftPanel');
  let html = `<div class="sec-box">
    <div class="sec-title"><span>🎭 6 大基石人格預設 (CORNERSTONE)</span></div>
    <div class="preset-grid">`;
  ARCHETYPES.forEach((a, idx) => {
    html += `<button class="preset-btn" data-arch="${idx}">${a.name}</button>`;
  });
  html += `</div></div>`;

  html += `<div class="sec-box">
    <div class="sec-title"><span>🎛️ 蝴蝶效應數值調控台 (WHAT-IF)</span><span style="color:#ffb800;cursor:pointer" id="btnResetForce">[解除強制鎖定]</span></div>`;
  SLIDER_DEFS.forEach(s => {
    const v = state.params[s.key];
    html += `<div class="slider-row">
      <span>${s.label}</span>
      <input type="range" min="${s.min}" max="${s.max}" value="${v}" data-skey="${s.key}">
      <span class="slider-val" id="sval_${s.key}">${v}</span>
    </div>`;
  });
  html += `</div>`;

  html += `<div class="sec-box">
    <div class="sec-title"><span>🌍 全球四大架構 × 本機赤字對照</span></div>
    <div class="kv-grid" style="font-size:11px">
      <div class="kv-item"><span class="kv-label">1. 因果引擎核心底層律（生命是一條直線）</span>需求 ➔ 意象決策 ➔ 依現況產生行為（生命是一條直線，每天起床不是歸零重整；即便每天做同樣的事，時間刻度 #t 永遠向前不可逆，即便歷經萬般境遇，時間仍然是無法改變的）。</div>
      <div class="kv-item amber"><span class="kv-label">2. Versu Social Practices (Evans & Short)</span>共享多角色『社交慣習微劇本』（當鋪議價、同簷避雨、獵團包抄），提供語境分支 Affordances。</div>
      <div class="kv-item emerald"><span class="kv-label">3. Crusader Kings III (StoryCycles & Hooks)</span>違背本性選擇暴增 Stress 觸發崩潰；互動鑄造『欠單/恩情/把柄 Hook』強制牽動不可逆劇本推進。</div>
      <div class="kv-item crimson"><span class="kv-label">4. 本機赤字超克（不可逆時間刻度）</span>徹底打破單日歸零死結：以生活直線刻度累加手感、器況、人情帳本；決策依現況物況產生具體行為，跨日全面 Carryover 絕非清空重整。</div>
    </div>
  </div>`;

  lp.innerHTML = html;

  lp.querySelectorAll('.preset-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      const a = ARCHETYPES[parseInt(btn.getAttribute('data-arch'), 10)];
      state.forcedNodeIds.clear();
      Object.assign(state.params, a.vals);
      renderLeftPanel();
      renderGraph();
    });
  });

  const resetBtn = document.getElementById('btnResetForce');
  if (resetBtn) {
    resetBtn.addEventListener('click', () => {
      state.forcedNodeIds.clear();
      renderGraph();
    });
  }

  lp.querySelectorAll('input[type=range]').forEach(inp => {
    inp.addEventListener('input', () => {
      const k = inp.getAttribute('data-skey');
      const v = parseInt(inp.value, 10);
      state.params[k] = v;
      state.forcedNodeIds.clear();
      document.getElementById('sval_' + k).textContent = v;
      renderGraph();
    });
  });
}

function renderRightPanel() {
  const rp = document.getElementById('rightPanel');
  const n = state.selectedNode;
  if (!n) {
    rp.innerHTML = `<div class="sec-box">點擊畫布任意節點檢視深度因果與手部微動作拆解</div>`;
    return;
  }
  const probPct = Math.round((n._prob || 1) * 100);
  const kids = n.children || [];
  let kidsHtml = '';
  if (kids.length > 0) {
    kidsHtml = kids.map(k => {
      const kp = Math.round((k._prob || 0) * 100);
      return `<div class="kv-item ${k._active ? 'emerald' : ''}" style="cursor:pointer;margin-top:4px" data-jump="${k.id}">
        <span class="kv-label">子宇宙分岔 (機率 P=${kp}% ${k._active ? '⚡ 當前勝出' : '反事實分支'})</span>
        <b>${bindSlotText(k.title)}</b><br><span style="color:#8ab0d0;font-family:monospace;font-size:10.5px">IF ${k.gate}</span>
      </div>`;
    }).join('');
  } else {
    const timeScaleDesc = state.selectedNode?.timeScale || (state.boundSlots ? `刻度 #${state.boundSlots.lifeStepTick} ➔ #${state.boundSlots.lifeStepTick + 1}` : 't ➔ t+1');
    kidsHtml = `<div class="kv-item violet"><span class="kv-label">⏳ 生命是一條直線（不可逆時間刻度 t ➔ t+1）</span>每個人每天起床不是歸零重整：當前行為結果直接寫入不可逆時間刻度（${timeScaleDesc}），成為下一刻與明日起床時的延續現況（Carryover），絕不倒退回 D0 原點。</div>`;
  }

  const slotBanner = state.boundSlots ? `
    <div class="sec-box" style="background:rgba(0,240,255,0.06);border-bottom:1px solid #00f0ff">
      <div class="sec-title"><span>🧬 個體插槽動態綁定 (生命直線推進)</span><span style="font-family:monospace;font-size:10px">${state.boundSlots.id}</span></div>
      <div class="kv-item emerald" style="font-size:11px;line-height:1.45">
        <b>【${state.boundSlots.name}】</b>（${state.boundSlots.title} ｜ 聚落：${state.boundSlots.settlement}）<br>
        • <b>時間刻度：</b>${state.boundSlots.timeScaleMark}（起床非歸零重整）<br>
        • <b>需求 ➔ 意象決策：</b>${state.boundSlots.activeNeed} ➔ ${state.boundSlots.imageDecision}<br>
        • <b>決策依現況產生行為：</b>${state.boundSlots.situatedAction}<br>
        • <b>隨身器物＆內息：</b>${state.boundSlots.vesselFull} ｜ 《${state.boundSlots.breath}》<br>
        • <b>跨日延續現況：</b>${state.boundSlots.carryoverNote}
      </div>
    </div>` : `
    <div class="sec-box" style="background:rgba(255,184,0,0.06)">
      <div class="sec-title"><span>🧬 參數化因果文法骨架 (PARAMETERIZED STORYLET)</span><span>SLOT TEMPLATE</span></div>
      <div class="kv-item amber" style="font-size:11px;line-height:1.4">
        可從右上角下拉選單選取線上 <b>1,772 名真實居民</b>，將其【職稱、所在聚落、隨身器物、內息、人際對象】動態綁定至此因果樹節點！
      </div>
    </div>`;
  rp.innerHTML = slotBanner + `
    <div class="sec-box">
      <div class="sec-title"><span>🔬 DELOS 節點深度因果拆解儀</span><span>${n.id}</span></div>
      <div class="kv-grid">
        <div class="kv-item">
          <span class="kv-label">節點劇本節拍 (DRAMATIC BEAT) ｜ 分支機率 P=${probPct}%</span>
          <b style="font-size:13.5px;color:#fff">${bindSlotText(n.title)}</b>
        </div>
        <div class="kv-item amber">
          <span class="kv-label">純數值決策/因果閘門 (PURE NUMERIC GATE)</span>
          <code style="color:#ffb800;font-family:monospace;font-size:11.5px">IF ${n.gate}</code>
        </div>
        <div class="kv-item emerald">
          <span class="kv-label">十層微動作與感官體感表徵 (10-LAYER MICRO-KINEMATICS)</span>
          ${bindSlotText(n.micro)}
        </div>
        <div class="kv-item violet">
          <span class="kv-label">IPOCL 因果鏈 × CK3 籌碼 × Versu 慣習</span>
          <div><b>• 因果/籌碼：</b>${n.hook}</div>
          <div><b>• 社交慣習：</b>${n.practice}</div>
        </div>
        <div class="kv-item crimson">
          <span class="kv-label">本機 Rust 現況赤字對照 (INWARD DEFICIT AUDIT)</span>
          ${n.deficit}
        </div>
      </div>
    </div>
    <div class="sec-box">
      <div class="sec-title"><span>🌿 下一階平行宇宙分岔 (${kids.length} 條路徑)</span></div>
      ${kidsHtml}
    </div>
  `;

  rp.querySelectorAll('[data-jump]').forEach(el => {
    el.addEventListener('click', () => {
      const jid = el.getAttribute('data-jump');
      const target = (n.children || []).find(c => c.id === jid);
      if (target) {
        state.selectedNode = target;
        state.forcedNodeIds.clear();
        state.forcedNodeIds.add(target.id);
        renderGraph();
      }
    });
  });
}

function renderTabs() {
  const tc = document.getElementById('treeTabs');
  let th = '';
  DELOS_TREES.forEach((u, idx) => {
    th += `<button class="tab-btn ${state.activeTreeIdx === idx ? 'active' : ''}" data-tidx="${idx}">${u.tab}</button>`;
  });
  th += `<button class="tab-btn ${state.activeTreeIdx === -1 ? 'active' : ''}" data-tidx="-1">🌌 五大宇宙全展開 (1265節點同屏)</button>`;
  tc.innerHTML = th;

  tc.querySelectorAll('.tab-btn').forEach(btn => {
    btn.addEventListener('click', () => {
      state.activeTreeIdx = parseInt(btn.getAttribute('data-tidx'), 10);
      state.personalTree = null;
      state.selectedNode = null;
      renderTabs();
      renderGraph(true);
    });
  });
}

function initTabsAndControls() {
  renderTabs();

  document.getElementById('btnExpandAll').addEventListener('click', () => {
    state.compactFan = !state.compactFan;
    renderGraph(true);
  });

  document.getElementById('btnFitView').addEventListener('click', () => {
    state.panX = 25;
    state.panY = 30;
    state.scale = state.activeTreeIdx === -1 ? 0.36 : 0.64;
    renderGraph(true);
  });

  // Pan & Zoom on canvasWrap
  const wrap = document.getElementById('canvasWrap');
  let dragging = false, sx = 0, sy = 0;
  wrap.addEventListener('mousedown', e => {
    if (e.target.closest('.delos-node') || e.target.closest('.hud-pill')) return;
    dragging = true; sx = e.clientX - state.panX; sy = e.clientY - state.panY;
  });
  window.addEventListener('mousemove', e => {
    if (!dragging) return;
    state.panX = e.clientX - sx;
    state.panY = e.clientY - sy;
    document.getElementById('viewportG').setAttribute('transform', `translate(${state.panX},${state.panY}) scale(${state.scale})`);
  });
  window.addEventListener('mouseup', () => { dragging = false; });
  wrap.addEventListener('wheel', e => {
    e.preventDefault();
    const factor = e.deltaY < 0 ? 1.12 : 0.89;
    state.scale = Math.max(0.18, Math.min(2.2, state.scale * factor));
    document.getElementById('viewportG').setAttribute('transform', `translate(${state.panX},${state.panY}) scale(${state.scale})`);
  }, { passive: false });

  // Live NPC loader from /api/eco/entities (filtering 1,772 real human residents)
  fetch('/api/eco/entities').then(r => r.json()).then(data => {
    const rawList = Array.isArray(data) ? data : (data.entities || []);
    const list = rawList.filter(e => e.kind === 'npc' && !['小怪','獸群','霸主','奇獸','靈禽'].some(k => (e.title || '').includes(k)));
    const sel = document.getElementById('liveNpcSelect');
    sel.innerHTML = `<option value="">-- 載入線上真實居民 (${list.length} 名人類居民一人一樹) --</option>`;
    list.slice(0, 120).forEach((ent, i) => {
      const opt = document.createElement('option');
      opt.value = i;
      const vShort = ent.held_vessel ? ` | 器物:${ent.held_vessel.split('（')[0]}` : '';
      const csTag = ent.cornerstone ? ` | 錨點:${ent.cornerstone}` : '';
      opt.textContent = `🟢 ${ent.name} (${ent.title || '居民'}${csTag}${vShort} | Mg:${ent.magnesium ?? 12})`;
      sel.appendChild(opt);
    });
    sel.addEventListener('change', () => {
      const idx = parseInt(sel.value, 10);
      if (!isNaN(idx) && list[idx]) {
        const e = list[idx];
        state.boundSlots = deriveEntitySlots(e);
        state.personalTree = {
          tab: `🧬 ${state.boundSlots.name} 專屬因果樹`,
          root: buildPersonalTreeForResident(e, state.boundSlots)
        };
        const t = e.title || '';
        if (t.includes('鐵') || t.includes('鍛') || t.includes('木') || t.includes('匠') || t.includes('百工')) {
          state.activeTreeIdx = 1;
        } else if (t.includes('獵') || t.includes('銃') || t.includes('漁') || t.includes('船')) {
          state.activeTreeIdx = 2;
        } else if (t.includes('商') || t.includes('執事') || t.includes('行旅')) {
          state.activeTreeIdx = 3;
        }
        state.params.mg = Math.min(80, Math.max(0, Math.round((e.magnesium ?? 12) % 80)));
        state.params.stress = Math.min(100, Math.max(0, e.stress ?? 32));
        state.params.flow = (e.breath_habit === '鍛爐沉息' || t.includes('匠')) ? 86 : 62;
        state.params.bold = (t.includes('獵') || t.includes('銃') || e.breath_habit === '百戰烈息') ? 85 : 54;
        state.params.pride = (e.breath_habit === '靜室清息' || t.includes('執事') || t.includes('師')) ? 80 : 55;
        state.forcedNodeIds.clear();
        state.selectedNode = null;
        renderTabs();
        renderLeftPanel();
        renderGraph(true);
      } else {
        state.boundSlots = null;
        state.personalTree = null;
        renderGraph(true);
      }
    });
  }).catch(() => {});
}

window.addEventListener('DOMContentLoaded', () => {
  initTabsAndControls();
  renderLeftPanel();
  renderGraph(true);
});
</script>
</body>
</html>
