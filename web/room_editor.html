<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>六角格地圖編輯器 v2.0.0</title>
  <style>
    :root { --bg:#0f1117; --panel:#161a23; --muted:#8f9bb3; --line:#2a3040; --text:#e7ebf5; --acc:#7dd3fc; --warn:#fb7185; --ok:#86efac; }
    * { box-sizing: border-box; }
    body { margin:0; background:var(--bg); color:var(--text); font-family: "Noto Sans TC", "PingFang TC", sans-serif; }
    .app { display:grid; grid-template-columns: 320px 1fr; height:100vh; }
    .panel { background:var(--panel); border-right:1px solid var(--line); padding:12px; overflow:auto; }
    .canvas-wrap { position:relative; overflow:hidden; }
    .toolbar { display:flex; flex-wrap:wrap; gap:8px; margin-bottom:10px; }
    button { border:1px solid var(--line); background:#1f2634; color:var(--text); border-radius:8px; padding:6px 10px; cursor:pointer; }
    button.active { border-color:var(--acc); box-shadow:0 0 0 1px var(--acc) inset; }
    button.danger { border-color:#5c1d26; color:#fecdd3; }
    .hint { color:var(--muted); font-size:12px; line-height:1.5; margin:8px 0; }
    kbd { font-family: ui-monospace, monospace; font-size:11px; padding:1px 5px; border:1px solid var(--line); border-radius:4px; background:#0d1220; color:var(--text); }
    .section { border-top:1px solid var(--line); margin-top:10px; padding-top:10px; }
    .section h3 { margin:0 0 8px; font-size:14px; }
    .field { display:flex; flex-direction:column; gap:4px; margin:8px 0; }
    .field label { color:var(--muted); font-size:12px; }
    input, textarea { width:100%; border:1px solid var(--line); background:#0d1220; color:var(--text); border-radius:6px; padding:8px; }
    textarea { min-height:80px; resize:vertical; }
    .status {
      position: sticky; top: 0; z-index: 5;
      font-size:12px; color:#dbeafe; background:#111a2a;
      border:1px solid #274060; border-radius:8px;
      padding:8px 10px; margin-bottom:10px; min-height:18px;
    }
    .obj-row { border:1px solid var(--line); border-radius:8px; padding:8px; margin:8px 0; }
    .obj-head { display:flex; gap:6px; margin-bottom:6px; }
    .obj-head input { flex:1; }
    .obj-head button { white-space:nowrap; }
    .beh-rows { display:flex; flex-direction:column; gap:6px; margin:6px 0; }
    .beh-row { display:flex; gap:6px; align-items:flex-start; }
    .beh-lbl { min-width:48px; padding:8px 4px 0; color:var(--muted); font-size:12px; font-weight:600; }
    .beh-row textarea { flex:1; min-height:52px; }
    .beh-add-bar { display:flex; flex-wrap:wrap; gap:6px; margin-top:4px; }
    .beh-add-bar button { font-size:12px; padding:4px 8px; }
    #hex-canvas { display:block; width:100%; height:100%; cursor:default; }
    .ctx-menu {
      position:absolute; z-index:30; min-width:220px;
      border:1px solid var(--line); border-radius:8px;
      background:#0f1726; box-shadow:0 8px 24px rgba(0,0,0,.45);
      display:none; overflow:hidden;
    }
    .ctx-menu button {
      width:100%; text-align:left; border:0;
      border-bottom:1px solid #1f2b42; border-radius:0;
      background:transparent; padding:8px 10px;
    }
    .ctx-menu button:last-child { border-bottom:0; }
    .ctx-menu button:hover { background:#18243a; }
    .zoom-badge {
      position:absolute; bottom:12px; right:12px; z-index:10;
      display:flex; gap:4px; align-items:center;
    }
    .zoom-badge button { min-width:36px; text-align:center; }
    .panel-toggle { position:fixed; top:10px; left:10px; z-index:20; display:none; }
    .mobile-bar {
      display:none; position:fixed; left:0; right:0; bottom:0; z-index:20;
      background:rgba(15,17,23,.94); border-top:1px solid var(--line);
      padding:8px; gap:8px; align-items:center; justify-content:space-between;
    }
    .mobile-bar button { flex:1; min-height:40px; }
    @media (max-width: 900px) {
      .app { grid-template-columns: 1fr; }
      .panel {
        position:fixed; z-index:25; top:0; left:0; bottom:0;
        width:min(92vw,380px); transform:translateX(-101%); transition:transform .18s ease;
      }
      .panel.open { transform:translateX(0); }
      .panel-toggle { display:inline-flex; }
      .mobile-bar { display:flex; }
    }
  </style>
</head>
<body>
  <button id="btn-panel-toggle" class="panel-toggle">面板</button>
  <div class="app">
    <aside class="panel" id="editor-panel">
      <div class="status" id="status"></div>
      <div class="field" style="margin-bottom:8px;">
        <label>Zone 濾鏡</label>
        <select id="zone-filter" style="width:100%;border:1px solid var(--line);background:#0d1220;color:var(--text);border-radius:6px;padding:8px;">
          <option value="">全部顯示</option>
        </select>
      </div>
      <div class="toolbar">
        <button id="btn-refresh">重新載入</button>
        <button id="btn-toggle-edges">隱藏連線</button>
        <button id="btn-delete" class="danger">刪除房格</button>
      </div>
      <div class="toolbar">
        <button id="mode-off" class="active">選取</button>
        <button id="mode-one">單向連線</button>
        <button id="mode-two">雙向連線</button>
      </div>
      <div class="hint">點擊空白六角格建立房間。點擊已填充格選取。拖曳平移地圖。滾輪縮放。右鍵開啟選單。</div>

      <div class="section">
        <h3>新增路徑（出口 + 遊戲內移動）</h3>
        <p class="hint">建立 <code>exits</code>，並在起點（與雙向時的終點）自動寫入可 <code>Move</code> 的物件。</p>
        <div class="field">
          <label>起點房間</label>
          <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap;">
            <select id="path-from" style="flex:1;min-width:0;"></select>
            <button type="button" id="path-use-selected" title="使用目前選取">帶入選取</button>
          </div>
        </div>
        <div class="field"><label>終點房間</label><select id="path-to"></select></div>
        <div class="field"><label>此端方向名稱</label><input id="path-dir" type="text" placeholder="例：東、北小門" /></div>
        <div class="field"><label><input type="checkbox" id="path-reverse" checked /> 同時建立反向路徑</label></div>
        <div class="field" id="path-rev-wrap"><label>反向方向名稱</label><input id="path-reverse-dir" type="text" placeholder="留空則用起點房名稱" /></div>
        <div class="toolbar"><button type="button" id="btn-add-path" style="border-color:#1e3a5f;">建立路徑</button></div>
      </div>

      <div class="section">
        <h3>房間資料</h3>
        <div class="field"><label>房間 ID</label><input id="f-id" disabled /></div>
        <div class="field"><label>名稱</label><input id="f-name" /></div>
        <div class="field"><label>區域 zone</label><input id="f-zone" placeholder="street / alley / ..." /></div>
        <div class="field"><label>標籤 tags（逗號分隔）</label><input id="f-tags" /></div>
        <div class="field"><label>描述</label><textarea id="f-desc"></textarea></div>
      </div>

      <div class="section">
        <h3>可互動物件</h3>
        <div class="toolbar">
          <button id="btn-add-object">新增物件</button>
          <button id="btn-template">插入模板</button>
        </div>
        <div id="objects-form"></div>
        <div class="field">
          <label>進階 JSON</label>
          <textarea id="f-objects" placeholder='[{"id":"obj_tea","name":"茶壺","sockets":["Look"],"responses":{"Look":"茶香未散。"}}]'></textarea>
        </div>
        <div class="toolbar" style="margin-top:8px;">
          <button id="btn-save" style="border-color:#14532d;">儲存房間</button>
        </div>
        <p class="hint" style="margin-top:6px;">快捷鍵：<kbd>Ctrl</kbd>+<kbd>S</kbd> 儲存。</p>
      </div>
    </aside>

    <main class="canvas-wrap" id="wrap">
      <canvas id="hex-canvas"></canvas>
      <div id="ctx-menu" class="ctx-menu">
        <button id="ctx-create-room">在此格建立房間</button>
        <button id="ctx-import-watabou">從此六角載入 Watabou JSON…</button>
      </div>
      <div class="zoom-badge">
        <button id="btn-zoom-out">−</button>
        <button id="btn-zoom-reset">100%</button>
        <button id="btn-zoom-in">+</button>
      </div>
    </main>
  </div>
  <div class="mobile-bar" id="mobile-bar">
    <button id="m-del">刪除</button>
    <button id="m-mode">選取</button>
    <button id="m-panel">面板</button>
  </div>
  <input id="watabou-json-input" type="file" accept=".json,application/json" style="display:none;" />
  <script src="/room_editor.js?v=2.0.0"></script>
</body>
</html>
