<!DOCTYPE html>
<html lang="zh-TW">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>山海地貌・全開啟大地圖</title>
<link rel="stylesheet" href="/world-atlas.css?v=20261112a4">
</head>
<body>
<header id="topbar">
  <button id="menu-btn" class="pill" aria-label="收展側欄">☰ 目錄</button>
  <h1>山海地貌・全開啟大地圖</h1>
  <span class="seal" title="真實 20m 地形與連續水系母圖">首發陸塊 #01・真實山河母圖</span>
  <div class="stats">
    <span class="badge">開放陸塊 <b id="st-cells">載入中…</b> 格</span>
    <span class="badge">面積 <b id="st-area">—</b></span>
    <span class="badge">斷層湧泉 <b id="st-spring">—</b></span>
    <span class="badge">在場實體 <b id="st-ent">—</b></span>
  </div>
  <nav id="modes" aria-label="底圖模式">
    <button class="pill mode" data-mode="terrain">山海實景</button>
    <button class="pill mode" data-mode="material">母岩土層</button>
    <button class="pill mode" data-mode="water">水脈湧泉</button>
    <button class="pill mode" data-mode="energy">散逸能量</button>
    <button class="pill mode" data-mode="landmass">自然陸塊界</button>
  </nav>
</header>

<div id="layout">
  <aside id="sidebar">
    <section>
      <h2>山河地標快跳</h2>
      <div id="landmarks" class="btn-grid"><span class="muted">載入中…</span></div>
    </section>
    <section>
      <h2>視角預設</h2>
      <div class="btn-grid two">
        <button class="pill" id="btn-fit">全陸塊總覽</button>
        <button class="pill" id="btn-origin">原點 (0,0) 微觀</button>
      </div>
    </section>
    <section>
      <h2>當前底圖圖例</h2>
      <div id="legend"></div>
    </section>
    <section class="grow">
      <h2>在場人物目錄 <button id="btn-refresh" class="mini" title="重新整理人物位置">↻ 重新整理</button></h2>
      <input id="ent-search" type="search" placeholder="搜尋人物、生靈、活動…">
      <div class="chips" id="ent-filter">
        <button class="chip on" data-k="all">全部</button>
        <button class="chip" data-k="human">人物</button>
        <button class="chip" data-k="creature">生靈</button>
      </div>
      <div id="ent-list"></div>
    </section>
  </aside>

  <main id="stage">
    <canvas id="atlas-canvas"></canvas>
    <div id="hud">
      <span id="hud-pos">(0, 0)</span>
      <span id="hud-zoom">縮放 —</span>
      <span id="hud-load">載入底圖中…</span>
    </div>
    <div id="zoom-ctl">
      <button class="pill" id="z-in" aria-label="放大">＋</button>
      <button class="pill" id="z-out" aria-label="縮小">－</button>
    </div>
    <div id="toast" hidden></div>

    <aside id="inspector" class="hidden" aria-live="polite">
      <button id="insp-close" class="mini" aria-label="關閉">✕</button>
      <div id="insp-body"></div>
    </aside>
  </main>
</div>
<script src="/world-atlas.js?v=20261112a4"></script>
</body>
</html>
