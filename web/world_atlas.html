<!DOCTYPE html>
<html lang="zh-Hant-TW">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>奇點世界｜銀鷗島實況全開大地圖・設計者審閱台</title>
<link rel="stylesheet" href="/world-atlas.css?v=20261126r2" />
</head>
<body>
<header class="wa-header">
  <div class="wa-brand">
    <h1>奇點世界｜實況全開大地圖</h1>
    <span class="wa-clock" id="waClock">載入世界時鐘…</span>
    <span class="wa-ledger-pill" id="waLedgerPill">對帳中…</span>
  </div>
  <div class="wa-top-actions">
    <label class="wa-check">
      <input type="checkbox" id="chkUnbuilt" checked />
      <span>鄉野村莊與實體車船</span>
    </label>
    <label class="wa-check">
      <input type="checkbox" id="chkOcc" checked />
      <span>即時人數徽記</span>
    </label>
    <label class="wa-check">
      <input type="checkbox" id="chkAutoPoll" checked />
      <span>自動脈動 (5s)</span>
    </label>
    <button type="button" id="btnRefresh">↻ 立即同步</button>
    <button type="button" id="btnTheme">燭夜／宣紙</button>
    <a class="wa-link-btn" href="/chronicle">📖 人物誌列傳</a>
  </div>
</header>

<nav class="wa-mobile-tabs" id="waMobileTabs" aria-label="行動端檢視切換">
  <button type="button" class="active" data-mpane="map">🗺️ 實況輿圖</button>
  <button type="button" data-mpane="left">👥 活人與稽核</button>
  <button type="button" data-mpane="right">📋 場所與人物卡</button>
</nav>

<div class="wa-workspace" id="waWorkspace" data-mobile-pane="map">
  <aside class="wa-left" id="waLeft">
    <div class="wa-pane-tabs" id="leftTabs">
      <button type="button" class="active" data-ltab="residents">活人名冊</button>
      <button type="button" data-ltab="pulse">自主發展實況</button>
      <button type="button" data-ltab="audit">落實度稽核</button>
    </div>

    <div class="wa-ltab-body" id="ltabResidents">
      <div class="wa-filter-box">
        <input type="search" id="resSearch" placeholder="搜尋姓名、行當、所在場所、心事…" />
        <div class="wa-pills" id="resTownPills">
          <button type="button" class="active" data-town="all">全島</button>
          <button type="button" data-town="white_gull_harbor">白鷗港</button>
          <button type="button" data-town="gull_tail_port">鷗尾漁港</button>
          <button type="button" data-town="west_strait_ferry">西峽渡口</button>
          <button type="button" data-town="greypine_post">灰松林驛</button>
          <button type="button" data-town="north_cape_beacon">北岬燈塔</button>
          <button type="button" data-town="rural">鄉野29村莊</button>
        </div>
        <div class="wa-pills" id="resActPills">
          <button type="button" class="active" data-act="all">全部狀態</button>
          <button type="button" data-act="moving">趕路中</button>
          <button type="button" data-act="at_work">在崗營生</button>
          <button type="button" data-act="wild">野採／探窟</button>
          <button type="button" data-act="concern">心有掛念</button>
        </div>
      </div>
      <div class="wa-scroll-list" id="resList"></div>
    </div>

    <div class="wa-ltab-body hidden" id="ltabPulse">
      <div class="wa-scroll-list" id="pulseBody"></div>
    </div>

    <div class="wa-ltab-body hidden" id="ltabAudit">
      <div class="wa-scroll-list" id="auditBody"></div>
    </div>
  </aside>

  <main class="wa-center" id="waCenter">
    <div class="wa-scale-bar" id="scaleBar">
      <button type="button" class="active" data-scale="island">全島無縫水彩 (93格)</button>
      <button type="button" data-scale="town:white_gull_harbor">白鷗港</button>
      <button type="button" data-scale="town:gull_tail_port">鷗尾漁港</button>
      <button type="button" data-scale="town:west_strait_ferry">西峽渡口</button>
      <button type="button" data-scale="town:greypine_post">灰松林驛</button>
      <button type="button" data-scale="town:north_cape_beacon">北岬燈塔</button>
      <select id="waCellMapSelect" class="wa-cell-select" aria-label="鄉野聚落／封村／營寨快選">
        <option value="">🏘️ 鄉野聚落／封村／營寨快選…</option>
      </select>
      <button type="button" data-scale="dungeon">試煉坑總覽</button>
      <button type="button" data-scale="dngroom:oi:dng_pit:entry">①塌陷洞口</button>
      <button type="button" data-scale="dngroom:oi:dng_pit:hall">②斷柱前廳</button>
      <button type="button" data-scale="dngroom:oi:dng_pit:side">③棄械偏室</button>
      <button type="button" data-scale="dngroom:oi:dng_pit:stele">④古銘文室</button>
      <button type="button" data-scale="dngroom:oi:dng_pit:lair">⑤吞石蛛巢</button>
      <button type="button" data-scale="dngroom:oi:dng_pit:altar">⑥地脈石台</button>
    </div>

    <div class="wa-map-viewport" id="mapViewport">
      <canvas id="waCanvas" class="wa-map-canvas" role="img" aria-label="銀鷗島無迷霧全開水彩活態輿圖"></canvas>
      <div class="wa-svg-host hidden" id="svgHost"></div>

      <div class="wa-map-zoom">
        <button type="button" id="btnZoomIn" aria-label="放大">＋</button>
        <button type="button" id="btnZoomOut" aria-label="縮小">－</button>
        <button type="button" id="btnZoomReset" title="重置視角">復位</button>
      </div>

      <div class="wa-map-legend" id="mapLegend"></div>
      <div class="wa-mobile-pick-bar hidden" id="mobilePickBar"></div>
    </div>
  </main>

  <aside class="wa-right" id="waRight">
    <div class="wa-right-scroll" id="inspectorBody">
      <div class="wa-empty-hint">點選地圖上任意地塊、街道、鋪號、支巷屋頂，或左側任一位居民，即可在此檢視即時後台狀態、木箱存貨與人物內心盤算。</div>
    </div>
  </aside>
</div>

<script src="/island-parchment-map.js?v=20261126r8"></script>
<script src="/world-atlas-panels.js?v=20261126r2"></script>
<script src="/world-atlas.js?v=20261126r2"></script>
</body>
</html>
