<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<title>奇點 · 卡片化 UI 提案</title>
<style>
  :root {
    --paper: #f3ead4;
    --paper-shadow: #e8dcbf;
    --ink: #2a2418;
    --ink-soft: #5a4f3c;
    --ink-fade: #8a7d66;
    --accent: #7a5428;
    --card-bg: #faf3dd;
    --card-border: #c9b88f;
    --card-hover: #fff8e3;
    --new-glow: #d4a94a;
    --event-bg: #ebe0c2;
    --trail: #b8a67a;
    --here: #7a5428;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; background: var(--paper); color: var(--ink); font-family: "Noto Serif TC", "Source Han Serif", serif; }

  .app {
    display: grid;
    grid-template-rows: 36px 1fr 160px 44px;
    height: 100vh;
    /* 頂欄 36px 沿用既有 game.css 樣式；第三 row 為 log(左) + 大地圖(右正方形) */
    max-width: 900px;
    margin: 0 auto;
    border-left: 1px solid var(--paper-shadow);
    border-right: 1px solid var(--paper-shadow);
  }

  /* 頂欄（沿用既有 game.css top-bar 三欄結構：日期 | 圓日晷 | 時辰） */
  .topbar {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: center;
    padding: 0 14px;
    gap: 14px;
    background: var(--paper);
    border-bottom: 1px solid var(--card-border);
    color: var(--ink-soft);
    font-size: 13px;
    letter-spacing: 2px;
  }
  .topbar .game-date { text-align: left; }
  .topbar .sundial-svg { width: 24px; height: 24px; color: var(--ink-soft); }
  .topbar .game-clock { text-align: right; }
  .topbar .game-clock .label { color: var(--ink-fade); margin-left: 6px; font-size: 12px; }

  /* 中間兩行字 */
  .topbar .status {
    text-align: center;
    line-height: 1.5;
  }
  .topbar .status .line1 {
    font-size: 15px;
    color: var(--ink);
    letter-spacing: 3px;
  }
  .topbar .status .line1 .name {
    font-weight: 600;
    margin-right: 10px;
  }
  .topbar .status .line2 {
    font-size: 12px;
    color: var(--ink-fade);
    letter-spacing: 2px;
    margin-top: 2px;
  }
  .topbar .status .line2 .sep { margin: 0 8px; opacity: 0.5; }

  /* 左：圓形日晷 */
  .sundial {
    width: 44px;
    height: 44px;
    border-radius: 50%;
    background: #efe5c8;
    border: 1px solid #c9b88f;
    position: relative;
    box-shadow: inset 0 1px 2px rgba(0,0,0,0.08);
  }
  .sundial::before,
  .sundial::after {
    content: '';
    position: absolute;
    background: var(--ink-fade);
    opacity: 0.35;
  }
  /* 時辰刻度（十字） */
  .sundial::before {
    top: 3px; bottom: 3px;
    left: 50%;
    width: 1px;
    transform: translateX(-0.5px);
  }
  .sundial::after {
    left: 3px; right: 3px;
    top: 50%;
    height: 1px;
    transform: translateY(-0.5px);
  }
  /* 指針（辰初 ≈ 7am，指向東偏上 約 60 度） */
  .sundial .gnomon {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 16px;
    height: 2px;
    background: var(--accent);
    transform-origin: 0% 50%;
    transform: translate(0, -1px) rotate(-30deg);
    border-radius: 1px;
  }
  .sundial .center {
    position: absolute;
    top: 50%;
    left: 50%;
    width: 5px; height: 5px;
    background: var(--accent);
    border-radius: 50%;
    transform: translate(-50%, -50%);
  }

  /* 右：地形色塊 minimap（地形顏色=意象） */
  .minimap-inline {
    width: 44px;
    height: 44px;
    box-sizing: border-box;
    padding: 3px;
    background: #efe5c8;
    border: 1px solid #c9b88f;
    border-radius: 2px;
    display: grid;
    grid-template-columns: repeat(5, 1fr);
    grid-template-rows: repeat(5, 1fr);
    gap: 1px;
    justify-self: end;
  }
  .minimap-inline .cell {
    background: transparent;
    border-radius: 1px;
    position: relative;
  }
  /* 地形色 */
  .minimap-inline .cell.forest  { background: #6b8e5a; }
  .minimap-inline .cell.grass   { background: #a8b06a; }
  .minimap-inline .cell.hill    { background: #9a7a55; }
  .minimap-inline .cell.water   { background: #6a8aa8; }
  .minimap-inline .cell.waste   { background: #b8a683; }
  .minimap-inline .cell.village { background: #d4a94a; }
  /* 地標記號 */
  .minimap-inline .cell.landmark::after {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    width: 2px; height: 2px;
    background: #2a2418;
    border-radius: 50%;
    transform: translate(-50%, -50%);
  }
  /* 當前格高亮 */
  .minimap-inline .cell.here {
    box-shadow: 0 0 0 1.5px #f3ead4, 0 0 0 2.5px var(--accent);
    z-index: 2;
  }

  /* 主區：單欄卡片舞台 */
  .main {
    overflow: hidden;
  }

  .cards {
    padding: 18px 14px 18px 18px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 10px;
  }

  .cards .room-line {
    color: var(--ink-fade);
    font-size: 13px;
    letter-spacing: 2px;
    padding: 0 2px 4px 2px;
    border-bottom: 1px dashed var(--card-border);
    margin-bottom: 6px;
  }

  .card {
    display: flex;
    align-items: center;
    padding: 11px 14px;
    background: var(--card-bg);
    border: 1px solid var(--card-border);
    border-radius: 3px;
    cursor: pointer;
    transition: background 0.15s, transform 0.1s;
    box-shadow: 0 1px 0 var(--paper-shadow);
  }
  .card:hover { background: var(--card-hover); }
  .card:active { transform: translateY(1px); }

  .card .icon {
    font-size: 22px;
    width: 30px;
    text-align: center;
    margin-right: 12px;
  }
  .card .label {
    font-size: 17px;
    letter-spacing: 2px;
    color: var(--ink);
  }
  .card .sub {
    margin-left: auto;
    font-size: 12px;
    color: var(--ink-fade);
    letter-spacing: 1px;
  }

  .card.exit { background: #f5ecd0; }
  .card.exit .label { color: var(--accent); }
  .card.new {
    animation: glow 1.4s ease-out;
    border-color: var(--new-glow);
  }
  @keyframes glow {
    0%   { background: #fff2c7; box-shadow: 0 0 12px var(--new-glow); }
    100% { background: var(--card-bg); box-shadow: 0 1px 0 var(--paper-shadow); }
  }

  /* 卡片展開（點開後） */
  .card.open {
    flex-direction: column;
    align-items: flex-start;
    background: var(--card-hover);
  }
  .card.open .row { display: flex; align-items: center; width: 100%; }
  .card.open .desc {
    margin-top: 10px;
    padding-top: 10px;
    border-top: 1px dashed var(--card-border);
    font-size: 15px;
    line-height: 1.9;
    color: var(--ink-soft);
    letter-spacing: 1.5px;
    width: 100%;
  }

  /* 第三 row：log(左) + 大地圖(右，正方形) 並排 */
  .log-map-row {
    display: grid;
    grid-template-columns: 1fr 160px;
    border-top: 1px solid var(--paper-shadow);
    height: 160px;
  }

  /* 事件流（文字 log，左側） */
  .events {
    background: var(--event-bg);
    padding: 10px 18px;
    display: flex;
    flex-direction: column;
    justify-content: flex-end;
    gap: 4px;
    font-size: 14px;
    line-height: 1.7;
    color: var(--ink-soft);
    letter-spacing: 1.5px;
    overflow: hidden;
  }

  /* 大地圖（右側正方形，160×160，地形色塊） */
  .bigmap {
    width: 160px;
    height: 160px;
    background: #efe5c8;
    border-left: 1px solid #c9b88f;
    padding: 6px;
    box-sizing: border-box;
    display: grid;
    grid-template-columns: repeat(9, 1fr);
    grid-template-rows: repeat(9, 1fr);
    gap: 1px;
  }
  .bigmap .cell {
    background: transparent;
    border-radius: 1px;
    position: relative;
  }
  .bigmap .cell.forest  { background: #6b8e5a; }
  .bigmap .cell.grass   { background: #a8b06a; }
  .bigmap .cell.hill    { background: #9a7a55; }
  .bigmap .cell.water   { background: #6a8aa8; }
  .bigmap .cell.waste   { background: #b8a683; }
  .bigmap .cell.village { background: #d4a94a; }
  .bigmap .cell.landmark::after {
    content: '';
    position: absolute;
    top: 50%; left: 50%;
    width: 3px; height: 3px;
    background: #2a2418;
    border-radius: 50%;
    transform: translate(-50%, -50%);
  }
  .bigmap .cell.here {
    box-shadow: 0 0 0 1.5px #f3ead4, 0 0 0 2.5px var(--accent);
    z-index: 2;
  }

  /* 底欄角色狀態（既有設計，不動其語義） */
  .statusbar {
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
    background: var(--paper-shadow);
    border-top: 1px solid #d9c8a3;
    font-size: 13px;
    letter-spacing: 2px;
    color: var(--ink);
  }
  .statusbar .name { font-weight: 600; letter-spacing: 3px; }
  .statusbar .stats { display: flex; gap: 16px; color: var(--ink-soft); }
  .statusbar .stats b { color: var(--ink); font-weight: normal; margin-right: 3px; }
  .events .line { opacity: 0; animation: fadein 0.6s forwards; }
  .events .line.old { opacity: 0.45; font-size: 13px; }
  @keyframes fadein { to { opacity: 1; } }
  .events .speaker { color: var(--accent); font-weight: 600; margin-right: 4px; }

  /* scrollbar */
  .cards::-webkit-scrollbar { width: 6px; }
  .cards::-webkit-scrollbar-thumb { background: var(--card-border); border-radius: 3px; }
</style>
</head>
<body>
<div class="app">

  <!-- 頂欄（沿用既有 game.css 三欄：日期 | 圓日晷 | 時辰） -->
  <div class="topbar">
    <div class="game-date">奇點曆 · 三年 五月 十七日</div>
    <svg class="sundial-svg" viewBox="0 0 32 32" aria-hidden="true">

      <div class="card">

        <div class="label">來時路</div>
        <div class="sub">回 小屋</div>
      </div>
    </div>
  </div>

  <!-- 第三 row：log（左）+ 大地圖（右正方形） -->
  <div class="log-map-row">
    <div class="events">
      <div class="line old">你走進一片松針地，晨光從枝縫漏下。</div>
      <div class="line old">一個拾柴老婦停下腳步，袖口擦汗。</div>
      <div class="line old">風向換了，帶著鐵鏽味。</div>
      <div class="line old"><span class="speaker">老婦</span>哼起不成調的曲子。</div>
      <div class="line"><span class="speaker">老婦</span>「後生仔……這玉，從哪得的？」</div>
    </div>
    <div class="bigmap" title="當前：松針地">
      <div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell forest"></div><div class="cell forest"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>
      <div class="cell"></div><div class="cell"></div><div class="cell forest"></div><div class="cell forest"></div><div class="cell forest"></div><div class="cell hill"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>

      <div class="cell"></div><div class="cell grass"></div><div class="cell forest"></div><div class="cell forest"></div><div class="cell hill"></div><div class="cell hill"></div><div class="cell waste"></div><div class="cell"></div><div class="cell"></div>
      <div class="cell grass"></div><div class="cell grass"></div><div class="cell forest"></div><div class="cell forest here"></div><div class="cell forest"></div><div class="cell hill"></div><div class="cell waste"></div><div class="cell"></div><div class="cell"></div>
      <div class="cell grass"></div><div class="cell grass"></div><div class="cell grass"></div><div class="cell village landmark"></div><div class="cell forest"></div><div class="cell forest"></div><div class="cell"></div><div class="cell"></div><div class="cell"></div>

    </div>
  </div>

  <!-- 底欄角色狀態 -->
  <div class="statusbar">
    <div class="name">葉 卅</div>
    <div class="stats">
      <span><b>氣</b>58／72</span>
      <span><b>神</b>44／60</span>
      <span><b>鎂</b>1,240</span>
      <span><b>頻</b>低</span>

  </div>

</div>
</body>
</html>
