<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>區域 SVG（Lakes of Secrets）viewBox 驗證</title>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { width: 100%; height: 100%; overflow: hidden; background: #1a1a2e; }
#map-container {
  width: 100%; height: 100%;
  position: relative;
  touch-action: none;
  -webkit-user-select: none; user-select: none;
  overflow: hidden;
}
#map-container svg {
  display: block; width: 100%; height: 100%;
  will-change: transform;
  transform-origin: 0 0;
}
#hud {
  position: fixed; top: 8px; left: 8px;
  background: rgba(0,0,0,0.7); color: #e0e0e0;
  font: 12px/1.3 monospace; padding: 6px 10px;
  border-radius: 6px; pointer-events: none; z-index: 10;
}
#controls {
  position: fixed; bottom: 12px; left: 8px; right: 8px;
  display: flex; gap: 6px; flex-wrap: wrap; z-index: 10;
}
#controls button {
  padding: 10px 14px; font-size: 14px;
  border: 1px solid #555; border-radius: 8px;
  background: rgba(0,0,0,0.75); color: #fff; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
#controls button:active { background: rgba(80,80,100,0.9); }
#zoom-controls {
  position: fixed; top: 50%; right: 10px;
  transform: translateY(-50%);
  display: flex; flex-direction: column; gap: 8px; z-index: 10;
}
#zoom-controls button {
  width: 48px; height: 48px; font-size: 24px;
  border: 1px solid #555; border-radius: 10px;
  background: rgba(0,0,0,0.75); color: #fff; cursor: pointer;
  -webkit-tap-highlight-color: transparent;
}
#zoom-controls button:active { background: rgba(80,80,100,0.9); }
</style>
</head>
<body>
<div id="hud"></div>
<div id="zoom-controls">
  <button id="btn-in">＋</button>
  <button id="btn-out">－</button>
</div>
<div id="controls">
  <button onclick="flyTo(2000,2000,900)">近看中心</button>
  <button onclick="flyTo(2000,2000,2800)">中距</button>
  <button onclick="flyTo(2000,2000,4200)">全景</button>
</div>
<div id="map-container"></div>

<script>
/** Watabou Perilous Shores 匯出，根節點 4000×4000（見 docs/map/world/lakes_of_secrets.svg） */
var SVG_FILE = 'maps/lakes_of_secrets.svg';
var vx, vy, vw, vh;
var svgEl = null;

var MIN_W = 600;
var MAX_W = 80000;

var cssOx = 0, cssOy = 0, cssScale = 1;
var rafId = 0;

function aspect() { return window.innerHeight / window.innerWidth; }

function commitView(x, y, w) {
  vx = x; vy = y;
  vw = Math.max(MIN_W, Math.min(MAX_W, w));
  vh = vw * aspect();
  cssOx = 0; cssOy = 0; cssScale = 1;
  if (svgEl) {
    svgEl.style.transform = '';
    svgEl.setAttribute('viewBox', vx + ' ' + vy + ' ' + vw + ' ' + vh);
  }
  updateHud();
}

function applyCssTransform() {
  if (!svgEl) return;
  svgEl.style.transform = 'translate(' + cssOx + 'px,' + cssOy + 'px) scale(' + cssScale + ')';
}

function scheduleFrame() {
  if (rafId) return;
  rafId = requestAnimationFrame(function() {
    rafId = 0;
    applyCssTransform();
  });
}

function updateHud() {
  var effectiveW = vw / cssScale;
  var z = (MAX_W / effectiveW).toFixed(1);
  document.getElementById('hud').textContent =
    'zoom ' + z + 'x  (' + effectiveW.toFixed(0) + '\u00d7' + (effectiveW * aspect()).toFixed(0) + ')';
}

function settle() {
  var rect = svgEl.getBoundingClientRect();
  var svgW = rect.width / cssScale;
  var svgH = rect.height / cssScale;
  var dxSvg = -cssOx / cssScale * (vw / svgW);
  var dySvg = -cssOy / cssScale * (vh / svgH);
  var nw = vw / cssScale;
  commitView(vx + dxSvg, vy + dySvg, nw);
}

function flyTo(cx, cy, w) {
  var h = w * aspect();
  commitView(cx - w / 2, cy - h / 2, w);
}

function zoomAt(factor, cx, cy) {
  var rect = svgEl.getBoundingClientRect();
  var nw = vw / (cssScale * factor);
  if (nw < MIN_W || nw > MAX_W) return;
  cssScale *= factor;
  cssOx = cx - (cx - cssOx) * factor;
  cssOy = cy - (cy - cssOy) * factor;
  scheduleFrame();
  updateHud();
}

async function init() {
  var resp = await fetch(SVG_FILE);
  var text = await resp.text();
  var container = document.getElementById('map-container');
  container.innerHTML = text;
  svgEl = container.querySelector('svg');
  svgEl.removeAttribute('width');
  svgEl.removeAttribute('height');
  svgEl.style.width = '100%';
  svgEl.style.height = '100%';

  flyTo(2000, 2000, 1200);

  // --- mouse drag ---
  var dragging = false, lastX = 0, lastY = 0;
  container.addEventListener('pointerdown', function(e) {
    if (e.pointerType === 'touch') return;
    dragging = true; lastX = e.clientX; lastY = e.clientY;
    container.setPointerCapture(e.pointerId);
  });
  container.addEventListener('pointermove', function(e) {
    if (!dragging || e.pointerType === 'touch') return;
    cssOx += e.clientX - lastX;
    cssOy += e.clientY - lastY;
    lastX = e.clientX; lastY = e.clientY;
    scheduleFrame();
  });
  container.addEventListener('pointerup', function(e) {
    if (!dragging) return;
    dragging = false;
    settle();
  });
  container.addEventListener('pointercancel', function() {
    if (!dragging) return;
    dragging = false;
    settle();
  });

  // --- mouse wheel ---
  container.addEventListener('wheel', function(e) {
    e.preventDefault();
    var f = e.deltaY < 0 ? 1.15 : 1 / 1.15;
    zoomAt(f, e.clientX, e.clientY);
    clearTimeout(container._wheelTimer);
    container._wheelTimer = setTimeout(settle, 120);
  }, { passive: false });

  // --- touch ---
  var tch = {};
  container.addEventListener('touchstart', function(e) {
    e.preventDefault();
    for (var i = 0; i < e.changedTouches.length; i++) {
      var t = e.changedTouches[i];
      tch[t.identifier] = { x: t.clientX, y: t.clientY };
    }
  }, { passive: false });

  container.addEventListener('touchmove', function(e) {
    e.preventDefault();
    if (e.touches.length === 1) {
      var t = e.touches[0], p = tch[t.identifier];
      if (!p) return;
      cssOx += t.clientX - p.x;
      cssOy += t.clientY - p.y;
      tch[t.identifier] = { x: t.clientX, y: t.clientY };
      scheduleFrame();
    } else if (e.touches.length === 2) {
      var t0 = e.touches[0], t1 = e.touches[1];
      var p0 = tch[t0.identifier], p1 = tch[t1.identifier];
      if (!p0 || !p1) {
        tch[t0.identifier] = { x: t0.clientX, y: t0.clientY };
        tch[t1.identifier] = { x: t1.clientX, y: t1.clientY };
        return;
      }
      var oldD = Math.hypot(p0.x - p1.x, p0.y - p1.y);
      var newD = Math.hypot(t0.clientX - t1.clientX, t0.clientY - t1.clientY);
      if (oldD > 10 && newD > 10) {
        var cx = (t0.clientX + t1.clientX) / 2;
        var cy = (t0.clientY + t1.clientY) / 2;
        zoomAt(newD / oldD, cx, cy);
      }
      var oCx = (p0.x + p1.x) / 2, oCy = (p0.y + p1.y) / 2;
      var nCx = (t0.clientX + t1.clientX) / 2, nCy = (t0.clientY + t1.clientY) / 2;
      cssOx += nCx - oCx;
      cssOy += nCy - oCy;
      tch[t0.identifier] = { x: t0.clientX, y: t0.clientY };
      tch[t1.identifier] = { x: t1.clientX, y: t1.clientY };
      scheduleFrame();
    }
  }, { passive: false });

  function touchEnd(e) {
    for (var i = 0; i < e.changedTouches.length; i++)
      delete tch[e.changedTouches[i].identifier];
    if (e.touches.length === 0) settle();
  }
  container.addEventListener('touchend', touchEnd);
  container.addEventListener('touchcancel', touchEnd);

  // --- zoom buttons ---
  document.getElementById('btn-in').addEventListener('click', function() {
    zoomAt(1.5, window.innerWidth / 2, window.innerHeight / 2);
    setTimeout(settle, 50);
  });
  document.getElementById('btn-out').addEventListener('click', function() {
    zoomAt(1 / 1.5, window.innerWidth / 2, window.innerHeight / 2);
    setTimeout(settle, 50);
  });

  window.addEventListener('resize', function() {
    vh = vw * aspect();
    if (svgEl) svgEl.setAttribute('viewBox', vx + ' ' + vy + ' ' + vw + ' ' + vh);
  });
}

init();
</script>
</body>
</html>
