const cv = document.getElementById("cv");
const ctx = cv.getContext("2d");
const stage = document.getElementById("stage");
let showTiles = true, showLabels = true, selId = null;
let camX = D.mw * 0.5, camY = D.mh * 0.5, camS = 0.1;

function fitAll() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  cv.width = stage.clientWidth * dpr; cv.height = stage.clientHeight * dpr;
  camX = D.mw * 0.5; camY = D.mh * 0.5;
  camS = Math.min(cv.width / D.mw, cv.height / D.mh) * 0.94;
  draw();
}
function fitCity() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  camX = 5250; camY = 6450;
  camS = Math.min(cv.width / 5600, cv.height / 7200) * 0.92;
  draw();
}
window.addEventListener("resize", () => {
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  cv.width = stage.clientWidth * dpr; cv.height = stage.clientHeight * dpr;
  draw();
});

function w2s(wx, wy) { return [cv.width * 0.5 + (wx - camX) * camS, cv.height * 0.5 + (wy - camY) * camS]; }
function s2w(sx, sy) { return [camX + (sx - cv.width * 0.5) / camS, camY + (sy - cv.height * 0.5) / camS]; }

function drawRotRect(wx, wy, ww, wh, deg, fill, stroke, lw) {
  const [cx, cy] = w2s(wx, wy);
  const w = ww * camS, h = wh * camS;
  ctx.save();
  ctx.translate(cx, cy);
  ctx.rotate(deg * Math.PI / 180);
  ctx.fillStyle = fill;
  ctx.strokeStyle = stroke;
  ctx.lineWidth = lw;
  ctx.beginPath();
  ctx.rect(-w * 0.5, -h * 0.5, w, h);
  ctx.fill();
  ctx.stroke();
  ctx.restore();
}

function draw() {
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  ctx.fillStyle = "#bfd6e2";
  ctx.fillRect(0, 0, cv.width, cv.height);

  // Land
  ctx.beginPath();
  let [x0, y0] = w2s(0, 0); ctx.moveTo(x0, y0);
  D.coast.forEach(p => { if (p[1] >= 0 && p[1] <= D.mh) { const [sx, sy] = w2s(p[0], p[1]); ctx.lineTo(sx, sy); } });
  let [x1, y1] = w2s(0, D.mh); ctx.lineTo(x1, y1);
  ctx.closePath();
  ctx.fillStyle = "#d6dfba"; ctx.fill();

  // Scenic zones
  ctx.font = `700 ${Math.round(12*dpr)}px "Noto Serif TC", serif`;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  D.zones.forEach(z => {
    ctx.beginPath();
    z.poly.forEach((p, i) => { const [sx, sy] = w2s(p[0], p[1]); if (i===0) ctx.moveTo(sx,sy); else ctx.lineTo(sx,sy); });
    ctx.closePath();
    ctx.fillStyle = z.kind === "forest" ? "#b0c898" : (z.kind === "field" ? "#e0d698" : (z.kind === "cliff" ? "#bcb0a0" : "#c6d8a8"));
    ctx.fill();
    ctx.strokeStyle = "rgba(110,100,82,0.5)"; ctx.lineWidth = 1.2 * dpr; ctx.stroke();
    const cx = z.poly.reduce((s,p)=>s+p[0],0)/z.poly.length, cy = z.poly.reduce((s,p)=>s+p[1],0)/z.poly.length;
    const [scx, scy] = w2s(cx, cy);
    ctx.fillStyle = "rgba(70,62,48,0.82)";
    ctx.fillText(`〔${z.name}〕`, scx, scy);
  });

  // City ground
  ctx.beginPath();
  const cPoly = D.towers.map(t => [t[1], t[2]]).concat([[7180,7350],[7060,6480],[7180,5680]]);
  cPoly.forEach((p, i) => { const [sx, sy] = w2s(p[0], p[1]); if (i===0) ctx.moveTo(sx,sy); else ctx.lineTo(sx,sy); });
  ctx.closePath();
  ctx.fillStyle = "#ebe0c6"; ctx.fill();

  // Rivers & Aqueduct
  ctx.lineCap = "round"; ctx.lineJoin = "round";
  ctx.beginPath(); D.creek.forEach((p,i)=>{ const [sx,sy]=w2s(p[0],p[1]); if(i===0)ctx.moveTo(sx,sy);else ctx.lineTo(sx,sy); });
  ctx.strokeStyle = "#3880b6"; ctx.lineWidth = Math.max(2*dpr, 65*camS); ctx.stroke();

  ctx.beginPath(); D.aqueduct.forEach((p,i)=>{ const [sx,sy]=w2s(p[0],p[1]); if(i===0)ctx.moveTo(sx,sy);else ctx.lineTo(sx,sy); });
  ctx.strokeStyle = "#847c70"; ctx.lineWidth = Math.max(2*dpr, 45*camS); ctx.stroke();

  ctx.beginPath(); D.river.forEach((p,i)=>{ const [sx,sy]=w2s(p[0],p[1]); if(i===0)ctx.moveTo(sx,sy);else ctx.lineTo(sx,sy); });
  ctx.strokeStyle = "#26689e"; ctx.lineWidth = Math.max(5*dpr, 240*camS); ctx.stroke();
  ctx.strokeStyle = "#68aed8"; ctx.lineWidth = Math.max(3*dpr, 165*camS); ctx.stroke();

  // Clean harbor basin east of coastline so river mouth opens naturally into sea
  ctx.beginPath();
  let [mx0, my0] = w2s(D.mw + 400, -400); ctx.moveTo(mx0, my0);
  D.coast.forEach(p => { if (p[1] >= -400 && p[1] <= D.mh + 400) { const [sx, sy] = w2s(p[0], p[1]); ctx.lineTo(sx, sy); } });
  let [mx1, my1] = w2s(D.mw + 400, D.mh + 400); ctx.lineTo(mx1, my1);
  ctx.closePath();
  ctx.fillStyle = "#b6d4e4"; ctx.fill();
  ctx.beginPath();
  D.coast.forEach((p, i) => { const [sx, sy] = w2s(p[0], p[1]); if (i===0) ctx.moveTo(sx,sy); else ctx.lineTo(sx,sy); });
  ctx.strokeStyle = "rgba(72,108,136,0.75)"; ctx.lineWidth = Math.max(1.5*dpr, 20*camS); ctx.stroke();

  // 3x4 Tile Grid
  if (showTiles) {
    ctx.font = `700 ${Math.round(11*dpr)}px "Noto Serif TC", serif`;
    ctx.textAlign = "left"; ctx.textBaseline = "top";
    for (let c = 0; c < 3; c++) {
      for (let r = 0; r < 4; r++) {
        const [gx, gy] = w2s(c * D.mw / 3, r * D.mh / 4);

        ctx.strokeRect(gx, gy, (D.mw / 3) * camS, (D.mh / 4) * camS);
        ctx.fillStyle = "rgba(52,78,102,0.78)";
        ctx.fillText(`4K 分片 R${r+1}-C${c+1}`, gx + 5*dpr, gy + 4*dpr);
      }
    }
  }

  // Roads & Alleys
  D.roads.forEach(rd => {
    ctx.beginPath(); rd[1].forEach((p,i)=>{ const [sx,sy]=w2s(p[0],p[1]); if(i===0)ctx.moveTo(sx,sy);else ctx.lineTo(sx,sy); });
    ctx.strokeStyle = "#765638"; ctx.lineWidth = Math.max(3*dpr, 115*camS); ctx.stroke();
    ctx.strokeStyle = "#dac6a2"; ctx.lineWidth = Math.max(1.8*dpr, 82*camS); ctx.stroke();
  });
  D.alleys.forEach(al => {
    ctx.beginPath(); al.pts.forEach((p,i)=>{ const [sx,sy]=w2s(p[0],p[1]); if(i===0)ctx.moveTo(sx,sy);else ctx.lineTo(sx,sy); });
    ctx.strokeStyle = "#8a6c4c"; ctx.lineWidth = Math.max(2*dpr, 72*camS); ctx.stroke();
    ctx.strokeStyle = "#e2d4b6"; ctx.lineWidth = Math.max(1.2*dpr, 48*camS); ctx.stroke();
  });

  // Facilities
  D.facilities.forEach(f => {
    if (f.kind === "plaza") {
      const [cx, cy] = w2s(f.x, f.y);
      ctx.beginPath(); ctx.arc(cx, cy, f.w * 0.5 * camS, 0, Math.PI*2);
      ctx.fillStyle = "#e4d8bc"; ctx.fill(); ctx.strokeStyle = "#806a4e"; ctx.lineWidth = 2*dpr; ctx.stroke();
      ctx.beginPath(); ctx.arc(cx, cy, Math.max(3*dpr, 45*camS), 0, Math.PI*2);
      ctx.fillStyle = "#4e9ac4"; ctx.fill(); ctx.stroke();
      return;
    }
    const col = f.kind === "market" ? "#ce7634" : (f.kind === "civic" ? "#5c7c9e" : (f.kind === "pier" ? "#a8845a" : (f.kind === "bridge" ? "#c4bcb0" : "#96a882")));
    drawRotRect(f.x, f.y, f.w, f.h, f.deg, col, selId === f.id ? "#ffbe0b" : "#30261e", (selId === f.id ? 3 : 1.5) * dpr);
  });

  // Walls & Breakwaters
  [D.towers.map(t=>[t[1],t[2]]), D.nbw, D.sbw].forEach( chain => {
    ctx.beginPath(); chain.forEach((p,i)=>{ const [sx,sy]=w2s(p[0],p[1]); if(i===0)ctx.moveTo(sx,sy);else ctx.lineTo(sx,sy); });
    ctx.strokeStyle = "#443a30"; ctx.lineWidth = Math.max(4*dpr, 125*camS); ctx.stroke();
    ctx.strokeStyle = "#a89e8e"; ctx.lineWidth = Math.max(2*dpr, 75*camS); ctx.stroke();
  });
  D.towers.forEach(t => {
    const [tx, ty] = w2s(t[1], t[2]);
    ctx.beginPath(); ctx.arc(tx, ty, Math.max(4.5*dpr, 95*camS), 0, Math.PI*2);
    ctx.fillStyle = "#b2a898"; ctx.fill(); ctx.strokeStyle = "#30261e"; ctx.lineWidth = 2*dpr; ctx.stroke();
  });

  // 95 Households
  ctx.font = `700 ${Math.max(9, Math.round(42*camS))}px "Noto Serif TC", serif`;
  ctx.textAlign = "center"; ctx.textBaseline = "middle";
  D.buildings.forEach(b => {
    const fill = b.kind === "shop" ? "#b03e2a" : (b.kind === "vacant" ? "#e2dcd0" : "#8a664a");
    const st = selId === b.nid ? "#ffbe0b" : (b.kind === "vacant" ? "#9e2c20" : "#34281e");
    drawRotRect(b.x, b.y, b.w, b.h, b.deg, fill, st, (selId === b.nid ? 3 : 1.3) * dpr);
    if (camS * b.w > 26 * dpr && b.short) {
      const [bx, by] = w2s(b.x, b.y);
      ctx.fillStyle = b.kind === "vacant" ? "#8a2218" : "#fffaf0";
      ctx.fillText(b.short, bx, by);

  // Labels (multi-offset candidate placement so all 5 shops, civic landmarks & 10 alleys stay legible!)
  if (showLabels) {
    ctx.font = `700 ${Math.round(11*dpr)}px "Noto Serif TC", serif`;
    const tags = [];
    D.buildings.filter(b => b.kind === "shop").forEach(b => tags.push({ x: b.x, y: b.y - 125, t: `★ ${b.name}`, bg: "#982618", fg: "#fff9ee" }));
    D.facilities.forEach(f => {
      if (f.kind === "market" || f.id === "pub_hall" || f.id === "pub_plaza")
        tags.push({ x: f.x, y: f.y - 115, t: `◆ ${f.name.split('（')[0]}`, bg: f.kind === "market" ? "#b65818" : "#eaf2f8", fg: f.kind === "market" ? "#fff9ee" : "#1e3c5c" });
    });
    D.alleys.forEach(al => {
      const p = al.pts[al.pts.length - 1];
      tags.push({ x: p[0], y: p[1], t: `【${al.name}・${al.count}戶】`, bg: "#fcf5e2", fg: "#4e2e12" });
    });
    D.facilities.forEach(f => {
      if (!(f.kind === "market" || f.id === "pub_hall" || f.id === "pub_plaza"))
        tags.push({ x: f.x, y: f.y - 110, t: `◆ ${f.name.split('（')[0]}`, bg: "#eaf2f8", fg: "#1e3c5c" });
    });
    const placed = [];
    const offs = [[0,0],[0,-21],[0,21],[-46,-16],[46,-16],[-46,16],[46,16],[0,-40],[0,40]];
    tags.forEach(tg => {

      if (px < -40 || px > cv.width + 40 || py < -20 || py > cv.height + 20) return;
      const tw = ctx.measureText(tg.t).width;
      const pw = tw + 11*dpr, ph = 18*dpr;
      let chosen = null;
      for (const [ox, oy] of offs) {
        const sx = px + ox*dpr, sy = py + oy*dpr;
        const box = [sx - pw*0.5, sy - ph*0.5, sx + pw*0.5, sy + ph*0.5];
        if (!placed.some(b => !(box[2]+2*dpr < b[0] || box[0]-2*dpr > b[2] || box[3]+2*dpr < b[1] || box[1]-2*dpr > b[3]))) {
          chosen = { sx, sy, box }; break;

      }

        if (Math.hypot(chosen.sx - px, chosen.sy - py) > 14*dpr) {

        }
        ctx.fillStyle = tg.bg; ctx.strokeStyle = "#6e5c46"; ctx.lineWidth = 1.2*dpr;
        ctx.beginPath(); ctx.roundRect(chosen.box[0], chosen.box[1], pw, ph, 5.5*dpr); ctx.fill(); ctx.stroke();
        ctx.fillStyle = tg.fg; ctx.fillText(tg.t, chosen.sx, chosen.sy + 0.5*dpr);
      }
    });
  }
}

const ptrs = new Map();
let down = null, pinchDist = 0;
cv.addEventListener("pointerdown", e => {
  cv.setPointerCapture(e.pointerId);
  ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  if (ptrs.size === 1) down = {x:e.clientX, y:e.clientY};
  else if (ptrs.size === 2) {
    down = null;
    const [a, b] = [...ptrs.values()];
    pinchDist = Math.hypot(a.x - b.x, a.y - b.y);
  }
});
cv.addEventListener("pointermove", e => {
  if (!ptrs.has(e.pointerId)) return;
  const prev = ptrs.get(e.pointerId);
  ptrs.set(e.pointerId, {x:e.clientX, y:e.clientY});
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  if (ptrs.size === 1) {
    camX -= ((e.clientX - prev.x) * dpr) / camS;
    camY -= ((e.clientY - prev.y) * dpr) / camS;
    draw();
  } else if (ptrs.size === 2) {
    const [a, b] = [...ptrs.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    if (pinchDist > 8 && d > 8) {
      const rect = cv.getBoundingClientRect();
      const mx = ((a.x + b.x) * 0.5 - rect.left) * dpr, my = ((a.y + b.y) * 0.5 - rect.top) * dpr;
      const [wx, wy] = s2w(mx, my);
      camS = Math.max(0.04, Math.min(1.6, camS * (d / pinchDist)));
      camX = wx - (mx - cv.width * 0.5) / camS;
      camY = wy - (my - cv.height * 0.5) / camS;
      pinchDist = d;
      draw();
    }
  }
});
const onUp = e => {
  if (ptrs.size === 1 && down && Math.hypot(e.clientX - down.x, e.clientY - down.y) < 8) {
    const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
    const rect = cv.getBoundingClientRect();
    const [wx, wy] = s2w((e.clientX - rect.left) * dpr, (e.clientY - rect.top) * dpr);
    let hit = null, bestD = 220;
    D.buildings.forEach(b => { const d = Math.hypot(b.x - wx, b.y - wy); if (d < bestD) { bestD = d; hit = { id: b.nid, title: b.name, body: b.full }; } });
    D.facilities.forEach(f => { const d = Math.hypot(f.x - wx, f.y - wy); if (d < bestD) { bestD = d; hit = { id: f.id, title: f.name, body: f.desc }; } });
    if (hit) {
      selId = hit.id;
      document.getElementById("infTitle").textContent = hit.title;
      document.getElementById("infBody").textContent = hit.body;
      draw();
    }
  }
  ptrs.delete(e.pointerId);
  if (ptrs.size < 2) pinchDist = 0;
  if (ptrs.size === 0) down = null;
};
cv.addEventListener("pointerup", onUp);
cv.addEventListener("pointercancel", onUp);
cv.addEventListener("wheel", e => {
  e.preventDefault();
  const dpr = Math.min(window.devicePixelRatio || 1, 2.5);
  const rect = cv.getBoundingClientRect();
  const sx = (e.clientX - rect.left) * dpr, sy = (e.clientY - rect.top) * dpr;
  const [wx, wy] = s2w(sx, sy);
  camS = Math.max(0.04, Math.min(1.6, camS * (e.deltaY < 0 ? 1.22 : 1/1.22)));
  camX = wx - (sx - cv.width * 0.5) / camS;
  camY = wy - (sy - cv.height * 0.5) / camS;
  draw();
}, { passive: false });

document.getElementById("btnTiles").onclick = function() { showTiles = !showTiles; this.classList.toggle("on", showTiles); draw(); };
document.getElementById("btnLabels").onclick = function() { showLabels = !showLabels; this.classList.toggle("on", showLabels); draw(); };
document.getElementById("btnCity").onclick = fitCity;
document.getElementById("btnAll").onclick = fitAll;
fitAll();
</script>
